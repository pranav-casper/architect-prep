<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CCAR-F exam prep with a Learner path and an exam-style Practitioner path.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<title>Architect Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered card column on warm paper. Ode palette from the AI Day Master Deck. Light only, by choice. */
:root {
  color-scheme: light;
  --bg: #f3f1ec;
  --surface: #fdfdfb;
  --ink: #3c2e2a;
  --body-ink: #5c504c;
  --muted: #857c78;
  --line: #e2ddd8;
  --accent: #3c2e2a;
  --accent-soft: #e6e3ee;
  --sun: #cee5ee;
  --sun-soft: #f1f0ec;
  --good: #4e7a5d;
  --good-soft: #e3e9e4;
  --bad: #a9564b;
  --bad-soft: #f4e6e2;
  --tile: #f3f1ec;
  --shadow: 0 12px 40px rgba(60,46,42,.08);
  --d1: #3c2e2a; --d2: #6f9a80; --d3: #9aa863; --d4: #6ea6bd; --d5: #9586bd;
  --t1: #e3e9e4; --t2: #e8ebd7; --t3: #cee5ee; --t4: #e6e3ee; --t5: #e9e4df;
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .84em; background: var(--t1); color: var(--ink); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.025em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--d5); outline-offset: 2px; }

.top { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 500; letter-spacing: -.01em; font-size: 1.05rem; background: none; border: 0; cursor: pointer; padding: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); position: relative; }
.brand-mark::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--t4); right: -3px; top: -3px; }
.top-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; min-width: 0; }
.top-right .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }

main { max-width: 720px; margin: 0 auto; }
.screen { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(20px, 5vw, 36px); }
.eyebrow { font-size: .75rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 22px; font-weight: 500; background: var(--accent); transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
.btn { color: var(--surface); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(60,46,42,.18); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { box-shadow: none; border-color: var(--muted); }
.btn.small { padding: 7px 14px; font-size: .85rem; }
.link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; }

/* Welcome */
.hero-title { font-size: clamp(2.3rem, 7.5vw, 3.6rem); font-weight: 400; letter-spacing: -.035em; line-height: 1.05; }
.hero-title .hl { background: var(--t4); border-radius: .18em; padding: 0 .14em; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 500; font-size: .9rem; }
.field input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; transition: border-color .15s; }
.field input:focus { outline: none; border-color: var(--ink); }
.hint { font-size: .85rem; color: var(--muted); }
.err { color: var(--bad); font-size: .85rem; min-height: 1.2em; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fact { background: var(--t1); border-radius: 16px; padding: 10px 12px; }
.fact b { display: block; font-family: var(--display); font-weight: 400; letter-spacing: -.02em; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .75rem; color: var(--muted); }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, 1fr); } }

/* Path choice */
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .paths { grid-template-columns: 1fr; } }
.path { text-align: left; cursor: pointer; border: 1.5px solid transparent; background: var(--surface); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; transition: transform .2s, border-color .2s, box-shadow .2s; box-shadow: var(--shadow); }
.path:hover { transform: translateY(-3px); border-color: var(--ink); }
.path-head { display: flex; align-items: center; gap: 10px; }
.path h2 { font-size: 1.2rem; }
.path p { color: var(--body-ink); font-size: .88rem; margin: 0; line-height: 1.35; }
.path ul { margin: 0; padding-left: 16px; color: var(--body-ink); font-size: .8rem; display: flex; flex-direction: column; gap: 1px; line-height: 1.35; }
.path-icon { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; }
.path-icon svg { width: 20px; height: 20px; }
.path.learn { background: var(--t1); }
.path.learn .path-icon { background: var(--surface); color: var(--ink); }
.path.prac { background: var(--t4); }
.path.prac .path-icon { background: var(--surface); color: var(--ink); }
.path .go { margin-top: 2px; font-weight: 500; font-size: .9rem; color: var(--ink); }

/* Intro walkthrough */
.intro { min-height: 440px; display: flex; flex-direction: column; gap: 20px; }
.intro-stage { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.intro-stage h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 24px; background: var(--ink); }
.pop { animation: pop .5s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(10px); } to { opacity: 1; transform: none; } }
.big-num { font-family: var(--display); font-weight: 300; letter-spacing: -.04em; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bignums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.bignums > div { background: var(--tile); border-radius: 18px; padding: 16px; }
.bignums small { color: var(--muted); }
.dombar { display: flex; height: 44px; border-radius: 14px; overflow: hidden; gap: 3px; }
.dombar > div { height: 100%; transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; display: grid; place-items: center; color: var(--ink); font-weight: 500; font-size: .85rem; font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.domlist { display: flex; flex-direction: column; gap: 8px; }
.domlist div { display: flex; align-items: baseline; gap: 10px; font-size: .95rem; }
.domlist .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; transform: translateY(1px); }
.domlist em { font-style: normal; color: var(--muted); font-size: .85rem; }
.domlist b { font-variant-numeric: tabular-nums; min-width: 2.6em; font-weight: 500; }
.scen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .scen-grid { grid-template-columns: repeat(2, 1fr); } }
.scen { border: 1.5px dashed var(--line); border-radius: 18px; padding: 14px; font-size: .9rem; font-weight: 500; transition: all .4s; min-height: 76px; }
.scen small { display: block; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.scen.lit { border-style: solid; border-color: var(--t3); background: var(--t3); transform: translateY(-2px); }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { display: flex; gap: 14px; align-items: flex-start; background: var(--tile); border-radius: 16px; padding: 14px 16px; }
.rule .n { font-family: var(--display); font-weight: 400; font-size: 1.2rem; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; }
.rule b { display: block; }
.rule span { color: var(--muted); font-size: .92rem; }
.traps { display: flex; flex-wrap: wrap; gap: 8px; }
.trapchip { border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 500; background: var(--bad-soft); color: var(--ink); }

/* Quiz card */
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--ink); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--tile); color: var(--ink); }
.tag .sw { width: 8px; height: 8px; border-radius: 50%; }
.qprompt { font-size: clamp(1.1rem, 3.4vw, 1.3rem); font-weight: 400; letter-spacing: -.01em; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt[disabled] { cursor: default; }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 500; font-size: .85rem; background: var(--tile); color: var(--muted); transition: all .15s; }
.opt .txt { flex: 1; min-width: 0; padding-top: 3px; }
.opt.sel { border-color: var(--ink); background: var(--t4); }
.opt.sel .key { background: var(--ink); color: var(--surface); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt.dim .key { opacity: .5; }
.opt.dim .txt { color: var(--muted); }
[hidden] { display: none !important; }
.opt .rat { display: block; margin-top: 8px; font-size: .9rem; color: var(--muted); }
.opt .rat .trapchip { padding: 2px 8px; font-size: .72rem; margin-right: 6px; }
.opt .rat .okchip { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .72rem; font-weight: 500; background: var(--good); color: var(--surface); margin-right: 6px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.feedback { border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--t2); }
.feedback h3 { font-size: 1.2rem; font-weight: 500; }
.feedback .rulebox { border-left: 3px solid var(--ink); padding-left: 12px; font-weight: 600; }
.scenario-box { background: var(--tile); border-radius: 16px; padding: 14px 16px; font-size: .95rem; color: var(--muted); }
.scenario-box b { color: var(--ink); }
.conf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; font-weight: 500; }
.pill.on { border-color: var(--ink); background: var(--t4); }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .85rem; }
.timer.over { color: var(--bad); }
.kbd-hint { font-size: .78rem; color: var(--muted); }
@media (hover: none) { .kbd-hint { display: none; } }

/* Setup + results */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; }
.choice span { font-size: .85rem; color: var(--muted); }
.choice.on { border-color: var(--ink); background: var(--t4); }
.score { font-family: var(--display); font-weight: 300; letter-spacing: -.05em; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; font-size: .9rem; }
.bar-row .lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
.bar-row .lbl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.bar > div { height: 100%; border-radius: 99px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.insight { background: var(--t3); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.insight b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; }
.revisit { display: flex; flex-direction: column; gap: 10px; }
.revisit div { background: var(--tile); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.revisit b { display: block; }
.section-title { font-size: 1.15rem; font-weight: 500; }

/* Confetti */
.burst { position: fixed; pointer-events: none; z-index: 50; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: fly .8s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .burst { display: none; }
}
</style>

<header class="top">
  <button class="brand" id="brand" type="button" aria-label="Back to start"><span class="brand-mark" aria-hidden="true"></span>Architect Prep</button>
  <div class="top-right" id="topRight"></div>
</header>
<main id="app" aria-live="polite"></main>

<script>
const DATA = {"learner":{"concepts":[{"id":"c01","domain":1,"title":"The agentic loop","explain":"An agent is like a cook who keeps asking the recipe what to do next. Each time Claude replies, the reply carries a stop_reason that says why it stopped. If the reason is tool_use, Claude wants you to run a tool and hand back the result. If the reason is end_turn, Claude has finished.","rule":"Loop on stop_reason: keep going for tool_use and stop for end_turn.","questions":[{"id":"c01a","prompt":"Your agent calls Claude in a loop. What should decide whether the loop runs again?","options":["Whether the reply text contains a phrase like \"I am done\"","Whether the loop has already run five times","Whether stop_reason is tool_use or end_turn","Whether the reply contains any text at all"],"answer":2,"why":"The stop_reason field is the official signal for whether Claude wants a tool run or has finished."},{"id":"c01b","prompt":"Claude replies with stop_reason tool_use and asks to look up an order. What should your code do next?","options":["Run the tool and send back the result","Stop the loop and show the reply to the user","Ask Claude again with the same messages and no changes","Guess the order details and carry on without the tool"],"answer":0,"why":"A tool_use stop means Claude is waiting for the tool result, so you run it and send the result back."}]},{"id":"c02","domain":1,"title":"Rules enforced by code","explain":"A sign saying \"please wash your hands\" is a request, but a door that only opens after a soap sensor trips is a guarantee. Prompts are requests that Claude usually follows. Hooks and prerequisite gates are code that runs every time, so use them when a rule must never be broken.","rule":"If a rule must always hold, enforce it in code with a hook or gate, not in the prompt.","questions":[{"id":"c02a","prompt":"A refund agent must always verify the customer's identity before issuing a refund. Which approach is the most reliable?","options":["Add a bold line to the system prompt reminding it to verify","Add several example conversations that show verification first","Block the refund tool in code until verification passes","Ask the agent to double check its own steps before refunding"],"answer":2,"why":"A code gate runs every time, while prompts and examples only make the right behavior likely."},{"id":"c02b","prompt":"A hook can look at a tool call before it runs. A refund over 500 dollars must never go out without a manager. What should the hook do?","options":["Log a warning and let the refund go through anyway","Block the call and send the case to a human manager","Rewrite the amount down to 500 and run the call","Wait for Claude to mention the limit in its own reply"],"answer":1,"why":"A hook can stop the call before it runs and hand the case to a person, which guarantees the policy."}]},{"id":"c03","domain":1,"title":"Subagents need context","explain":"A subagent is like a contractor you hire for one job. The contractor starts with a blank slate and cannot read your earlier chats. A coordinator agent must put everything the helper needs into the task it hands over, and it should keep each helper focused on one job.","rule":"Subagents do not inherit your history, so pass what they need in the task itself.","questions":[{"id":"c03a","prompt":"A coordinator asks a research subagent to \"summarize the findings\". The subagent has no idea which findings. What is the root cause?","options":["The subagent model is too small to follow instructions","The coordinator never put the findings in the task","The subagent needs a much longer system prompt to work","The coordinator should do all the work without subagents"],"answer":1,"why":"Subagents start fresh, so the coordinator must include the findings in the task it sends."},{"id":"c03b","prompt":"A coordinator splits a report into search, analysis and writing helpers. What should each helper receive?","options":["The whole earlier conversation so it can work out the job","Nothing, because helpers can see the coordinator's memory","Only a short title and the helper can ask for the rest","A clear task that includes the inputs for that part"],"answer":3,"why":"Each helper works only from what the coordinator hands it, so the task must carry the needed inputs."}]},{"id":"c04","domain":1,"title":"Resume or fork a session","explain":"Think of a saved game. Resuming loads your save and carries on from the same point. Forking copies the save so you can try a risky path without losing the original. Use resume to continue the same work and fork to explore a different approach side by side.","rule":"Resume to continue the same thread and fork to branch off and compare options.","questions":[{"id":"c04a","prompt":"You finished a long code review yesterday and want to keep working on it today with all its context. What fits best?","options":["Start a fresh session and paste a rough summary from memory","Fork the session so the review is split into two copies","Ask Claude to redo the whole review from the beginning","Resume the earlier session so its history is still there"],"answer":3,"why":"Resuming reloads the same session, so the earlier context is available without any rebuilding."},{"id":"c04b","prompt":"You analyzed a codebase and now want to try two different refactoring plans without them affecting each other. What fits best?","options":["Fork the session once for each plan to keep them apart","Run both plans in one session and hope they do not clash","Resume the same session twice and edit both at once","Delete the analysis and begin each plan from scratch"],"answer":0,"why":"Forking gives each plan its own branch that starts from the shared analysis."}]},{"id":"c05","domain":2,"title":"Tool descriptions drive choice","explain":"Claude picks a tool the way you pick a drawer, by reading the label. If two labels sound alike, it will grab the wrong one. When Claude keeps choosing the wrong tool, the label is the first thing to fix, with clear wording about what the tool does and when to use it.","rule":"When Claude picks the wrong tool, fix the tool descriptions first.","questions":[{"id":"c05a","prompt":"Claude keeps calling get_customer when it should call lookup_order. Both descriptions just say \"Looks up data\". What is the best first fix?","options":["Merge both tools into one giant tool with a mode flag","Add twenty example chats showing the right choice","Build a classifier that picks the tool before Claude runs","Write clear descriptions that say what each tool covers"],"answer":3,"why":"Vague descriptions are the root cause, and clearer labels are the smallest fix that solves it."},{"id":"c05b","prompt":"Two search tools overlap and Claude often mixes them up. Which description change helps the most?","options":["Make both descriptions shorter so they are easier to scan","State what each tool searches and when not to use it","Repeat the tool name three times in each description","Add a line telling Claude to choose carefully each time"],"answer":1,"why":"Saying what each tool covers and when to avoid it gives Claude the facts it needs to choose."}]},{"id":"c06","domain":2,"title":"Tell the agent what failed","explain":"When a tool breaks, a vague \"something went wrong\" leaves the agent stuck. A good error says what kind of failure it was and whether trying again could help. Mark it with the isError flag so Claude knows it was a failure. Also, a search that finds nothing is a valid answer and is not an error.","rule":"Return structured errors with the failure type and retry advice, and keep empty results separate.","questions":[{"id":"c06a","prompt":"A tool times out and returns only the text \"Error\". The agent then retries a request that was invalid. What would help most?","options":["Return an isError result with a type and a retryable flag","Return an empty list so the agent gives up quietly","Raise the model's temperature so it tries new ideas","Hide the failure and let the agent work out the cause"],"answer":0,"why":"A flagged error that says its type and whether a retry can help lets the agent react correctly."},{"id":"c06b","prompt":"A customer search runs fine but no customer matches. How should the tool respond?","options":["Mark it isError because the agent did not get what it wanted","Throw an exception so the whole loop stops and restarts","Return a normal empty result to show nothing matched","Return a made up customer so the agent can keep going"],"answer":2,"why":"No matches is a valid outcome, so it should look different from a failure."}]},{"id":"c07","domain":2,"title":"Few tools and tool_choice","explain":"A worker with a small, well-labeled toolbox picks the right tool more often than one buried under dozens. Give each agent only the tools its job needs, usually around four or five. When you need a specific tool called, tool_choice can force it instead of hoping.","rule":"Give each agent a small set of relevant tools and use tool_choice to force a required call.","questions":[{"id":"c07a","prompt":"One agent has 18 tools and keeps picking poorly. What is the best fix?","options":["Add a longer prompt that explains each of the 18 tools","Give the agent only the few tools that fit its job","Rename all the tools so their names are all shorter","Switch to a larger model and keep every tool in place"],"answer":1,"why":"A smaller, focused tool set reduces confusion and is a proportionate fix."},{"id":"c07b","prompt":"Your app must always run extract_invoice on a document before anything else. What should you do?","options":["Write \"always call extract_invoice first\" in the prompt","Ask Claude to confirm the first step in its own words","Remove the other tools after the first answer arrives","Set tool_choice so that extract_invoice is forced"],"answer":3,"why":"Forcing the tool with tool_choice guarantees the call, while a prompt line only suggests it."}]},{"id":"c08","domain":3,"title":"CLAUDE.md levels","explain":"CLAUDE.md files are notes Claude reads at the start of a session. There are layers, much like house rules, street rules and city rules. A user-level file applies only to you, a project file in the repo is shared with the whole team, and a folder file applies only inside that folder.","rule":"Put team rules in the project CLAUDE.md in the repo, since user-level files are not shared.","questions":[{"id":"c08a","prompt":"Your team wants every developer's Claude to follow the same coding standards. Where should the rules live?","options":["In each developer's own user-level CLAUDE.md","In a note pinned in the team chat channel","In the project CLAUDE.md that is committed to the repo","In a long reminder typed at the start of each session"],"answer":2,"why":"A project file in version control reaches everyone who clones the repo."},{"id":"c08b","prompt":"A new teammate says Claude ignores the team's naming rules. The rules sit only in your own ~/.claude/CLAUDE.md. What is the cause?","options":["That file is personal, so teammates never see it","The teammate must be using an older version of the model","Claude forgets rules that are older than a week or so","The rules were written with too many words to be read"],"answer":0,"why":"User-level files stay on your machine, so teammates never see those rules."}]},{"id":"c09","domain":3,"title":"Rules for certain files","explain":"Some rules only matter for certain files, like test rules for test files. A rules file in the .claude/rules folder can carry a path pattern, called a glob, such as **/*.test.ts. Claude loads that rule only when it touches matching files, which keeps everything else uncluttered.","rule":"Use .claude/rules files with path globs for rules that apply to specific file types.","questions":[{"id":"c09a","prompt":"You want testing conventions to apply only to files ending in .test.ts, wherever they sit. What is the best setup?","options":["Put the conventions at the top of the root CLAUDE.md","Create a rule file with a glob that matches .test.ts","Tell Claude in chat to remember the conventions for tests","Copy a CLAUDE.md into every folder that holds a test"],"answer":1,"why":"A glob-scoped rule loads only for matching files and works in any folder."},{"id":"c09b","prompt":"Your root CLAUDE.md is long and full of rules that apply to only one area. What is the best cleanup?","options":["Delete all the rules and rely on Claude's own judgment","Make the root file longer so nothing can be missed","Move each area's rules into a glob-scoped rule file","Split the rules into several chat messages each session"],"answer":2,"why":"Scoped rule files load only when relevant, so the root file stays short."}]},{"id":"c10","domain":3,"title":"Claude Code in CI","explain":"A CI job runs with nobody at the keyboard, so Claude Code must not stop and ask questions. The -p flag runs it in non-interactive mode, where it takes one prompt, prints an answer and exits. Asking for JSON output makes the result easy for other tools to read.","rule":"In CI, run Claude Code with -p and request structured output so scripts can parse it.","questions":[{"id":"c10a","prompt":"A pipeline step starts Claude Code and then hangs forever waiting for input. What fixes it?","options":["Pipe in a long list of yes answers for every prompt","Run it with the -p flag for non-interactive mode","Increase the pipeline timeout to several more hours","Run the job twice in a row and keep the faster run"],"answer":1,"why":"The -p flag makes Claude Code run once without waiting for a person to type."},{"id":"c10b","prompt":"A script must read Claude's review comments from a CI run. What is the most dependable output?","options":["Free text that the script searches for the word \"issue\"","A screenshot of the terminal saved by the CI system","A long essay that a person reads and copies by hand","Structured JSON output that scripts can parse directly"],"answer":3,"why":"Structured JSON gives scripts predictable fields, so no guessing is needed."}]},{"id":"c11","domain":4,"title":"Explicit criteria beat vague words","explain":"Telling Claude to \"be careful\" or \"only flag important issues\" is like telling a referee to \"call fouls fairly\". Nobody knows where the line is. List the exact things to flag and the things to skip, ideally with a short example, and the results become steady.","rule":"Replace vague words like careful or important with specific, testable criteria.","questions":[{"id":"c11a","prompt":"Your code review prompt says \"only report important issues\", yet the output is inconsistent. What is the best fix?","options":["List the exact kinds of issues to report or to skip","Add the word very before important in the prompt","Run the review three times and use the average","Ask Claude to rate its own confidence on every issue"],"answer":0,"why":"Specific criteria remove the guesswork that vague words leave behind."},{"id":"c11b","prompt":"A summarizer is told to \"keep it short but complete\" and the length keeps varying. What helps most?","options":["Tell it to try much harder to be consistent","Add a polite note asking for steady output each time","Switch off summaries and let people read everything","State a clear limit such as three one-line bullets"],"answer":3,"why":"A concrete limit gives Claude a target it can meet every time."}]},{"id":"c12","domain":4,"title":"Schemas for structured output","explain":"If you need data in a fixed shape, give Claude a tool with a JSON schema and have it fill in the fields. This guarantees the shape is valid, much like a form with labeled boxes. A schema cannot guarantee the values are true, though, so make a field nullable when the data may be missing instead of forcing a guess.","rule":"Use tool_use with a JSON schema for shape, and allow null so Claude never has to invent values.","questions":[{"id":"c12a","prompt":"You need invoice data as clean JSON every time. Which approach is the most reliable?","options":["Ask politely for valid JSON in the prompt text","Parse the reply with patterns and fix errors afterward","Define a tool with a JSON schema and have Claude call it","Show three sample outputs and trust Claude to copy them"],"answer":2,"why":"A schema on a tool call enforces the structure, while prompts and samples only encourage it."},{"id":"c12b","prompt":"Some invoices have no purchase order number and Claude sometimes makes one up. What should you change?","options":["Tell Claude in bold never to make anything up","Make the field required so Claude always fills it","Remove the field so it can never be wrong","Make the field nullable so Claude can leave it blank"],"answer":3,"why":"A nullable field gives Claude a safe way to say the value is absent."}]},{"id":"c13","domain":4,"title":"Batch or real time","explain":"The Message Batches API is like sending a parcel by slow freight. It costs less, but results can take up to 24 hours and there is no promise of speed. That suits overnight jobs where no one is waiting, and it is a poor fit for anything that blocks a person or a merge.","rule":"Use batches for slow, non-urgent work and normal calls for anything someone is waiting on.","questions":[{"id":"c13a","prompt":"Which job is the best fit for the Message Batches API?","options":["Scoring ten thousand old support tickets overnight for a report","Checking a pull request before the author can merge it","Answering a customer in a live chat window right now","Approving a payment while the shopper waits on the page"],"answer":0,"why":"Batches are cheaper but slow, so they fit large jobs that nobody is waiting on."},{"id":"c13b","prompt":"A team wants to save money by sending its pre-merge checks through the Batches API. What is the problem?","options":["Batch results are always lower quality than normal calls","Batches cannot handle any code files at all","Batches only work on weekends and outside office hours","Results may take up to 24 hours, which blocks the merge"],"answer":3,"why":"A merge gate needs a fast answer, and batches give no time guarantee."}]},{"id":"c14","domain":5,"title":"Keep key facts safe","explain":"When a long chat is summarized, small details like an order number or a promised refund amount can get squeezed out. Keep a short block of case facts, such as ids, amounts and dates, and include it word for word in every request. The summary can shrink, but the facts stay intact.","rule":"Keep exact key facts in a case-facts block instead of trusting a summary to keep them.","questions":[{"id":"c14a","prompt":"After a long support chat is summarized, the agent forgets the exact refund amount the customer was promised. What prevents this?","options":["Summarize more often so each summary is shorter","Trust that the model will remember the important parts","Ask the customer to repeat the amount whenever it matters","Keep the amount in a case-facts block sent with each request"],"answer":3,"why":"A verbatim facts block survives summarizing, so exact values are never lost."},{"id":"c14b","prompt":"A long coding session keeps losing the agreed database name and version after compaction. What is the best fix?","options":["Compact the conversation more often to save space","Repeat the details in the chat now and then by hand","Write a short note of the fixed facts and include it each time","Start over with a new session after every few messages"],"answer":2,"why":"A small fixed block of facts is carried through every request, so compaction cannot drop it."}]},{"id":"c15","domain":5,"title":"When to hand off to a human","explain":"Escalating to a person should depend on clear, checkable triggers. These include a customer asking for a human, a case outside policy, or no progress after real attempts. An upset tone alone is a poor trigger because plenty of calm cases need help and plenty of upset ones are easy to solve.","rule":"Escalate on explicit requests and policy limits, never on mood alone.","questions":[{"id":"c15a","prompt":"A customer writes \"Please connect me to a human agent.\" What should the agent do?","options":["Offer to keep trying first and ask them to wait","Check how angry the message sounds before deciding","Hand the case to a human as the customer asked","Run a sentiment score and escalate only above a limit"],"answer":2,"why":"An explicit request for a person is a clear trigger that should be honored right away."},{"id":"c15b","prompt":"A team wants to escalate whenever a customer sounds frustrated. What is the weakness in that plan?","options":["Frustration is a vague signal and misses real policy cases","Frustrated customers should never be sent to a human","Models are unable to read any tone in written text","Human agents are always too busy to take escalations"],"answer":0,"why":"Mood is an unreliable trigger, so use clear rules such as policy limits or explicit requests."}]},{"id":"c16","domain":5,"title":"Pass errors up clearly","explain":"In a team of agents, a helper that fails quietly leaves the coordinator guessing. A helper should report what it tried, what went wrong and what it still managed to get. With that, the coordinator can retry, use another source or tell the user honestly what is missing, and each claim keeps its source.","rule":"Report failures with details and partial results, never as silence or a bare crash.","questions":[{"id":"c16a","prompt":"A search subagent cannot reach one source and returns an empty list. The coordinator reports there is no information. What went wrong?","options":["The coordinator should have searched without subagents","The failure was hidden as an empty result with no details","The subagent should have returned a longer empty list","The user should have asked a much simpler question"],"answer":1,"why":"An empty result looks like success, so the subagent should have reported the failure and what it tried."},{"id":"c16b","prompt":"A research helper finds eight of ten sources and the last two fail. What should it send back to the coordinator?","options":["Only an error message and none of the eight results","The eight results plus a note on which two failed and why","The eight results only, to keep the report clean and short","A confident final answer that ignores the two failed sources"],"answer":1,"why":"Partial results plus clear failure details let the coordinator decide what to do next."}]}]},"practitioner":{"scenarios":[{"id":"s1","title":"Customer Support Resolution Agent","setup":"You are building a customer support resolution agent with the Claude Agent SDK. It handles returns, billing disputes and account issues, many of which are ambiguous when they arrive. The agent reaches backend systems through custom MCP tools: get_customer, lookup_order, process_refund and escalate_to_human. The business target is at least 80% first-contact resolution, with escalation reserved for cases that genuinely need a person.","questions":[{"id":"s1q1","domain":1,"type":"single","prompt":"Company policy says refunds above $500 need human approval. The system prompt states this rule in bold, and a test suite of 200 conversations passed. In the first month of production, an audit finds 11 refunds between $520 and $1,400 that process_refund executed without escalation. In each case the customer had described financial hardship. What change best guarantees the policy is followed?","options":[{"text":"Move the $500 rule to both the top and the bottom of the system prompt, and add a line stating that hardship never justifies an exception to the limit.","correct":false,"trap":"system-prompt-enforcement","rationale":"Repetition and placement can lower the failure rate, but the rule is still enforced by the model's judgment. Hardship stories are exactly the pressure that caused the misses."},{"text":"Add few-shot examples to the system prompt showing hardship cases above $500 in which the agent declines the refund and calls escalate_to_human.","correct":false,"trap":"few-shot-overload","rationale":"Examples shape behavior but remain probabilistic. A financial policy that must hold on every call needs enforcement outside the model."},{"text":"Add a hook that intercepts process_refund calls, blocks any amount over $500, and returns a message telling the agent to call escalate_to_human.","correct":true,"trap":null,"rationale":"A tool call interception hook enforces the limit in code on every call and redirects the agent to the escalation workflow. The prompt can no longer be talked around."},{"text":"Route each process_refund call through a second Claude instance that reads the conversation and approves or rejects the refund before it runs.","correct":false,"trap":"over-engineering","rationale":"This adds another model call per refund and is still a judgment call by an LLM. A simple numeric threshold is better checked in code."}],"takeaway":"When a business rule must hold every time, enforce it with a hook on the tool call rather than with prompt wording."},{"id":"s1q2","domain":2,"type":"single","prompt":"process_refund returns isError: true with the text \"Operation failed\" for every failure. Logs show the agent retrying refunds that were rejected because the order is outside the 30-day return window, sometimes four times in a row. It also tells customers whose refund hit a payment gateway timeout that their refund is not allowed. What should you change first?","options":[{"text":"Return an errorCategory, an isRetryable flag and a short customer-facing explanation in each process_refund error so the agent can tell these cases apart.","correct":true,"trap":null,"rationale":"The agent cannot choose a recovery path when every failure looks the same. Structured metadata lets it stop retrying policy rejections and retry or explain timeouts correctly."},{"text":"Add a system prompt rule that process_refund may be retried at most once per conversation, after which the agent apologizes and offers escalation.","correct":false,"trap":"symptom-fix","rationale":"Capping retries hides the wasted calls but the agent still cannot tell a timeout from a policy rejection, so customers keep getting the wrong explanation."},{"text":"Add exponential backoff inside the MCP server so process_refund retries internally and reports a failure only after five attempts have run out.","correct":false,"trap":"wrong-scope","rationale":"Backoff helps transient errors but retries the 30-day window rejection five more times for nothing, and the final error is just as generic as before."},{"text":"Split process_refund into separate tools for orders inside and outside the return window so the agent never calls a refund path that will be rejected.","correct":false,"trap":"tool-bloat","rationale":"This adds tools and pushes eligibility logic into tool selection. It does nothing for gateway timeouts, which are the other half of the problem."}],"takeaway":"Structured error responses with a category and a retryable flag let the agent pick the right recovery for each failure type."},{"id":"s1q3","domain":5,"type":"multi","prompt":"First-contact resolution is 62%. A review of 300 escalated tickets finds two patterns. The agent escalates routine in-policy cases, such as a duplicate charge, whenever the customer writes in an angry tone. It also approves competitor price-match requests on its own, although the written policy only covers price drops on the company's own site. Which two changes address both patterns? Select TWO.","options":[{"text":"Score each customer message for sentiment and call escalate_to_human automatically when the negative score stays above a set threshold for two turns.","correct":false,"trap":"sentiment-escalation","rationale":"Tone does not measure case complexity. This would make the first pattern worse by escalating more angry but simple cases."},{"text":"Add escalation criteria and examples to the system prompt, stating that requests the policy does not cover, like price matching, go to a human.","correct":true,"trap":null,"rationale":"Explicit criteria with examples fix the unclear boundary. Policy gaps like competitor price matching are a recognized escalation trigger."},{"text":"Ask the agent to rate its confidence from 1 to 10 before acting, and route the case to escalate_to_human whenever its own rating comes in below 7.","correct":false,"trap":"self-review","rationale":"Self-reported confidence is poorly calibrated. The agent was already confident when it approved price matches it had no policy basis for."},{"text":"Train a classifier on two years of historical tickets to predict which conversations need a human, and run it before the agent sees each request.","correct":false,"trap":"over-engineering","rationale":"This needs labeled data and new infrastructure before the cheaper prompt fix has even been tried."},{"text":"Instruct the agent to acknowledge frustration and offer to fix in-policy issues, escalating only if the customer then repeats a request for a person.","correct":true,"trap":null,"rationale":"This keeps simple angry cases with the agent while still honoring a customer who insists on a human."}],"takeaway":"Escalate on policy gaps and explicit requests for a human, not on sentiment or self-rated confidence."},{"id":"s1q4","domain":5,"type":"single","prompt":"Some billing conversations run past 40 turns, so older turns are condensed by progressive summarization. In a sample review, the agent later quoted a refund of \"about $80\" when the customer was owed $84.37, and lost track of which of three order numbers had already been refunded. What is the most effective fix?","options":[{"text":"Raise the token threshold that triggers summarization so the full history stays in context for longer before older turns are condensed.","correct":false,"trap":"symptom-fix","rationale":"This delays the loss but does not prevent it. Long conversations still reach the threshold and the figures still get compressed."},{"text":"Update the summarization prompt to say that all amounts, dates and order numbers must be preserved exactly as they appear in the original turns.","correct":false,"trap":"system-prompt-enforcement","rationale":"Summaries compress by design, and an instruction to keep every figure exact will still fail on some turns. The facts need a home outside the summary."},{"text":"Before each process_refund call, spawn a subagent that rereads the full raw transcript from storage and confirms the amount and the order number.","correct":false,"trap":"over-engineering","rationale":"This adds a subagent and latency to every refund and only checks one action. The agent still reasons from vague facts the rest of the time."},{"text":"Keep amounts, order numbers, dates and statuses in a case facts block that is included in every prompt, outside the summarized history.","correct":true,"trap":null,"rationale":"Transactional facts held in a persistent block are never summarized, so the agent always has exact figures and refund status."}],"takeaway":"Pull transactional facts into a persistent case facts block instead of trusting them to survive summarization."},{"id":"s1q5","domain":1,"type":"single","prompt":"Human agents report that escalated tickets arrive with notes like \"Customer has a billing problem, please assist.\" They cannot see the AI conversation, so they ask the customer to repeat everything, and post-escalation satisfaction has dropped. escalate_to_human currently accepts a single free-text reason field. What change best fixes the handoff?","options":[{"text":"Attach the full conversation transcript to every escalated ticket so the human agent can read the complete exchange before replying.","correct":false,"trap":"symptom-fix","rationale":"The human now has data but must read a long transcript to find the facts, and nothing states what was found or what should happen next."},{"text":"Change the escalate_to_human schema to require customer ID, order ID, issue summary, suspected cause, refund amount and recommended action.","correct":true,"trap":null,"rationale":"Required structured fields make the agent compile a usable handoff every time, giving a human who never saw the conversation what they need to act."},{"text":"Give the human support console access to get_customer and lookup_order so agents can rebuild each case themselves from the backend data.","correct":false,"trap":"wrong-scope","rationale":"Humans can look up records but still do not know what the customer said, what was tried, or what the agent concluded."},{"text":"Add a system prompt instruction telling the agent to write detailed, well-organized escalation notes covering everything a human would need.","correct":false,"trap":"system-prompt-enforcement","rationale":"Vague guidance like this gives inconsistent notes. A schema with required fields defines what complete means."}],"takeaway":"Escalation handoffs should be structured summaries with required fields, because the human does not have the transcript."},{"id":"s1q6","domain":2,"type":"single","prompt":"The tool descriptions were recently rewritten and now clearly separate lookup_order (order and refund status) from process_refund (issues a new refund). Even so, logs show the agent calling process_refund for messages like \"Has my refund for order #4471 gone through yet?\" The system prompt includes the line: \"When a customer mentions a refund, call process_refund promptly to keep resolution times low.\" What should you do?","options":[{"text":"Rewrite that system prompt line so it no longer ties the word refund to process_refund, and let the tool descriptions guide the choice.","correct":true,"trap":null,"rationale":"A keyword-sensitive instruction is overriding good descriptions. Removing the false association is the smallest change that fixes selection."},{"text":"Add few-shot examples to the system prompt in which questions about the status of an earlier refund are routed to lookup_order instead.","correct":false,"trap":"few-shot-overload","rationale":"Examples fight the conflicting instruction rather than removing it, and every new phrasing that mentions a refund can still trip the keyword rule."},{"text":"Add a hook that blocks process_refund whenever lookup_order shows that a refund for the same order has already been issued or is pending.","correct":false,"trap":"symptom-fix","rationale":"This stops duplicate refunds but the agent still picks the wrong tool first and never answers the status question it was asked."},{"text":"Merge lookup_order and process_refund into one manage_refund tool that checks for an earlier refund and only issues a new one when none exists.","correct":false,"trap":"over-engineering","rationale":"This mixes a read with a write and hides a side effect behind a status question. The misrouting comes from one prompt line."}],"takeaway":"Check the system prompt for keyword-sensitive instructions that override well-written tool descriptions."}]},{"id":"s2","title":"Code Generation with Claude Code","setup":"Your engineering team uses Claude Code daily for code generation, refactoring, debugging and documentation. The repository is a TypeScript monorepo with a shared CLAUDE.md, several custom slash commands and a few project skills. Developers work on everything from one-line fixes to multi-week migrations. You own the team's Claude Code configuration and are asked to fix workflow problems as they come up.","questions":[{"id":"s2q1","domain":3,"type":"single","prompt":"A developer who joined last week says Claude never follows the team's API error-handling conventions for her, while it does for the tech lead. Running /memory on both machines shows that the tech lead's session loads ~/.claude/CLAUDE.md, which contains those conventions. The repository's CLAUDE.md does not mention them. What is the right fix?","options":[{"text":"Add an onboarding script that copies the tech lead's ~/.claude/CLAUDE.md into each new developer's home directory on day one.","correct":false,"trap":"symptom-fix","rationale":"Copies drift as soon as the lead edits his file, and the conventions still live outside version control where nobody reviews them."},{"text":"Move the error-handling conventions into the project CLAUDE.md or a .claude/rules/ file, and commit that change to the repository.","correct":true,"trap":null,"rationale":"Team standards belong in project-level configuration that is shared through version control, so every clone loads them."},{"text":"Add the import line @~/.claude/CLAUDE.md to the repository's CLAUDE.md so that every developer's session picks up the conventions.","correct":false,"trap":"wrong-scope","rationale":"The path resolves to each developer's own home directory, so the new hire imports her own empty file, not the lead's."},{"text":"Create an /api-conventions command in .claude/commands/ that prints the conventions, and ask developers to run it when a session starts.","correct":false,"trap":"wrong-scope","rationale":"Commands are on-demand. Conventions that must apply to all API code should load automatically, not depend on someone remembering to run a command."}],"takeaway":"User-level CLAUDE.md applies only to that user, so shared standards must live in project-level configuration."},{"id":"s2q2","domain":2,"type":"single","prompt":"The team wants everyone to use the same Jira MCP server in Claude Code. A developer committed a working .mcp.json, but it contains his personal API token in plain text, and security has asked for it to be removed. Other developers still need the server to be available automatically when they clone the repository. What should you do?","options":[{"text":"Move the Jira server entry into each developer's ~/.claude.json and delete .mcp.json from the repository so tokens stay on their owners' machines.","correct":false,"trap":"wrong-scope","rationale":"User scope is for personal or experimental servers. It removes the secret but also removes the shared, automatic setup the team asked for."},{"text":"Add .mcp.json to .gitignore and post a template of the file on the team wiki so each developer can add a token and create the file locally.","correct":false,"trap":"symptom-fix","rationale":"This hides the secret by taking the config out of version control, so every developer maintains a hand-made copy that drifts."},{"text":"Build a small custom MCP server that wraps the Jira REST API and reads a shared service token from a secrets file bundled with the repository.","correct":false,"trap":"over-engineering","rationale":"A standard integration like Jira is better served by an existing server, and bundling a shared token in the repo recreates the original leak."},{"text":"Keep the server in the project .mcp.json, replace the literal token with ${JIRA_API_TOKEN}, and have each developer set that variable locally.","correct":true,"trap":null,"rationale":"Environment variable expansion in project-scoped .mcp.json keeps the shared config in the repo while each developer supplies their own credential."}],"takeaway":"Share MCP servers through project .mcp.json and keep credentials out of it with environment variable expansion."},{"id":"s2q3","domain":3,"type":"single","prompt":"You are replacing a homegrown date library with date-fns. A search shows 47 files import it, and some call sites depend on its unusual timezone handling. In an earlier attempt, output from dozens of Grep and Read calls filled the context window before any plan existed. How should you run the next attempt?","options":[{"text":"Use direct execution and migrate each file as soon as Grep finds it, so the discovery output never has to be held in context all at once.","correct":false,"trap":"wrong-scope","rationale":"A 47-file migration with timezone edge cases needs a design decision up front. Migrating file by file risks rework when a tricky call site turns up late."},{"text":"Paste the list of 47 files and their call sites into CLAUDE.md so the analysis is loaded at startup and Claude does not need to search at all.","correct":false,"trap":"symptom-fix","rationale":"This puts one-off migration data into a file loaded in every session for every developer, and it goes stale as soon as the code changes."},{"text":"Work in plan mode, hand call-site discovery to the Explore subagent so only a summary comes back, then execute the approved plan directly.","correct":true,"trap":null,"rationale":"Plan mode suits a multi-file change with design choices, and the Explore subagent keeps verbose discovery out of the main context."},{"text":"Open 47 separate sessions in direct execution, one per importing file, so that each session has a small context and cannot run out of room.","correct":false,"trap":"over-engineering","rationale":"Independent sessions cannot make a consistent decision about the timezone behavior, and coordinating 47 of them costs far more than one planned run."}],"takeaway":"Plan large multi-file changes in plan mode and isolate verbose discovery in the Explore subagent."},{"id":"s2q4","domain":3,"type":"multi","prompt":"The team's /dependency-audit skill in .claude/skills/ walks the whole monorepo and prints thousands of lines. After running it, developers notice Claude losing track of decisions made earlier in the same session. Security also wants the skill limited so that it cannot modify files or run shell commands while it runs. Which two changes meet these needs? Select TWO.","options":[{"text":"Add context: fork to the frontmatter so that the skill runs in an isolated sub-agent context and only its final result comes back.","correct":true,"trap":null,"rationale":"Forking keeps the verbose audit output out of the main conversation, which is what was crowding out earlier decisions."},{"text":"Add argument-hint to the frontmatter so developers are prompted for a package name and the audit only scans the part they name.","correct":false,"trap":"symptom-fix","rationale":"Narrower scans produce less output, but a full audit still floods the session. The output needs isolation, not just trimming."},{"text":"Add a line to the skill body telling Claude it must not edit files or run commands during the audit and should only read and report.","correct":false,"trap":"system-prompt-enforcement","rationale":"An instruction in the body is guidance the model can drift from. Security asked for a limit on what the skill can do."},{"text":"Set allowed-tools in the frontmatter to Read, Grep and Glob so the skill has no access to Edit, Write or Bash while the audit runs.","correct":true,"trap":null,"rationale":"Restricting allowed-tools limits the skill to read-only inspection while it runs, which meets the security requirement in configuration."},{"text":"Move the skill to ~/.claude/skills/ so that its output stays in a personal scope and no longer affects the shared project conversation.","correct":false,"trap":"wrong-scope","rationale":"Skill location controls who can use it, not where its output goes. It would also take the skill away from the rest of the team."}],"takeaway":"Use context: fork to isolate verbose skill output and allowed-tools to restrict what a skill can do."},{"id":"s2q5","domain":3,"type":"single","prompt":"You ask Claude Code to write normalizePhone(), which converts legacy CRM phone strings to E.164. You have rewritten the prose requirements three times, and each version still handles extensions like \"x204\" and numbers without a country code differently. What should you do next?","options":[{"text":"Give Claude three concrete input and output pairs, including one with an extension and one with no country code.","correct":true,"trap":null,"rationale":"When prose is read inconsistently, two or three concrete examples pin down the transformation far better than more description."},{"text":"Write a fuller prose specification that lists every formatting rule in priority order, with a paragraph on each edge case.","correct":false,"trap":"symptom-fix","rationale":"Three prose rewrites have already failed. A longer version of the same approach is still open to interpretation."},{"text":"Ask Claude to reread its implementation in the same session, list any inconsistencies it finds, and fix them before you look.","correct":false,"trap":"self-review","rationale":"The same session shares the reasoning that produced the inconsistency and has no reference for what correct output is."},{"text":"Collect 25 examples covering every phone format in the CRM and paste all of them into the request with the prose requirements.","correct":false,"trap":"few-shot-overload","rationale":"A few targeted examples are enough to show the ambiguous cases. Dozens add noise and invite matching instead of generalizing."}],"takeaway":"When prose requirements are interpreted inconsistently, give two or three concrete input and output examples."},{"id":"s2q6","domain":5,"type":"single","prompt":"A developer spends an afternoon in one Claude Code session mapping how payments flow through a legacy service. Early on, Claude correctly named LedgerWriter and RetryQueue as the key classes. Three hours later its answers contradict those findings and refer to \"a typical repository pattern\" instead of the classes it found. What should the developer do going forward?","options":[{"text":"Add a CLAUDE.md rule stating that answers must cite specific class names from this codebase and must not describe generic patterns.","correct":false,"trap":"system-prompt-enforcement","rationale":"The model is not choosing to be generic. It has lost the earlier findings in a long context, and a rule cannot bring them back."},{"text":"Ask Claude to check each new answer against everything it found earlier in the conversation and flag any contradictions first.","correct":false,"trap":"self-review","rationale":"The earlier findings are what has degraded, so checking against them in the same context is unreliable."},{"text":"Have Claude record key findings in a scratchpad file as it goes, and refer later questions to that file.","correct":true,"trap":null,"rationale":"A scratchpad file persists findings outside the degrading context, so later answers can rely on what was actually discovered."},{"text":"Restart the investigation in plan mode, which keeps exploration read-only and so stops findings being lost as the session grows.","correct":false,"trap":"wrong-scope","rationale":"Plan mode controls whether Claude makes changes. It does not protect findings from context degradation in a long session."}],"takeaway":"Counter context degradation in long exploration sessions by persisting key findings in a scratchpad file."}]},{"id":"s3","title":"Multi-Agent Research System","setup":"You are building a multi-agent research system with the Claude Agent SDK. A coordinator agent delegates work through the Task tool to four subagents: web search, document analysis, synthesis and report generation. Each subagent has its own AgentDefinition with a system prompt and a restricted tool list. The system researches a topic and produces a comprehensive report with citations.","questions":[{"id":"s3q1","domain":1,"type":"single","prompt":"Reports often ignore the document analysis results, even though that subagent's output looks correct in the logs. The coordinator invokes the synthesis subagent with the prompt \"Synthesize the findings gathered so far into key themes.\" The synthesis agent's replies contain only general knowledge about the topic. What change fixes this?","options":[{"text":"Give the synthesis subagent the web search and document analysis tools so it can gather any findings it needs while it writes.","correct":false,"trap":"tool-bloat","rationale":"This duplicates work other agents have already done and invites a synthesis agent to start doing research outside its role."},{"text":"Update the synthesis AgentDefinition's system prompt to tell it to review the outputs of earlier subagents before naming themes.","correct":false,"trap":"system-prompt-enforcement","rationale":"The subagent cannot review what it was never given. Subagents do not inherit the coordinator's history."},{"text":"Have the synthesis agent reply NEED_FINDINGS when its input looks thin, and make the coordinator watch for that text and resend.","correct":false,"trap":"text-signal-loops","rationale":"Parsing free text for a control signal is brittle, and it still relies on a later resend instead of passing the data the first time."},{"text":"Pass the complete findings from the search and analysis subagents, with source metadata, directly in the synthesis Task prompt.","correct":true,"trap":null,"rationale":"Subagents start with isolated context, so the coordinator must pass prior findings explicitly in the prompt it sends."}],"takeaway":"Subagents do not inherit the coordinator's context, so pass prior findings explicitly in the Task prompt."},{"id":"s3q2","domain":1,"type":"single","prompt":"For a topic split into four independent subtopics, a research run takes about 11 minutes. Coordinator logs show one Task call per turn: it waits for the first web search subagent to finish before starting the second, and so on. The subtopics do not depend on one another. How should you cut latency?","options":[{"text":"Submit the four web search requests through the Message Batches API so they run together, then poll until all are done.","correct":false,"trap":"batch-for-blocking","rationale":"Batches have no latency guarantee and do not support multi-turn tool calling, which a search subagent needs."},{"text":"Have the coordinator emit all four Task calls in a single response so the subagents run in parallel.","correct":true,"trap":null,"rationale":"Multiple Task calls in one coordinator response start the subagents at once, which is the intended way to parallelize independent work."},{"text":"Give the coordinator the web search tools so it can run the four searches itself and skip spawning subagents.","correct":false,"trap":"tool-bloat","rationale":"This loads search work and verbose results into the coordinator's own context and erodes the separation of roles."},{"text":"Combine the four subtopics into one broad Task call so a single search subagent covers all of them in one run.","correct":false,"trap":"wrong-scope","rationale":"One agent still works through the subtopics in sequence, and a broad prompt tends to cover some of them thinly."}],"takeaway":"Spawn independent subagents in parallel by emitting multiple Task calls in one coordinator response."},{"id":"s3q3","domain":5,"type":"single","prompt":"Several reports state that \"no peer-reviewed research exists\" on subtopics where reviewers easily find papers. Logs show the document analysis subagent returns {\"status\": \"ok\", \"documents\": []} both when the repository search finds nothing and when the repository API times out. What should the subagent return instead?","options":[{"text":"On a timeout, return an error with the failure type, the query tried and any partial results, and keep ok for true empty results.","correct":true,"trap":null,"rationale":"Separating access failures from valid empty results, with context about what was tried, lets the coordinator decide whether to retry or note a gap."},{"text":"Keep returning an empty list in both cases, and have the coordinator retry any empty result three times before accepting it.","correct":false,"trap":"symptom-fix","rationale":"This wastes retries on true empty results and still cannot tell the coordinator whether a source was down."},{"text":"Raise an exception on any repository timeout so the coordinator stops the run rather than finishing with partial coverage.","correct":false,"trap":"wrong-scope","rationale":"One failed source should not end the whole workflow when other results are usable and the gap can be reported."},{"text":"Return a \"repository unavailable\" status on timeout, and tell the synthesis agent not to claim that research is absent.","correct":false,"trap":"system-prompt-enforcement","rationale":"A bare status hides what was attempted and what partial results exist, and the prompt rule only masks one symptom downstream."}],"takeaway":"Distinguish access failures from valid empty results and propagate structured error context to the coordinator."},{"id":"s3q4","domain":5,"type":"multi","prompt":"Reviewers flag two problems in recent reports. Many claims have no citation, although the search agent found a source for each one. And where two credible surveys give different adoption rates (34% and 41%), the report states one figure as fact and never mentions the other. Which two changes address these problems? Select TWO.","options":[{"text":"After drafting, have the report agent reread its own report and add a citation wherever it decides a claim lacks one.","correct":false,"trap":"self-review","rationale":"The source links were lost upstream. Rereading the draft cannot recover mappings the agent never received, and it will guess."},{"text":"When figures conflict, have the synthesis agent keep the figure from the more recent survey and drop the older one as outdated.","correct":false,"trap":"symptom-fix","rationale":"Newer is not the same as correct, and the two surveys may measure different populations. Silently dropping one still hides the conflict."},{"text":"Require subagents to return claim-source mappings with claim, excerpt, URL and publication date, and have synthesis keep them.","correct":true,"trap":null,"rationale":"Structured claim-source mappings carried through synthesis keep attribution from being lost when findings are compressed."},{"text":"Give the report agent the web search tools so it can find a source for any uncited claim after the draft has been written.","correct":false,"trap":"tool-bloat","rationale":"This gives a writing agent research tools outside its role, and it may attach a different source than the one the claim came from."},{"text":"When credible sources disagree, include both values with their sources and note the conflict rather than choosing one.","correct":true,"trap":null,"rationale":"Annotating conflicts with attribution keeps the report honest and lets readers see that the figure is contested."}],"takeaway":"Preserve claim-source mappings through synthesis and annotate conflicting figures with their sources instead of picking one."},{"id":"s3q5","domain":2,"type":"single","prompt":"The document analysis subagent has two tools: analyze_content (\"Analyzes content and returns insights\") and analyze_document (\"Analyzes a document and returns findings\"). analyze_document expects a PDF ID from the document store, and analyze_content expects raw web page text. About a third of calls send web text to analyze_document, which returns parse errors. What is the best first step?","options":[{"text":"Add five few-shot examples to the subagent's system prompt showing web text going to analyze_content and PDF IDs to analyze_document.","correct":false,"trap":"few-shot-overload","rationale":"Examples work around two near-identical descriptions instead of fixing them, and they add tokens to every call."},{"text":"Set tool_choice to force analyze_content on every turn, since web text is most of the input, and handle PDFs in a separate request.","correct":false,"trap":"wrong-scope","rationale":"Forcing one tool breaks the PDF path and moves routing out of the model into a second pipeline you now have to maintain."},{"text":"Rename analyze_content to extract_web_results and rewrite both descriptions to state each tool's inputs, outputs and when to use it.","correct":true,"trap":null,"rationale":"Tool descriptions drive selection. Clear names and descriptions that state inputs and boundaries remove the overlap at its source."},{"text":"Add a PostToolUse hook that catches parse errors from analyze_document and resends the same input to analyze_content automatically.","correct":false,"trap":"symptom-fix","rationale":"This patches each failure after it happens, adding a wasted call every time while the confusing descriptions stay in place."}],"takeaway":"Fix misrouting between similar tools by renaming them and writing descriptions that state inputs, outputs and boundaries."},{"id":"s3q6","domain":1,"type":"single","prompt":"For broad topics, reports often have thin coverage in one or two areas. The coordinator currently runs search, analysis, synthesis and report exactly once, in a fixed sequence. You want the system to close coverage gaps before the report is written. Which design should you use?","options":[{"text":"Have the report agent add a Limitations section listing areas where the evidence was thin, so readers know which parts to treat with care.","correct":false,"trap":"symptom-fix","rationale":"Disclosing gaps is useful but does nothing to close them, which is what was asked."},{"text":"Have the coordinator check the synthesis for gaps, send targeted queries back to search and analysis, and rerun synthesis until coverage is sufficient.","correct":true,"trap":null,"rationale":"An iterative refinement loop run by the coordinator finds the gaps and re-delegates with targeted queries before the report is produced."},{"text":"Have the synthesis agent end its output with COVERAGE COMPLETE when satisfied, and loop the pipeline until the coordinator sees that phrase.","correct":false,"trap":"text-signal-loops","rationale":"Loop control based on a phrase in free text is fragile, and nothing tells the search agents which gaps to target on the next pass."},{"text":"Run the full search, analysis and synthesis sequence three times for every topic and merge the three syntheses before the report step.","correct":false,"trap":"over-engineering","rationale":"Blind repetition triples cost and mostly repeats the same queries, so the thin areas are likely to stay thin."}],"takeaway":"Use a coordinator-driven refinement loop that evaluates synthesis for gaps and re-delegates targeted work."}]},{"id":"s4","title":"Developer Productivity with Claude","setup":"Your platform team is building an internal developer assistant with the Claude Agent SDK. Engineers use it to explore unfamiliar repositories, understand a 15-year-old billing monolith, generate service boilerplate, and automate repetitive chores. The agent uses the built-in Read, Write, Edit, Bash, Grep and Glob tools and connects to several MCP servers, including an internal code-search server and the team's Jira instance. Sessions often run for hours across large codebases.","questions":[{"id":"s4q1","domain":2,"type":"single","prompt":"An engineer asks the agent to find every caller of the deprecated function formatLegacyDate before removing it. The function is also re-exported under two other names from utils/index.ts and shared/dates.ts. Session logs show the agent ran Glob on **/*.ts, then called Read on 212 files one after another until the context window filled, and it still missed callers that used the re-exported names. What is the most effective change to this exploration strategy?","options":[{"text":"Run /compact automatically after every 25 Read calls so the agent can work through all 212 files without filling the context window before it reaches the callers.","correct":false,"trap":"symptom-fix","rationale":"Compaction frees space but keeps the read-everything strategy. The agent still has no reason to look for the re-exported names, so the missed callers stay missed."},{"text":"Build an MCP server that parses the repository into an AST call graph and exposes a find_callers tool, so the agent no longer opens files to locate usages.","correct":false,"trap":"over-engineering","rationale":"A call-graph service could work eventually, but it is a large build for a problem the built-in tools already solve when used in the right order."},{"text":"Grep for formatLegacyDate to find where it is defined and re-exported, collect each exported alias, then Grep for every alias and Read only the matching files.","correct":true,"trap":null,"rationale":"Grep finds content such as function names, and tracing wrapper modules means first finding every exported name and then searching for each one. Reading only the matches keeps context small."},{"text":"Add a system prompt rule limiting the agent to 30 Read calls per task and telling it to open files whose names contain date or format before any others.","correct":false,"trap":"system-prompt-enforcement","rationale":"A prose cap is followed only probabilistically, and filename guessing has nothing to do with where callers live. Aliased callers in unrelated files would still be missed."}],"takeaway":"Build codebase understanding incrementally with Grep for content and Read for follow-up, and trace re-exports by searching for each exported name."},{"id":"s4q2","domain":2,"type":"single","prompt":"The team added an MCP server that exposes search_symbols. It queries a precomputed index covering 31 repositories and returns definitions, references, and the owning service for any symbol. Its description reads \"Searches code.\" Traces show the agent uses the built-in Grep for 90% of symbol lookups, which misses references in the 30 repositories that are not checked out locally. What should you change first?","options":[{"text":"Rewrite the search_symbols description to say it covers all 31 indexed repositories, returns definitions and references with owning service, and suits symbol lookups better than Grep.","correct":true,"trap":null,"rationale":"Tool descriptions are the main signal the model uses to choose tools. A two-word description gives it no reason to prefer the MCP tool over a familiar built-in one."},{"text":"Remove Grep from the agent's allowedTools so that search_symbols becomes the only search option available whenever the agent needs to locate a function, class, or constant.","correct":false,"trap":"wrong-scope","rationale":"Grep is still the right tool for error strings, config values, and local content. Taking it away fixes one routing problem by breaking many legitimate uses."},{"text":"Add six few-shot examples to the system prompt showing symbol lookups routed to search_symbols,
