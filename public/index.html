t that line item amounts must never be changed to force a match, and keep retrying until the totals agree.","correct":false,"trap":"system-prompt-enforcement","rationale":"If the vendor's own figures disagree, the totals can never agree honestly, so this either loops or invites the same alteration."},{"text":"Overwrite the extracted total with the sum of the line items whenever they differ, so every record passes validation on its first attempt.","correct":false,"trap":"symptom-fix","rationale":"This hides a real discrepancy in the source invoice and writes a total the vendor never billed."},{"text":"Ask the model in a follow-up turn of the same conversation whether it altered any amounts, and keep the result only if it says it did not.","correct":false,"trap":"self-review","rationale":"The same session is a weak judge of its own changes, and its answer does not reveal the vendor's arithmetic error."},{"text":"Extract stated_total as printed and calculated_total as the sum of line items, and flag invoices where the two totals differ for review.","correct":true,"trap":null,"rationale":"Extracting calculated and stated values side by side flags source discrepancies instead of letting retries force the data to agree."}],"takeaway":"Extract calculated and stated values side by side to flag source discrepancies, rather than letting retries force the data to agree."},{"id":"s6q16","domain":5,"ts":"5.1","type":"single","prompt":"Long supplier contracts are processed in two steps: per-section requests extract obligations, then a consolidation request receives all section results concatenated in page order and builds the final record. Audits show the final record reliably keeps obligations from the first and last sections but often drops ones from the middle sections. What should you change?","options":[{"text":"Put a key-obligations summary at the start of the consolidation input and organize each section's results under explicit section headers.","correct":true,"trap":null,"rationale":"Models attend reliably to the start and end of long inputs. A summary up front and clear headers reduce middle-section omissions."},{"text":"Add examples of complete consolidated records from ten long contracts ahead of the section results in the consolidation request.","correct":false,"trap":"few-shot-overload","rationale":"Ten long examples make the input even longer and push the section results further into the middle, where they get lost."},{"text":"Instruct the consolidation request to give every section equal attention and to double-check that no section's obligations were dropped.","correct":false,"trap":"system-prompt-enforcement","rationale":"An instruction does not change how position affects attention. The input structure is what needs to change."},{"text":"Run consolidation twice, once in page order and once in reverse order, and use a third request to merge the two final records.","correct":false,"trap":"over-engineering","rationale":"Three requests per contract triple cost, and the merge step faces the same long-input problem."}],"takeaway":"Models can lose findings in the middle of long inputs, so lead with a key-findings summary and use explicit section headers."},{"id":"s6q17","domain":5,"ts":"5.5","type":"single","prompt":"The model outputs a confidence score for each extracted field, and any field below 0.8 goes to human review. The team picked the 0.8 cutoff without data. A spot check finds that contract renewal dates scored 0.9 or higher are still wrong about 15% of the time, while invoice totals at 0.7 are almost always right. What should you do?","options":[{"text":"Set one cutoff per document type rather than per field, keeping the same 0.8 value for invoices, receipts, and contracts.","correct":false,"trap":"wrong-scope","rationale":"The problem varies by field, and the cutoff is still a guess. Moving the threshold to a coarser level fixes neither issue."},{"text":"Tell the model to score confidence more strictly on renewal dates and to go above 0.9 only when it is certain of the value.","correct":false,"trap":"system-prompt-enforcement","rationale":"Instructions do not calibrate scores. You only know what a score means by comparing it with labeled outcomes."},{"text":"Calibrate a threshold for each field against a labeled set of human-verified extractions, and route on those new cutoffs.","correct":true,"trap":null,"rationale":"Field-level confidence scores need calibration against labeled validation data before they can route review attention well."},{"text":"Have the model rescore each field in a second turn of the same conversation and route on the lower of the two scores.","correct":false,"trap":"self-review","rationale":"A second self-rating in the same context is still uncalibrated, so it adds cost without telling you what the scores mean."}],"takeaway":"Field-level confidence scores are useful for routing only after their thresholds are calibrated against labeled validation data."},{"id":"s6q18","domain":5,"ts":"5.5","type":"multi","prompt":"Reviewers can check about 600 of the 40,000 monthly documents. Every extraction carries calibrated field-level confidence scores, and the validator records when a document's own figures contradict each other. You need to decide which documents get the limited review capacity first. Which criteria should drive routing? Select TWO.","options":[{"text":"Documents whose vendor cover emails use urgent or frustrated language about late payment.","correct":false,"trap":"sentiment-escalation","rationale":"Tone says nothing about whether the extraction is wrong, so it wastes review capacity on documents that may be fine."},{"text":"Extractions where one or more fields fall below their calibrated confidence threshold.","correct":true,"trap":null,"rationale":"Low calibrated confidence is a direct signal that a field may be wrong, which is what review is for."},{"text":"Documents that the extractor itself calls difficult when asked in a follow-up turn of the same conversation.","correct":false,"trap":"self-review","rationale":"A same-session self-assessment is uncalibrated and tends to defend its own output, so it is a weaker signal than the calibrated scores already available."},{"text":"Documents whose source content is ambiguous or contradictory, such as conflicting totals.","correct":true,"trap":null,"rationale":"Ambiguous or contradictory sources need human judgment, so they deserve priority for limited review capacity."},{"text":"Documents where a second, independently built extraction pipeline disagrees with the first.","correct":false,"trap":"over-engineering","rationale":"Building and running a second pipeline doubles cost when calibrated confidence and conflict flags already exist."}],"takeaway":"Spend limited review capacity on low calibrated confidence and ambiguous or contradictory sources, not on proxies like tone or the model's own say-so."},{"id":"s6q19","domain":5,"ts":"5.6","type":"single","prompt":"A contract packet includes a 2022 master agreement with an hourly rate of $120 and a 2024 amendment with a rate of $135. The extractor reports both rates but no dates, so the validator marks every such packet as a conflict, and reviewers spend hours on them. Most turn out to be amendments that changed the rate. What should you change?","options":[{"text":"Exclude rate fields from conflict detection, so packets with more than one rate are no longer sent to reviewers at all.","correct":false,"trap":"symptom-fix","rationale":"This also hides real rate conflicts. The missing piece is the date context that explains most differences."},{"text":"Require each extracted rate to include its source document and effective date, so a later amendment is not misread as a rate conflict.","correct":true,"trap":null,"rationale":"Capturing dates in structured output prevents temporal differences from being misinterpreted as contradictions."},{"text":"Add a step that summarizes each packet into one paragraph before extraction, so only a single rate survives to reach the extractor.","correct":false,"trap":"over-engineering","rationale":"An extra summarization step drops source attribution and may keep the wrong rate, with no record of why."},{"text":"Add fifteen example packets to the prompt showing which of two rates to report, covering every amendment style seen this year.","correct":false,"trap":"few-shot-overload","rationale":"Examples cannot tell the model which rate is current if the dates are not captured, and fifteen packets bloat every request."}],"takeaway":"Capture source and effective dates in structured output so changes over time are not mistaken for conflicting data."}]}]}};

const DOMAINS = {
  1: { name: "Agentic Architecture & Orchestration", short: "Agentic architecture", weight: 27 },
  2: { name: "Tool Design & MCP Integration", short: "Tools & MCP", weight: 18 },
  3: { name: "Claude Code Configuration & Workflows", short: "Claude Code config", weight: 20 },
  4: { name: "Prompt Engineering & Structured Output", short: "Prompts & output", weight: 20 },
  5: { name: "Context Management & Reliability", short: "Context & reliability", weight: 15 },
};
const TRAPS = {
  "system-prompt-enforcement": ["Prompt-only enforcement", "Asking nicely in the system prompt when the rule must hold every time. Use hooks, gates, schemas or tool_choice instead."],
  "few-shot-overload": ["Few-shot overload", "Piling on more examples when the real gap is unclear criteria or a missing structure."],
  "over-engineering": ["Over-engineering", "Reaching for classifiers, new infrastructure or extra agents when a small targeted change fixes it."],
  "sentiment-escalation": ["Sentiment-based escalation", "Escalating on how upset someone sounds instead of on clear policy triggers or explicit requests."],
  "tool-bloat": ["Tool bloat", "Giving an agent more tools than its job needs, which makes selection worse."],
  "batch-for-blocking": ["Batch API for blocking work", "Using the Batches API for work someone is waiting on. Batches can take up to 24 hours."],
  "self-review": ["Self-review", "Asking the same session to check its own work, where it shares the same blind spots."],
  "text-signal-loops": ["Text-signal loops", "Ending an agent loop by parsing the model's words instead of checking stop_reason."],
  "symptom-fix": ["Fixing the symptom", "Patching what you can see instead of the thing that is actually broken."],
  "wrong-scope": ["Wrong scope", "Putting config, rules or context at the wrong level, so it reaches too many places or too few."],
};
const SCENARIO_NAMES = ["Customer Support Resolution Agent", "Code Generation with Claude Code", "Multi-Agent Research System", "Developer Productivity with Claude", "Claude Code for Continuous Integration", "Structured Data Extraction"];

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CODEY = /(\b[a-z]+(?:_[a-z]+)+\b|\bCLAUDE\.md\b|\.mcp\.json\b|(?:~\/)?\.claude\/[\w\/.-]*|(?<![\w-])--?[a-z][\w-]*(?=[\s.,)]|$)|(?<![\w.])\/[a-z][\w-]+(?=[\s.,)]|$))/g;
const fmt = s => { const t = esc(s); return /`/.test(s) ? t.replace(/`([^`]+)`/g, "<code>$1</code>") : t.replace(CODEY, "<code>$1</code>"); };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("ap:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("ap:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("ap:" + k); } catch {} },
};
const KEYS = "ABCDE";
/* Saved progress is keyed by the email entered on the welcome screen. It lives in this browser
   and syncs to the Worker (/api/progress), so the same email picks it up on any device. Newest save wins. */
const SYNC_KEYS = ["runL", "runP", "lastL", "lastP", "seenP", "missP", "learnP"];
const saved = {
  key: k => k + ":" + (store.get("email") || "").toLowerCase(),
  get: k => store.get(saved.key(k)),
  set: (k, v) => { store.set(saved.key(k), v); sync.touch(); },
  del: k => { store.del(saved.key(k)); sync.touch(); },
};
const sync = {
  timer: null,
  url: () => "/api/progress?email=" + encodeURIComponent((store.get("email") || "").toLowerCase()),
  snapshot() { const o = { updatedAt: store.get(saved.key("updatedAt")) || 0 }; SYNC_KEYS.forEach(k => o[k] = saved.get(k)); return o; },
  touch() { store.set(saved.key("updatedAt"), Date.now()); clearTimeout(sync.timer); sync.timer = setTimeout(sync.push, 800); },
  push(keepalive) {
    clearTimeout(sync.timer); sync.timer = null;
    if (!store.get("email") || location.protocol === "file:") return;
    fetch(sync.url(), { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(sync.snapshot()), keepalive: !!keepalive }).catch(() => {});
  },
  // Fetch the server copy. Returns true when it was newer and replaced what this browser had.
  async pull() {
    if (!store.get("email") || location.protocol === "file:") return false;
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(sync.url(), { signal: ctl.signal, cache: "no-store" }); clearTimeout(t);
      if (!r.ok) return false;
      const remote = await r.json(), local = store.get(saved.key("updatedAt")) || 0;
      if ((remote.updatedAt || 0) > local) {
        SYNC_KEYS.forEach(k => remote[k] == null ? store.del(saved.key(k)) : store.set(saved.key(k), remote[k]));
        store.set(saved.key("updatedAt"), remote.updatedAt);
        return true;
      }
      if (local > (remote.updatedAt || 0)) sync.push();
    } catch {}
    return false;
  },
};
// Pull, then redraw the path screen if it is showing and the server had newer progress.
const pullAndRefresh = () => sync.pull().then(changed => { if (changed && $(".path-screen")) choosePath(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.timer) sync.push(true); else if (document.visibilityState === "visible" && $(".path-screen")) pullAndRefresh(); });
function saveL(next) { saved.set("runL", { level: L.level, lesson: L.lesson, review: L.review, ids: L.concepts.map(c => c.id), i: next.i, phase: next.phase, results: L.results }); }
function saveP(i) { saved.set("runP", { opts: P.opts, deck: P.deck.map(x => [x.s.id, x.q.id]), i, log: P.log, elapsed: (Date.now() - P.t0) / 1000, budget: P.budget }); }
function resumeL(r) {
  const byId = Object.fromEntries(DATA.learner.concepts.map(c => [c.id, c]));
  const level = r.level || 1;
  const concepts = r.ids.map(id => byId[id]).filter(c => c && (level === 1 || c.applied));
  if (!concepts.length) { saved.del("runL"); return learnMap(); }
  L = { level, lesson: r.lesson ?? null, review: r.review || [], concepts, i: r.i, phase: r.phase, results: r.results || {} };
  L.i >= L.concepts.length ? learnResults() : learnCard();
}
function resumeP(r) {
  const sc = Object.fromEntries(DATA.practitioner.scenarios.map(x => [x.id, x]));
  const deck = r.deck.map(([sid, qid]) => { const sx = sc[sid]; const q = sx && sx.questions.find(q => q.id === qid); return q && { s: sx, q }; }).filter(Boolean);
  if (!deck.length) { saved.del("runP"); return pracSetup(); }
  P = { opts: r.opts, deck, i: r.i, log: r.log || [], t0: Date.now() - (r.elapsed || 0) * 1000, budget: r.budget || deck.length * 120, timerId: null };
  P.i >= P.deck.length ? pracResults() : pracCard();
}

/* ---------- Practitioner progress: which questions you have seen and which to review ---------- */
const allP = () => DATA.practitioner.scenarios.flatMap(s => s.questions.map(q => ({ s, q })));
const seenSet = () => new Set(saved.get("seenP") || []);
const missSet = () => new Set(saved.get("missP") || []);
function markP(id, ok) {
  const seen = seenSet(); seen.add(id); saved.set("seenP", [...seen]);
  const miss = missSet(); ok ? miss.delete(id) : miss.add(id); saved.set("missP", [...miss]);
}
// Unseen questions first, then ones you have seen; random order within each group.
function pickFresh(pool, n) {
  const seen = seenSet();
  return [...shuffle(pool.filter(x => !seen.has(x.q.id))), ...shuffle(pool.filter(x => seen.has(x.q.id)))].slice(0, n);
}
// Keep each scenario's questions together, like the real exam.
function groupByScenario(items) {
  const order = [], by = {};
  items.forEach(x => { if (!by[x.s.id]) { by[x.s.id] = []; order.push(x.s.id); } by[x.s.id].push(x); });
  return order.flatMap(id => by[id]);
}
const PMODES = {
  quick: { label: "Quick set", start: "Start quick set", n: 12 },
  exam: { label: "Exam simulation", start: "Start the exam", n: 60 },
  focus: { label: "Focus", start: "Start focus set", n: 12 },
  missed: { label: "Review missed", start: "Start review", n: 30 },
};
function buildDeck(opts) {
  const pool = allP();
  if (opts.mode === "exam") return shuffle(DATA.practitioner.scenarios).slice(0, 4).flatMap(s => pickFresh(s.questions.map(q => ({ s, q })), 15));
  if (opts.mode === "missed") { const m = missSet(); return groupByScenario(shuffle(pool.filter(x => m.has(x.q.id))).slice(0, PMODES.missed.n)); }
  if (opts.mode === "focus") { const f = opts.focus || "d1"; return groupByScenario(pickFresh(pool.filter(x => f[0] === "d" ? x.q.domain === +f.slice(1) : x.s.id === f), PMODES.focus.n)); }
  return groupByScenario(pickFresh(pool, PMODES.quick.n));
}

/* ---------- Learner progress: levels made of short lessons, one lesson per domain ---------- */
const LEVELS = {
  1: { name: "Foundations", desc: "Plain explanations and friendly questions." },
  2: { name: "Applied", desc: "The same ideas in short, realistic situations." },
  3: { name: "Exam bridge", desc: "Exam-style questions with traps, from the Practitioner bank." },
};
const UNLOCK = 0.7;
const levelConcepts = lvl => DATA.learner.concepts.filter(c => lvl === 1 || (c.applied && c.applied.length === 2));
const lessonsOf = lvl => [1, 2, 3, 4, 5].map(d => ({ domain: d, concepts: levelConcepts(lvl).filter(c => c.domain === d) })).filter(x => x.concepts.length);
const learnRec = lvl => (saved.get("learnP") || {})[lvl] || {};
function levelStats(lvl) {
  const cs = levelConcepts(lvl), rec = learnRec(lvl);
  const tried = cs.filter(c => rec[c.id]).length, first = cs.filter(c => rec[c.id] === "first").length;
  return { total: cs.length, tried, first, done: cs.length > 0 && tried === cs.length, rate: tried ? first / tried : 0 };
}
const unlocked = lvl => lvl === 1 || (levelStats(lvl - 1).done && levelStats(lvl - 1).rate >= UNLOCK);
const lessonDone = (lvl, lesson) => { const rec = learnRec(lvl); return lesson.concepts.every(c => rec[c.id]); };
// The next thing to study: the first unfinished lesson in the highest unlocked level.
function nextLesson() {

    <div class="row" style="align-items:flex-end;gap:20px"><div class="score">${first}<span style="font-size:.4em;color:var(--muted)">/${L.concepts.length}</span></div><p class="lede">concepts right on the first try. ${second ? `You fixed ${second} more on the second try.` : ""}</p></div>
    <div class="bars">${doms.map(d => { const p = Math.round(byDom[d].ok / byDom[d].n * 100); return `<div class="bar-row"><div class="lbl"><span>${esc(DOMAINS[d].name)}</span><span>${p}%</span></div><div class="bar"><div style="width:${p}%;background:var(--d${d})"></div></div></div>`; }).join("")}</div>
    ${missed.length ? `<div class="stack" style="gap:10px"><h3 class="section-title">Ideas to revisit</h3><div class="revisit">${missed.map(({ c }) => `<div><b>${esc(c.title)}</b>${fmt(c.rule)}</div>`).join("")}</div></div>`
      : `<div class="insight"><b>Every concept landed.</b><span>You are ready for exam-style questions. The Practitioner path uses harder scenarios where every wrong answer is a believable trap.</span></div>`}
    ${missed.length && weakest ? `<div class="insight"><b>Focus next on ${esc(DOMAINS[weakest].short)}.</b><span>It was your lowest domain this round.</span></div>` : ""}
    ${justUnlocked ? `<div class="insight unlock"><b>Level ${justUnlocked} unlocked: ${LEVELS[justUnlocked].name}.</b><span>${LEVELS[justUnlocked].desc}</span></div>` : ""}
    <div class="row">${nx ? `<button class="btn" id="nextL" type="button">Next lesson</button>` : justUnlocked === 3 || unlocked(3) ? `<button class="btn" id="toPrac" type="button">Try exam-style questions</button>` : ""}${missed.length ? `<button class="btn ghost" id="again" type="button">Practice the ${missed.length} I missed</button>` : ""}<button class="btn ghost" id="map" type="button">All levels</button></div>
  </div>`);
  const a = $("#again"); if (a) a.onclick = () => learnStart(missed.map(x => x.c.id));
  const n = $("#nextL"); if (n) n.onclick = () => startLesson(nx.level, nx.lesson);
  const tp = $("#toPrac"); if (tp) tp.onclick = pracSetup;
  $("#map").onclick = learnMap;
  if (first === L.concepts.length || justUnlocked) burst($(".score"));
}

/* ---------- 5. Practitioner ---------- */
let P = null;
function pracSetup() {
  keyHandler = null; topbar();
  const nP = allP().length, seenN = seenSet().size, missN = missSet().size;
  const opts = { mode: store.get("pmode") || "quick", focus: store.get("pfocus") || "d1", timed: store.get("timed") ?? false };
  if (opts.mode === "missed" && !missN) opts.mode = "quick";
  const focusChips = [...[1, 2, 3, 4, 5].map(d => [`d${d}`, DOMAINS[d].short]), ...DATA.practitioner.scenarios.map(x => [x.id, x.title])];
  const render = () => {
    const exam = opts.mode === "exam";
    show(`<div class="card stack" style="gap:20px">
      <span class="eyebrow">Practitioner reps</span>
      <h1 style="font-size:clamp(1.7rem,5.5vw,2.2rem)">Pick a session.</h1>
      <p class="lede">${seenN ? `You have seen ${seenN} of ${nP} questions${missN ? ` and have ${missN} to review` : ""}. New questions come first.` : `${nP} questions in six scenarios. New questions come first, and option order is shuffled every time.`}</p>
      <div class="options-grid">
        <button class="choice ${opts.mode === "quick" ? "on" : ""}" data-mode="quick" type="button"><b>Quick set</b><span>12 questions, about 15 minutes</span></button>
        <button class="choice ${exam ? "on" : ""}" data-mode="exam" type="button"><b>Exam simulation</b><span>60 questions from 4 scenarios, 120 minutes</span></button>
        <button class="choice ${opts.mode === "focus" ? "on" : ""}" data-mode="focus" type="button"><b>Focus</b><span>12 questions on one domain or scenario</span></button>
        <button class="choice ${opts.mode === "missed" ? "on" : ""}" data-mode="missed" type="button" ${missN ? "" : "disabled"}><b>Review missed</b><span>${missN ? `${missN} question${missN > 1 ? "s" : ""} you got wrong` : "Nothing to review yet"}</span></button>
      </div>
      ${opts.mode === "focus" ? `<div class="stack" style="gap:8px"><b>Focus on</b><div class="chips">${focusChips.map(([k, l]) => `<button class="pill ${opts.focus === k ? "on" : ""}" data-focus="${k}" type="button">${esc(l)}</button>`).join("")}</div></div>` : ""}
      ${exam ? `<p class="hint">Timed like the real exam: 2 minutes per question. Each scenario's questions come together.</p>` : `<div class="stack" style="gap:8px"><b>Pace</b><div class="options-grid">
        <button class="choice ${!opts.timed ? "on" : ""}" data-timed="0" type="button"><b>Untimed</b><span>Take as long as you need</span></button>
        <button class="choice ${opts.timed ? "on" : ""}" data-timed="1" type="button"><b>Exam pace</b><span>A clock with 2 minutes per question</span></button>
      </div></div>`}
      <div class="row"><button class="btn" id="startP" type="button">${PMODES[opts.mode].start}</button></div>
    </div>`);
    app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { opts.mode = b.dataset.mode; store.set("pmode", opts.mode); render(); });
    app.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => { opts.focus = b.dataset.focus; store.set("pfocus", opts.focus); render(); });
    app.querySelectorAll("[data-timed]").forEach(b => b.onclick = () => { opts.timed = b.dataset.timed === "1"; store.set("timed", opts.timed); render(); });
    $("#startP").onclick = () => pracStart({ ...opts, timed: exam || opts.timed });
  };
  render();
}
function pracStart(opts, onlyIds) {
  const deck = onlyIds ? groupByScenario(shuffle(allP().filter(x => onlyIds.includes(x.q.id)))) : buildDeck(opts);
  if (!deck.length) return pracSetup();
  P = { opts, deck, i: 0, log: [], t0: Date.now(), budget: deck.length * 120, timerId: null };
  saveP(0);
  pracCard();
}
function fmtTime(sec) { const s = Math.abs(sec); return (sec < 0 ? "-" : "") + Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
function pracCard() {
  const { s, q } = P.deck[P.i];
  const prev = P.deck[P.i - 1];
  const newScenario = !prev || prev.s.id !== s.id;
  const order = shuffle(q.options.map((_, i) => i));
  const multi = q.type === "multi", need = multi ? 2 : 1;
  const sel = new Set(); let conf = null, done = false;
  const pct = (P.i / P.deck.length) * 100;
  show(`<div class="stack">
    <div class="progress" aria-hidden="true"><div style="width:${pct}%"></div></div>
    <div class="card stack" style="gap:18px">
      <div class="qmeta"><span>Question ${P.i + 1} of ${P.deck.length}</span><span class="row" style="gap:8px">${P.opts.timed ? `<span class="timer" id="timer"></span>` : ""}${domTag(q.domain)}</span></div>
      ${newScenario
        ? `<div class="scenario-box"><b>Scenario: ${esc(s.title)}</b><br>${fmt(s.setup)}</div>`
        : `<details class="scenario-box"><summary><b>Scenario: ${esc(s.title)}</b></summary><p style="margin-top:6px">${fmt(s.setup)}</p></details>`}
      <p class="qprompt">${fmt(q.prompt)}</p>
      <div class="opts">${order.map((o, k) => `<button class="opt" type="button" data-o="${o}" aria-pressed="false"><span class="key">${KEYS[k]}</span><span class="txt">${fmt(q.options[o].text)}</span></button>`).join("")}</div>
      <div class="row">
        <div class="conf"><span>How sure are you?</span><button class="pill" data-c="sure" type="button">Sure</button><button class="pill" data-c="unsure" type="button">Guessing</button></div>
        <span class="spacer"></span>
        <button class="btn" id="submit" type="button" disabled>Check answer</button>
      </div>
      <div id="fb"></div>
      <span class="kbd-hint">Tip: press A to ${KEYS[order.length - 1]} to pick, Enter to check.</span>
    </div></div>`);
  const btns = [...app.querySelectorAll(".opt")], submit = $("#submit");
  if (P.opts.timed) {
    clearInterval(P.timerId);
    const tick = () => { const el = $("#timer"); if (!el) return clearInterval(P.timerId); const left = P.budget - (Date.now() - P.t0) / 1000; el.textContent = fmtTime(left) + " left"; el.classList.toggle("over", left < 0); };
    tick(); P.timerId = setInterval(tick, 1000);
  }
  const toggle = btn => {
    if (done) return;
    const o = +btn.dataset.o;
    if (sel.has(o)) sel.delete(o);
    else { if (!multi) sel.clear(); if (sel.size >= need) return; sel.add(o); }
    btns.forEach(b => { const on = sel.has(+b.dataset.o); b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); });
    submit.disabled = sel.size !== need;
  };
  btns.forEach(b => b.onclick = () => toggle(b));
  app.querySelectorAll("[data-c]").forEach(p => p.onclick = () => { if (done) return; conf = conf === p.dataset.c ? null : p.dataset.c; app.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x.dataset.c === conf)); });
  const check = () => {
    if (done || sel.size !== need) return; done = true;
    const ok = q.options.every((opt, i) => opt.correct === sel.has(i));
    const picked = [...sel];
    P.log.push({ id: q.id, domain: q.domain, ok, conf, traps: picked.map(i => q.options[i].trap).filter(Boolean) });
    markP(q.id, ok);
    saveP(P.i + 1);
    btns.forEach(b => {
      b.disabled = true; const o = +b.dataset.o, opt = q.options[o];
      b.classList.remove("sel");
      if (opt.correct) b.classList.add("right"); else if (sel.has(o)) b.classList.add("wrong"); else b.classList.add("dim");
      const chip = opt.correct ? `<span class="okchip">Correct</span>` : `<span class="trapchip">${esc((TRAPS[opt.trap] || ["Trap"])[0])}</span>`;
      b.querySelector(".txt").insertAdjacentHTML("beforeend", `<span class="rat">${chip}${fmt(opt.rationale)}</span>`);
    });
    app.querySelectorAll("[data-c]").forEach(p => p.disabled = true);
    submit.hidden = true;
    const last = P.i + 1 >= P.deck.length;
    $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}"><h3>${ok ? "Correct." : multi ? "Not both right." : "Not this time."}</h3><div class="rulebox">${fmt(q.takeaway)}</div><div class="row"><span class="spacer"></span><button class="btn" id="nx" type="button">${last ? "See my results" : "Next question"}</button></div></div>`;
    if (ok) burst(app.querySelector(".opt.right"));
    const nx = () => { P.i++; if (P.i >= P.deck.length) pracResults(); else pracCard(); };
    $("#nx").onclick = nx; $("#nx").focus({ preventScroll: true });
    $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); nx(); } };
  };
  submit.onclick = check;
  keyHandler = e => {
    const k = "abcde".indexOf(e.key.toLowerCase()), n = "12345".indexOf(e.key), idx = k >= 0 ? k : n;
    if (idx >= 0 && btns[idx]) toggle(btns[idx]);
    if (e.key === "Enter") { e.preventDefault(); check(); }
  };
}
function pracResults() {
  keyHandler = null; clearInterval(P.timerId);
  const n = P.log.length, ok = P.log.filter(x => x.ok).length, pct = Math.round(ok / n * 100);
  const byDom = {};
  P.log.forEach(x => { const d = byDom[x.domain] || (byDom[x.domain] = { ok: 0, n: 0 }); d.n++; if (x.ok) d.ok++; });
  const doms = Object.keys(byDom).map(Number).sort();
  const trapCount = {};
  P.log.forEach(x => x.traps.forEach(t => trapCount[t] = (trapCount[t] || 0) + 1));
  const topTraps = Object.entries(trapCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const sure = P.log.filter(x => x.conf === "sure"), guess = P.log.filter(x => x.conf === "unsure");
  const sureAcc = sure.length ? Math.round(sure.filter(x => x.ok).length / sure.length * 100) : null;
  const guessAcc = guess.length ? Math.round(guess.filter(x => x.ok).length / guess.length * 100) : null;
  const elapsed = (Date.now() - P.t0) / 1000;
  const missed = P.log.filter(x => !x.ok).map(x => x.id);
  saved.del("runP"); saved.set("lastP", `${pct}%, ${ok} of ${n} correct${P.opts.mode ? ` (${PMODES[P.opts.mode].label.toLowerCase()})` : ""}`);
  const verdict = pct >= 80 ? "Exam-ready pace. Keep the reps going." : pct >= 70 ? "Close to the line. Tighten your weakest domain." : "Building up. Review the traps below, then go again.";
  show(`<div class="card stack" style="gap:24px">
    <span class="eyebrow">Practitioner results</span>
    <div class="row" style="align-items:flex-end;gap:20px"><div class="score">${pct}%</div><p class="lede">${ok} of ${n} correct${P.opts.timed ? ` in ${fmtTime(elapsed)} (budget ${fmtTime(P.budget)})` : ""}. ${verdict}</p></div>
    <div class="stack" style="gap:12px"><h3 class="section-title">By domain</h3><div class="bars">${doms.map(d => { const p = Math.round(byDom[d].ok / byDom[d].n * 100); return `<div class="bar-row"><div class="lbl"><span>${esc(DOMAINS[d].name)}</span><span>${byDom[d].ok}/${byDom[d].n}</span></div><div class="bar"><div style="width:${p}%;background:var(--d${d})"></div></div></div>`; }).join("")}</div></div>
    ${topTraps.length ? `<div class="stack" style="gap:10px"><h3 class="section-title">The traps that caught you</h3>${topTraps.map(([t, c], i) => `<div class="insight" ${i ? 'style="background:var(--tile)"' : ""}><b>${esc(TRAPS[t][0])} · ${c}×</b><span>${esc(TRAPS[t][1])}</span></div>`).join("")}</div>`
      : `<div class="insight"><b>No traps caught you.</b><span>Every wrong option was a named trap, and you avoided all of them.</span></div>`}
    ${sureAcc !== null || guessAcc !== null ? `<div class="stack" style="gap:6px"><h3 class="section-title">Confidence check</h3><p class="lede" style="font-size:.95rem">${sureAcc !== null ? `When you felt sure, you were right ${sureAcc}% of the time (${sure.length} questions). ` : ""}${guessAcc !== null ? `When you were guessing, you were right ${guessAcc}% of the time (${guess.length} questions).` : ""}${sureAcc !== null && sureAcc < 75 ? " Some confident answers were wrong, so slow down on questions that feel easy." : ""}</p></div>` : ""}
    <div class="row">${missed.length ? `<button class="btn" id="retry" type="button">Retry the ${missed.length} I missed</button>` : ""}<button class="btn ${missed.length ? "ghost" : ""}" id="newDraw" type="button">New session</button><button class="btn ghost" id="toLearn" type="button">Learner path</button></div>
  </div>`);
  const r = $("#retry"); if (r) r.onclick = () => pracStart(P.opts, missed);
  $("#newDraw").onclick = pracSetup; $("#toLearn").onclick = () => intro(0);
  if (pct >= 80) burst($(".score"));
}

/* ---------- boot ---------- */
if (store.get("email")) { choosePath(); pullAndRefresh(); } else welcome();
</script>
