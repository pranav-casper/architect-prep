ooks accurate before going on.","correct":false,"trap":"self-review","rationale":"The session judges its stale analysis against its own stale context, so it has no basis to notice what the rewrite changed."},{"text":"Start a fresh session for the ledger work, seeded with a structured summary of what ledger-review concluded.","correct":true,"trap":null,"rationale":"The rewrite makes ledger-review's tool results stale, so a fresh session with a summary is more reliable than resuming."}],"takeaway":"Resume when prior context is still valid, and start fresh with an injected summary when prior tool results are stale."},{"id":"s4q15","domain":2,"ts":"2.3","type":"single","prompt":"A ticket-triage chore makes one request per new Jira issue. The agent has three tools, label_issue, link_duplicate and request_info, and your code expects exactly one of them to be called. With tool_choice set to \"auto\", about 7% of responses are plain text, such as \"This looks like a duplicate of PAY-212,\" with no tool call. What should you change?","options":[{"text":"Keep \"auto\", and add a system prompt line saying the agent must always respond by calling exactly one of the three tools.","correct":false,"trap":"system-prompt-enforcement","rationale":"With \"auto\" the model may still answer in text; a prompt line lowers the rate but does not guarantee a tool call."},{"text":"Keep \"auto\", and add twelve example issues to the prompt, each one paired with the tool call the agent should make for it.","correct":false,"trap":"few-shot-overload","rationale":"Examples may shift behavior but leave text replies possible; the API setting that requires a tool call is the direct fix."},{"text":"Force tool_choice to label_issue on every request, so that a tool call is always made whenever a new Jira issue arrives.","correct":false,"trap":"symptom-fix","rationale":"Forcing one tool removes the missing-call symptom but means duplicates are never linked and missing info is never requested."},{"text":"Set tool_choice to \"any\", so the model must call one of the three tools but can still choose which one fits the issue.","correct":true,"trap":null,"rationale":"\"any\" guarantees a tool call instead of conversational text while leaving the choice among the three tools to the model."}],"takeaway":"Set tool_choice to \"any\" when the model must call a tool but should still choose which one."},{"id":"s4q16","domain":2,"ts":"2.5","type":"multi","prompt":"An engineer asks the agent two things about the checkout repo: list every Playwright spec file, all named *.spec.ts and spread across 30 directories, and find where the error message \"Cart session expired\" is raised. Which two tool choices fit these requests? Select TWO.","options":[{"text":"Use Glob with the pattern **/*.spec.ts to list the spec files by name across every directory.","correct":true,"trap":null,"rationale":"Glob matches file paths against name patterns, which is exactly what listing *.spec.ts files requires."},{"text":"Connect a file-index MCP server and use its list_files and search tools for both of these requests.","correct":false,"trap":"tool-bloat","rationale":"The built-in Glob and Grep already answer both requests, so another server only adds tools the agent does not need."},{"text":"Read every file under src/ first, so the agent has all the contents in context before answering either.","correct":false,"trap":"over-engineering","rationale":"Reading everything upfront wastes context; Glob and Grep answer both questions directly."},{"text":"Use Grep for the string \"Cart session expired\" to find the files whose code raises that error.","correct":true,"trap":null,"rationale":"Grep searches file contents, so it finds where the error message string appears in the code."},{"text":"Use Glob with the pattern **/*expired* to find the file that raises the \"Cart session expired\" error.","correct":false,"trap":"wrong-scope","rationale":"Glob matches file paths, not file contents, so it searches the wrong scope and finds the error only if a file happens to be named after it."}],"takeaway":"Use Glob to find files by name pattern and Grep to search file contents."},{"id":"s4q17","domain":2,"ts":"2.5","type":"single","prompt":"The agent must change retry_limit: 3 to retry_limit: 5 in only the payments block of a legacy deploy.yaml. The file has six identical service blocks except for each block's name line, which sits 40 lines above the setting. Edit has failed four times because every anchor it tries matches more than one block. What should the agent do next?","options":[{"text":"Keep retrying Edit with different short anchors around retry_limit: 3 until one of them matches a single block.","correct":false,"trap":"symptom-fix","rationale":"The blocks are identical around the setting, so more short anchors will keep matching several blocks and failing."},{"text":"Read the full file, change the value in the payments block, and Write the complete updated file back.","correct":true,"trap":null,"rationale":"When Edit cannot find a short unique anchor, Read plus Write is the guide's reliable fallback; a 40-line anchor spanning the name line would be fragile and easy to mistype."},{"text":"Split deploy.yaml into one file per service so every setting has a unique anchor, then edit the payments file.","correct":false,"trap":"over-engineering","rationale":"Restructuring the deploy config is a large, risky change made only to work around a tool limitation."},{"text":"Connect a YAML-editing MCP server that exposes a set_yaml_value tool, and use it to update the payments block.","correct":false,"trap":"tool-bloat","rationale":"The built-in Read and Write tools already handle this; a new server adds tools the agent does not need."}],"takeaway":"When Edit fails because the anchor text is not unique, Read the whole file and Write the updated version."},{"id":"s4q18","domain":2,"ts":"2.5","type":"single","prompt":"An engineer asks how a refund request travels through the billing monolith, which has about 1,800 Java files. The agent's first move is to Glob every .java file and Read them in alphabetical order, and its context fills up in the util package before it reaches any refund code. What approach should it take instead?","options":[{"text":"Connect an MCP server that indexes the monolith, and give the agent its eight query tools alongside the built-in ones.","correct":false,"trap":"tool-bloat","rationale":"Eight more tools add selection complexity for a question that Grep and Read can answer directly."},{"text":"Spawn one subagent per package to read all of its files and summarize them, then search the summaries for refund logic.","correct":false,"trap":"over-engineering","rationale":"This still reads all 1,800 files, just in parallel, when a targeted search finds the refund path directly."},{"text":"Grep for refund entry points, such as the refund API route, Read those files, then follow their imports to trace the flow.","correct":true,"trap":null,"rationale":"Starting from Grep hits and following imports builds understanding incrementally, reading only the files on the refund path."},{"text":"Add a system prompt rule telling the agent to read controller files before utility files whenever it explores Java code.","correct":false,"trap":"system-prompt-enforcement","rationale":"A reordering rule still reads files upfront in bulk instead of following the refund flow from its entry points."}],"takeaway":"Build codebase understanding incrementally: Grep for entry points, then Read and follow imports instead of reading everything."},{"id":"s4q19","domain":3,"ts":"3.3","type":"single","prompt":"The root CLAUDE.md holds 300 lines of Terraform conventions. Terraform files live in infra/, in services/*/deploy/ and in tools/bootstrap/, but most engineers edit only application code, and every session loads those 300 lines anyway. You want the conventions loaded only when someone edits Terraform files. What should you do?","options":[{"text":"Move them to .claude/rules/terraform.md with YAML frontmatter paths: [\"**/*.tf\"], so it loads only for matching files.","correct":true,"trap":null,"rationale":"A path-scoped rule loads only when matching files are edited, wherever they live, which cuts irrelevant context for everyone else."},{"text":"Move them into a CLAUDE.md file inside infra/, the directory that holds most of the Terraform code in the repository.","correct":false,"trap":"symptom-fix","rationale":"A directory-level CLAUDE.md covers only infra/, so Terraform files in services/*/deploy/ and tools/bootstrap/ lose the conventions."},{"text":"Move them into the ~/.claude/CLAUDE.md of each engineer who works on Terraform, so only those engineers load them.","correct":false,"trap":"wrong-scope","rationale":"User-level files are not shared through version control, so the conventions would drift and new engineers would not get them."},{"text":"Keep them in the root CLAUDE.md under a heading that tells Claude to apply the section only when editing Terraform.","correct":false,"trap":"system-prompt-enforcement","rationale":"The 300 lines still load in every session; a heading relies on inference and saves no context."}],"takeaway":"Use .claude/rules/ files with glob paths frontmatter for conventions that apply to file types spread across directories."},{"id":"s4q20","domain":3,"ts":"3.4","type":"single","prompt":"Two requests reach the assistant. One is a NullPointerException in InvoiceFormatter.format(), with a stack trace pointing to line 88 where a missing discount field is dereferenced. The other is deciding whether billing should publish events to a queue or expose a polling API, which need different infrastructure. How should each one be handled?","options":[{"text":"Plan mode for both, since any change to a 15-year-old monolith is risky and deserves a full design pass before edits.","correct":false,"trap":"over-engineering","rationale":"Planning a one-line fix with a clear stack trace adds overhead without reducing any real risk."},{"text":"Direct execution for both, then have the same session review the integration code it wrote and switch if it looks wrong.","correct":false,"trap":"self-review","rationale":"Building first risks costly rework, and the same session reviewing its own choice is unlikely to question it."},{"text":"Direct execution for both, with several example queue and polling designs from other teams attached to the integration.","correct":false,"trap":"few-shot-overload","rationale":"Examples do not replace exploring this codebase and comparing the approaches before committing to one."},{"text":"Direct execution for the InvoiceFormatter fix, and plan mode to explore and compare the two integration options first.","correct":true,"trap":null,"rationale":"A single-file bug with a clear stack trace is well scoped, while an architectural choice with infrastructure trade-offs needs planning first."}],"takeaway":"Use direct execution for well-scoped fixes and plan mode for architectural decisions with multiple valid approaches."},{"id":"s4q21","domain":3,"ts":"3.5","type":"single","prompt":"An engineer asks the agent to add a caching layer in front of the legacy billing rate lookup, a domain neither of them knows well. Rates can change mid-month, and several downstream jobs read them. The engineer's whole prompt is \"add caching to getRate()\". What is the best way to start?","options":[{"text":"Paste ten example caching implementations from other services into the prompt, so the agent can follow the common pattern.","correct":false,"trap":"few-shot-overload","rationale":"Generic examples do not answer the questions specific to this domain, such as when cached rates become invalid."},{"text":"Have the agent interview the engineer first, asking about rate changes, invalidation and failure modes, before writing code.","correct":true,"trap":null,"rationale":"The interview pattern surfaces design considerations, such as cache invalidation, that neither person has thought through yet."},{"text":"Let the agent implement a cache straight away, then have the same session review its own code for any invalidation problems.","correct":false,"trap":"self-review","rationale":"The session would review code built on unexamined assumptions, so it is likely to miss the same considerations again."},{"text":"Submit three caching design prompts through the Message Batches API overnight and pick the best result the next morning.","correct":false,"trap":"batch-for-blocking","rationale":"The engineer is working on this now, and batch results can take up to 24 hours without addressing the missing requirements."}],"takeaway":"In unfamiliar domains, use the interview pattern so Claude surfaces design questions before it implements."}]},{"id":"s5","title":"Claude Code for Continuous Integration","setup":"Your organization runs Claude Code in its CI/CD pipeline on every pull request. The pipeline invokes Claude Code non-interactively to review diffs, generate unit tests for changed code, and post findings as inline PR comments. Some checks block merging and others run on a nightly schedule. Engineering leadership measures success by how often developers act on the feedback rather than dismissing it.","questions":[{"id":"s5q1","domain":3,"ts":"3.6","type":"single","prompt":"The review step runs claude -p with a prompt that asks for findings as JSON. A script parses stdout and posts each finding as an inline comment. About 1 run in 12 fails to parse because the output is wrapped in a markdown code fence or starts with a sentence such as \"Here are the findings:\". What is the best fix?","options":[{"text":"Tighten the prompt to say the response must contain only raw JSON with no commentary or fences, and add a regex step that strips code fences before parsing.","correct":false,"trap":"system-prompt-enforcement","rationale":"Prose instructions reduce the failure rate but never remove it, and the regex only covers the failure shapes you have already seen."},{"text":"Pipe the review output into a second claude -p call whose only job is to convert the previous response into valid JSON before the posting script runs.","correct":false,"trap":"over-engineering","rationale":"A second model call doubles cost and latency and can fail in the same way. The CLI already has a way to enforce structured output."},{"text":"Add four examples of correctly formatted JSON findings to the project CLAUDE.md so CI-invoked sessions see exactly what output format they are expected to produce.","correct":false,"trap":"few-shot-overload","rationale":"Examples improve consistency but still rely on the model choosing to comply. Parsing reliability in CI needs enforced structure, not more demonstrations."},{"text":"Run the review with --output-format json and a --json-schema that describes each finding, then have the script parse that structured result instead of free text.","correct":true,"trap":null,"rationale":"These flags make Claude Code emit machine-parseable output that matches the schema, which is what automated posting of inline comments needs."}],"takeaway":"In CI, use --output-format json with --json-schema to get machine-parseable findings rather than asking for JSON in prose."},{"id":"s5q2","domain":4,"ts":"4.1","type":"single","prompt":"The review reports five categories: security, correctness, performance, naming, and comment accuracy. Over a month, developers dismissed 71% of comment-accuracy findings, most of which flagged comments that were merely terse or loosely worded. A survey shows developers now also dismiss security findings without reading them. What should you do first?","options":[{"text":"Turn off the comment-accuracy category for now, and rewrite its criteria so it flags only comments whose described behavior contradicts what the code actually does.","correct":true,"trap":null,"rationale":"Pausing the noisy category restores trust in the accurate ones, and explicit categorical criteria are what actually improve precision."},{"text":"Add an instruction to the review prompt telling Claude to be conservative and to report only findings it is highly confident about across all five categories.","correct":false,"trap":"symptom-fix","rationale":"General instructions such as \"be conservative\" do not improve precision the way specific criteria do, and they risk suppressing real security findings."},{"text":"Have Claude attach a 1 to 10 confidence score to each finding and suppress comment-accuracy findings scored below 8 before the pipeline posts them.","correct":false,"trap":"self-review","rationale":"Self-reported confidence is poorly calibrated. The model is already confident about the terse-comment flags that developers dismiss."},{"text":"Train a lightweight classifier on the month of dismissed findings and use it to filter out comments developers are likely to dismiss before they are posted.","correct":false,"trap":"over-engineering","rationale":"A classifier needs labeled data and upkeep, and it hides a prompt problem instead of fixing the vague criteria that create the noise."}],"takeaway":"Restore developer trust by disabling high false positive categories while replacing vague instructions with explicit reporting criteria."},{"id":"s5q3","domain":4,"ts":"4.6","type":"single","prompt":"A pipeline step uses one Claude Code session to write a fix for a failing integration test. In the same session it then asks Claude to review the fix for bugs before opening a PR. Human reviewers keep finding off-by-one and null-handling bugs that this review step approved. How should you restructure the review step?","options":[{"text":"Enable extended thinking for the review turn in the same session so Claude reasons more carefully about edge cases in the code it just generated before approving it.","correct":false,"trap":"self-review","rationale":"More reasoning inside the same session still starts from the generator's own assumptions, so it tends to confirm the decisions it already made."},{"text":"Add a review checklist to the prompt telling Claude to assume the fix contains bugs and to critique it as a skeptical senior engineer would before approving it.","correct":false,"trap":"system-prompt-enforcement","rationale":"A skeptical persona is still a prompt applied to a session that holds the reasoning behind the fix. It does not remove that context."},{"text":"Review the fix with a separate Claude instance that receives only the diff and the failing test, without the generating session's reasoning.","correct":true,"trap":null,"rationale":"An independent instance has no prior reasoning to defend, so it is more likely to question the edge cases the generator glossed over."},{"text":"Move the review to a nightly Message Batches job that re-reviews every generated fix, so a fuller analysis can run without slowing down the PR pipeline.","correct":false,"trap":"batch-for-blocking","rationale":"The review gates opening the PR, so it is blocking work. A batch job with no latency guarantee cannot serve as that gate."}],"takeaway":"Use an independent review instance without the generator's context, because a session is poor at questioning its own output."},{"id":"s5q4","domain":3,"ts":"3.6","type":"multi","prompt":"Two complaints arrive about the PR pipeline. When a developer pushes new commits, the re-run review posts a fresh copy of every finding, including ones already raised on earlier commits. Separately, the test-generation step keeps proposing test cases that already exist in the module's test file. Which changes address these complaints? Select TWO.","options":[{"text":"Pass the findings from the previous review run into the prompt, and instruct Claude to report only issues that are new or still unaddressed since that run.","correct":true,"trap":null,"rationale":"A CI run has no memory of earlier runs, so the prior findings must be supplied in context. Then Claude can skip what was already raised."},{"text":"Add a line to the project CLAUDE.md telling Claude never to repeat a comment it made on the pull request before and to skip any scenario it has tested already.","correct":false,"trap":"system-prompt-enforcement","rationale":"The instruction refers to history the CI session cannot see. Without prior findings or tests in context, Claude has nothing to compare against."},{"text":"Move both the re-run review and test generation to the Message Batches API, and deduplicate the results by custom_id before anything is posted to the PR.","correct":false,"trap":"batch-for-blocking","rationale":"PR feedback is expected promptly and batches have no latency guarantee. custom_id correlates requests with responses and does nothing to detect duplicate findings."},{"text":"Include the module's existing test file in the test-generation context, so Claude can see which scenarios are already covered before it proposes any new ones.","correct":true,"trap":null,"rationale":"Claude can only avoid duplicate scenarios it can see. Providing existing tests in context is the direct fix for redundant test suggestions."},{"text":"Hash each comment body and drop any new comment whose hash matches one already on the PR, and do the same for generated test names before they are committed.","correct":false,"trap":"symptom-fix","rationale":"Exact-match hashing misses the same finding or test worded differently, so duplicates still get through while the cause stays in place."}],"takeaway":"Give CI runs the context they lack, prior findings for re-reviews and existing tests for test generation, instead of filtering output afterward."},{"id":"s5q5","domain":4,"ts":"4.5","type":"single","prompt":"To cut costs, the team moved its nightly test-generation job to the Message Batches API. In the old synchronous version, Claude wrote tests, called a run_tests tool, read the failures, and revised the tests over several turns. Since the move, batch results contain test files that were never executed, and about 30% of them fail when CI runs them the next morning. What is the best way to keep the cost savings?","options":[{"text":"Set tool_choice to force run_tests in each batch request so that Claude is required to execute the generated tests before the batch request is allowed to complete.","correct":false,"trap":"symptom-fix","rationale":"Forcing the tool only makes Claude emit a tool_use block. Nothing executes it and returns the result within a batch request, so the tests still never run."},{"text":"Batch only the first-pass generation, run the generated tests in your own job runner, and submit a follow-up batch with the failing tests and their error output.","correct":true,"trap":null,"rationale":"The Batches API does not support multi-turn tool calling inside one request. Running tests between batches restores the feedback loop while keeping the discount."},{"text":"Move the nightly job back to synchronous calls, because tests that need execution feedback cannot be produced with batch processing in any form or configuration.","correct":false,"trap":"wrong-scope","rationale":"This gives up the savings for a job that is latency tolerant. The limitation is per request, and the loop can be rebuilt across successive batches."},{"text":"Raise max_tokens in each batch request so Claude has room to simulate the test run in its own reasoning and correct failing assertions before returning a file.","correct":false,"trap":"self-review","rationale":"Mentally simulating a test run is not executing it. The model checking its own output misses the same failures that real execution would expose."}],"takeaway":"The Batches API cannot run tools mid-request, so latency-tolerant work that needs tool feedback must loop across batches or stay synchronous."},{"id":"s5q6","domain":3,"ts":"3.6","type":"single","prompt":"CI-invoked test generation produces many low-value tests, such as assertions on simple getters and constructors. It also builds database objects by hand even though the repository provides factory fixtures in tests/factories/. Developers delete most of the generated tests. Where should guidance on what makes a test valuable and which fixtures to use live?","options":[{"text":"In ~/.claude/CLAUDE.md baked into the CI runner image, so every pipeline run loads the testing standards without adding files developers must maintain in the repo.","correct":false,"trap":"wrong-scope","rationale":"User-level memory on a runner image is invisible to developers and not versioned with the code, so it drifts from the fixtures it describes."},{"text":"In the -p prompt string of the pipeline script, together with ten example tests that cover every fixture factory and every assertion style the team uses.","correct":false,"trap":"few-shot-overload","rationale":"Ten full examples bloat every invocation and teach by imitation rather than stating the criteria. They are also buried in a script instead of shared project context."},{"text":"In a post-generation script that runs coverage and deletes any generated test that does not raise line coverage before the tests are committed to the branch.","correct":false,"trap":"symptom-fix","rationale":"Filtering after generation wastes the work and treats coverage as value. Claude still has no idea which fixtures to use or what the team considers worth testing."},{"text":"In the project CLAUDE.md, documenting the team's criteria for valuable tests and the fixture factories that exist, so CI-invoked Claude Code reads them.","correct":true,"trap":null,"rationale":"Project CLAUDE.md is how CI-invoked Claude Code receives project context such as testing standards and fixture conventions, and it is versioned with the code."}],"takeaway":"Document testing standards and available fixtures in the project CLAUDE.md so CI-invoked Claude Code generates higher-value tests."},{"id":"s5q7","domain":4,"ts":"4.4","type":"single","prompt":"Developers dismiss about 30% of the review bot's inline comments. The team wants to learn which kinds of code trigger the findings that get dismissed, so they can fix the prompt where it matters most. Each finding currently has file, line, severity and message fields. What should they add first?","options":[{"text":"Add a detected_pattern field to each finding naming the code construct that triggered it, then analyze which patterns get dismissed most.","correct":true,"trap":null,"rationale":"Tagging findings by the construct that triggered them turns dismissals into data, showing exactly which criteria produce false positives."},{"text":"Train a model on past dismissed comments to predict whether a new comment will be dismissed, and suppress any comment it scores as likely.","correct":false,"trap":"over-engineering","rationale":"This hides comments without explaining why they are wrong, and it needs labeled data and new infrastructure."},{"text":"Ask Claude, in the same review session, to rate how confident it is in each finding, and hide any finding it rates below 6 out of 10.","correct":false,"trap":"self-review","rationale":"Self-rated confidence from the session that made the finding is poorly calibrated, and it reveals nothing about which patterns misfire."},{"text":"Raise the minimum severity for posting comments from low to medium, so fewer findings get posted and the dismissal rate goes down.","correct":false,"trap":"symptom-fix","rationale":"The dismissal rate drops because fewer comments are posted, not because they are more accurate. Real issues are hidden too."}],"takeaway":"Add a detected_pattern field to findings so you can see which code constructs cause false positives and fix those criteria."},{"id":"s5q8","domain":1,"ts":"1.6","type":"single","prompt":"Leadership asks the nightly pipeline to \"add comprehensive tests\" to the legacy billing service, which has 140 source files and almost no tests. The first run walked the files in alphabetical order and spent its whole budget on small helper modules, leaving the invoice and payment paths untested. How should you structure this task?","options":[{"text":"Spawn one subagent per source file in parallel, each writing tests for its own file, and merge all 140 resulting test files into one nightly pull request.","correct":false,"trap":"over-engineering","rationale":"This adds 140 agents but still treats every file as equally important, so effort is not focused on the invoice and payment paths."},{"text":"First have Claude map the service structure and find the high-impact areas, then follow a prioritized test plan that it revises as new dependencies turn up.","correct":true,"trap":null,"rationale":"Open-ended tasks like this call for dynamic decomposition: map structure, identify high-impact areas, then work a prioritized plan that adapts to what is found."},{"text":"Raise the job's turn limit and time budget so the alphabetical walk can reach every file in the service, including the invoice and payment modules.","correct":false,"trap":"symptom-fix","rationale":"A bigger budget lets the same unprioritized walk run longer. It does not make the job find and focus on the areas that matter most."},{"text":"Add fifteen example test files from other services to the prompt, so Claude sees what comprehensive coverage looks like before it starts on billing.","correct":false,"trap":"few-shot-overload","rationale":"The gap is the lack of a plan and priorities, not knowledge of what a test looks like. More examples do not change the order of work."}],"takeaway":"For open-ended work like adding tests to a legacy codebase, map the structure first, then follow a prioritized plan that adapts to what you find."},{"id":"s5q9","domain":2,"ts":"2.1","type":"single","prompt":"The review agent has two MCP tools with detailed, distinct descriptions: search_code finds definitions and callers in the repository, and search_tickets finds issue-tracker tickets. The system prompt says \"Before commenting on a bug fix, always search the codebase for the original bug report.\" Logs show the agent sending ticket-style queries such as \"login timeout customer report\" to search_code. What should you change first?","options":[{"text":"Expand both tool descriptions further with more example queries and edge cases, since descriptions are the main signal the model uses to pick a tool.","correct":false,"trap":"symptom-fix","rationale":"The descriptions are already clear. The system prompt's wording \"search the codebase\" is what pulls the agent to search_code, so better descriptions will not fix it."},{"text":"Merge search_code and search_tickets into one search tool that sends every query to both backends and returns whichever gives more matches.","correct":false,"trap":"over-engineering","rationale":"Merging removes a clean boundary between two well-described tools and adds noisy mixed results, when a one-line prompt fix addresses the cause."},{"text":"Reword the instruction to say original bug reports are found with search_tickets, removing the phrase that ties them to the codebase.","correct":true,"trap":null,"rationale":"Keyword-sensitive system prompt wording can override good tool descriptions. Fixing the instruction removes the false association with search_code."},{"text":"Add ten examples to the system prompt of bug-fix reviews where the agent calls search_tickets, covering every ticket query style seen so far.","correct":false,"trap":"few-shot-overload","rationale":"Examples would fight against an instruction that still says to search the codebase. The misleading wording is the gap to fix."}],"takeaway":"Check system prompts for keyword-sensitive wording that can override good tool descriptions and pull the agent toward the wrong tool."},{"id":"s5q10","domain":3,"ts":"3.6","type":"single","prompt":"The team lead wrote review criteria in her ~/.claude/CLAUDE.md: flag missing authorization checks on new endpoints, and skip generated code under src/gen/. Her local Claude Code reviews follow them, but teammates' local reviews and the CI review job, which runs claude -p on a fresh runner against the repository checkout, ignore both rules. The team wants the same criteria applied everywhere. What is the best fix?","options":[{"text":"Copy her ~/.claude/CLAUDE.md into the home directory of the CI runner image, so the runner loads the user-level instructions she has locally.","correct":false,"trap":"wrong-scope","rationale":"This would make CI load the rules, but teammates' local reviews still miss them, and team criteria would live in one person's unversioned file that drifts from the repo."},{"text":"Add a script after the review that deletes findings under src/gen/ and posts an extra comment on any new endpoint file lacking an auth decorator.","correct":false,"trap":"symptom-fix","rationale":"This rebuilds part of the criteria in brittle post-processing instead of giving Claude the context, and a decorator check is not a real authorization review."},{"text":"Move the criteria into the project CLAUDE.md committed to the repository, so CI-invoked Claude Code loads them from the checkout on every run.","correct":true,"trap":null,"rationale":"CLAUDE.md in the project is the mechanism for giving CI-invoked Claude Code review criteria, and it is shared with the whole team via version control."},{"text":"Add a second claude -p call that receives her criteria and filters the first call's findings, removing anything that does not match her checklist.","correct":false,"trap":"over-engineering","rationale":"A second call doubles cost and can only remove findings. It cannot add the missing authorization findings the first review never produced."}],"takeaway":"CI-invoked Claude Code gets project context such as review criteria from the project CLAUDE.md in the repository, not from one user's settings."},{"id":"s5q11","domain":4,"ts":"4.1","type":"single","prompt":"The review prompt says to rate each finding critical, high, medium, or low \"based on its impact.\" An audit finds the same missing null check on a request parameter rated critical in one pull request and low in another, and developers have started ignoring severity labels. What change will make severity classification consistent?","options":[{"text":"Add an instruction asking Claude to think carefully and stay consistent with its earlier severity ratings whenever it reviews a similar issue.","correct":false,"trap":"system-prompt-enforcement","rationale":"Each CI run has no memory of earlier ratings, and a request to be consistent does not tell Claude where the boundaries between levels are."},{"text":"Run each review three times and give every finding the severity that appears most often across the three runs before posting it.","correct":false,"trap":"over-engineering","rationale":"Tripling cost averages noise from vague criteria. The same unclear definition of each level still drives every run."},{"text":"Add thirty past findings with their assigned severity to the prompt, drawn from every module, so Claude can copy the closest match.","correct":false,"trap":"few-shot-overload","rationale":"Past ratings were themselves inconsistent, and a pile of examples without stated criteria does not define where each level begins."},{"text":"Define each severity level with explicit criteria and a concrete code example, such as a null dereference on a request path for high.","correct":true,"trap":null,"rationale":"Explicit severity criteria with concrete code examples for each level give Claude a fixed reference, which produces consistent classification."}],"takeaway":"Consistent severity needs explicit criteria with a concrete code example for each level, not a vague instruction to rate by impact."},{"id":"s5q12","domain":4,"ts":"4.1","type":"single","prompt":"The review prompt ends with \"Only report high-confidence findings.\" Developers still dismiss most comments, which flag variable names, early returns, and other idioms the codebase uses everywhere, while real logic bugs get buried among them. What should you change in the prompt?","options":[{"text":"Strengthen the line to say Claude must be extremely conservative and report a finding only when it is certain the issue is worth a developer's time.","correct":false,"trap":"system-prompt-enforcement","rationale":"General instructions like \"be conservative\" fail to improve precision. Claude is often confident about style nits, so they keep coming."},{"text":"Add twenty example findings that developers accepted last quarter, covering every language and module in the repository, ahead of the instructions.","correct":false,"trap":"few-shot-overload","rationale":"The gap is the lack of criteria for what to skip. A large set of accepted findings does not tell Claude that local idioms are out of scope."},{"text":"Replace the confidence line with explicit criteria: report logic bugs, security issues, and missing error handling; skip style and local patterns.","correct":true,"trap":null,"rationale":"Specific categorical criteria for what to report and what to skip improve precision far more than confidence-based filtering."},{"text":"Give the reviewer the repository linter, a style-guide search tool, and git blame, so it can check each finding against team history before posting.","correct":false,"trap":"tool-bloat","rationale":"More tools add decision complexity without defining which issues matter. The noise comes from missing criteria, not missing data."}],"takeaway":"Precision comes from categorical criteria about what to report and what to skip, not from asking for confidence or conservatism."},{"id":"s5q13","domain":4,"ts":"4.1","type":"multi","prompt":"The team is adding a new \"missing test coverage\" category to the PR review, alongside the security and correctness categories developers trust today. Leadership worries that a noisy new category could make developers start dismissing every finding. Which practices should the team adopt for the launch? Select TWO.","options":[{"text":"Tell Claude to report coverage gaps only when it is highly confident, so the new category starts out quiet and earns trust gradually.","correct":false,"trap":"system-prompt-enforcement","rationale":"Confidence wording does not improve precision. Without categorical criteria the category stays noisy."},{"text":"Write explicit criteria for the category, such as a new branch in changed code that no test exercises, plus cases to skip.","correct":true,"trap":null,"rationale":"Explicit criteria for what to flag and what to skip are the main lever for keeping a new category precise."},{"text":"Have Claude rate each coverage finding from 1 to 10 in the same review pass, and post only the ones it scores at 8 or above.","correct":false,"trap":"self-review","rationale":"Uncalibrated self-rated scores from the same pass are a poor filter, and they do not define what a real coverage gap is."},{"text":"Track dismissal rates per category, and switch the new category off for a while if false positives climb, while its prompt is improved.","correct":true,"trap":null,"rationale":"High false-positive categories undermine trust in accurate ones, so temporarily disabling a noisy category protects trust while you fix it."},{"text":"Build a classifier that predicts which coverage findings developers will dismiss, trained on a month of shadow-mode findings, before launch.","correct":false,"trap":"over-engineering","rationale":"A trained filter is heavy infrastructure for a problem that explicit criteria and per-category monitoring handle directly."}],"takeaway":"A noisy category erodes trust in every category, so launch with explicit criteria and be ready to switch off a noisy one while you fix it."},{"id":"s5q14","domain":4,"ts":"4.2","type":"single","prompt":"Review findings are produced with --json-schema, and every finding has location, issue, severity, and suggested_fix. Developers say the content still varies: some locations are line ranges and others are function names, and some suggested fixes are concrete code while others just say \"consider refactoring.\" The prompt already describes each field in a paragraph. What is the most effective next step?","options":[{"text":"Add two or three example findings to the prompt that show a precise line location, a clear issue, a severity, and a concrete suggested fix.","correct":true,"trap":null,"rationale":"When detailed instructions give inconsistent output, a few examples demonstrating the exact desired format are the most effective technique."},{"text":"Rewrite the field descriptions in capital letters, stating that every suggested fix MUST contain code and every location MUST be a line range.","correct":false,"trap":"system-prompt-enforcement","rationale":"Detailed prose is already producing inconsistent results. Louder wording is still prose and does not show what a good finding looks like."},{"text":"Have Claude reread its findings at the end of the same session and rewrite any location or suggested fix that it judges to be too vague.","correct":false,"trap":"self-review","rationale":"The session that wrote vague fixes judged them acceptable once already. Without a shown target, a second look in the same context changes little."},{"text":"Send every finding to a second claude -p call that rewrites the location and suggested fix into the team's preferred style before posting.","correct":false,"trap":"over-engineering","rationale":"A rewrite call cannot invent a concrete fix the reviewer never produced, and it doubles cost when examples would fix the source."}],"takeaway":"When detailed instructions still give inconsistent output, a few examples of the exact format you want are the most effective fix."},{"id":"s5q15","domain":4,"ts":"4.2","type":"single","prompt":"The security review flags every SQL string the code builds as possible injection, including queries that join constant table names and pass all user values as bound parameters. The team has added nine named exceptions to the prompt, but each week developers find another safe variant that still gets flagged. How should you improve precision?","options":[{"text":"Add a few examples that contrast safe and unsafe query building, each explaining why it is or is not injectable, so that Claude can generalize.","correct":true,"trap":null,"rationale":"Few-shot examples that separate acceptable patterns from genuine issues, with reasoning, let the model generalize to novel safe variants."},{"text":"Keep adding each newly reported safe variant to the exception list in the prompt, so the list eventually covers every pattern the codebase uses.","correct":false,"trap":"symptom-fix","rationale":"A fixed list only matches cases already seen, which is why a new variant appears every week. Claude needs to learn the distinction, not the list."},{"text":"Paste every SQL query in the repository into the prompt, each labeled safe or unsafe, so Claude has seen all of them before it reviews a diff.","correct":false,"trap":"few-shot-overload","rationale":"Hundreds of labeled queries bloat every request and teach matching, not judgment. A few contrasting examples with reasons work better."},{"text":"Connect a taint-analysis MCP server, a schema server, and a query-log server to the reviewer so it can trace every value to its source first.","correct":false,"trap":"tool-bloat","rationale":"Three new servers add decision complexity and cost for a reviewer whose real gap is not knowing what makes a query safe."}],"takeaway":"Few-shot examples that show why a pattern is acceptable or a genuine issue let Claude generalize beyond a fixed list of cases."},{"id":"s5q16","domain":4,"ts":"4.5","type":"single","prompt":"A nightly Message Batches job generates tests for about 2,000 changed functions. The team just rewrote the prompt for a new test framework. The last time a rewritten prompt went straight into the full batch, a systematic import mistake forced them to resubmit 35% of the requests. What should they do before the next full nightly run?","options":[{"text":"Submit the full batch tonight and make the next morning's pre-merge check wait on its results, so no pull request merges before the tests are verified.","correct":false,"trap":"batch-for-blocking","rationale":"Batches have up to a 24-hour window with no latency SLA, so gating merges on them blocks developers. It also does nothing about prompt quality."},{"text":"Submit the full batch as usual and, when results return, resubmit only the requests with import errors, found by custom_id, using the same prompt.","correct":false,"trap":"symptom-fix","rationale":"Resubmitting with the same prompt repeats a systematic mistake, and it pays for the failed first pass again."},{"text":"Run the new prompt on a small, representative sample of functions, review the output, and refine it until first-pass results are good, then batch them all.","correct":true,"trap":null,"rationale":"Refining the prompt on a sample set before batch-processing large volumes maximizes first-pass success and avoids costly resubmissions."},{"text":"Add thirty complete test files written in the new framework to the prompt, so every request in the batch sees every import pattern the team uses.","correct":false,"trap":"few-shot-overload","rationale":"This inflates all 2,000 requests and still goes into the full batch untested, so any remaining mistake repeats at full scale."}],"takeaway":"Refine a prompt on a sample set before batch-processing large volumes, so the first pass succeeds and you avoid costly resubmissions."},{"id":"s5q17","domain":4,"ts":"4.6","type":"single","prompt":"Large pull requests get about 40 review findings each, and two senior engineers can verify only a few per PR. No finding may be dropped: each one is either posted directly or checked by an engineer first. The team has six months of past findings labeled accepted or dismissed by developers. What design decides which findings the engineers check?","options":[{"text":"In the same review turn, ask Claude to mark findings it feels unsure about, and send only those marked unsure to the engineers before posting the rest.","correct":false,"trap":"self-review","rationale":"This routes rather than hides, but the unsure flag comes from the same pass that made the findings and is never checked against outcomes, so nothing shows it tracks which findings get dismissed."},{"text":"Add a verification pass that gives each finding a confidence score, set the cutoff from the labeled history, and route low scorers to the engineers.","correct":true,"trap":null,"rationale":"Raw self-reported confidence is poorly calibrated, but a cutoff checked against six months of labeled outcomes makes it a usable signal. It only decides which findings a human checks first; none are hidden."},{"text":"Tell the reviewer to post only findings that are very likely correct, and to leave out anything a senior engineer would need to double-check by hand.","correct":false,"trap":"system-prompt-enforcement","rationale":"This drops uncertain findings instead of routing them, which breaks the no-drop requirement, and a vague instruction gives Claude no calibrated way to judge likelihood."},{"text":"Train a separate model on the six months of labels to score every finding, and replace the review prompt's output with that model's ranked list.","correct":false,"trap":"over-engineering","rationale":"Building and maintaining a trained scorer is heavy infrastructure when the labels can calibrate thresholds on Claude's own confidence output."}],"takeaway":"Self-reported confidence becomes a usable signal only after calibration against labeled outcomes, and then it should route findings to human review, not hide them."},{"id":"s5q18","domain":4,"ts":"4.6","type":"multi","prompt":"An auto-fix job has one Claude Code session write a 16-file change, then review the whole change in a single pass in that same session before opening a PR. Human reviewers report two problems: subtle bugs the session introduced get approved, and review of the later files is shallow. Which changes fix these problems? Select TWO.","options":[{"text":"Run the review in a separate Claude instance that receives the diff and the task description but not the generating session's reasoning.","correct":true,"trap":null,"rationale":"An independent instance without the generator's reasoning context is more likely to question decisions the generator made."},{"text":"Enable extended thinking for the review turn in the generating session, so it reasons more deeply about each of the 16 files before approving.","correct":false,"trap":"self-review","rationale":"The session still carries its own reasoning from generation, so it remains unlikely to question its own decisions."},{"text":"Split the review into per-file passes for local issues, plus a separate integration pass that checks data flow between the changed files.","correct":true,"trap":null,"rationale":"Per-file passes avoid attention dilution across 16 files, and the integration pass covers cross-file issues."},{"text":"Add a checklist to the review prompt telling Claude to give all 16 files equal depth and to challenge its own earlier design choices.","correct":false,"trap":"system-prompt-enforcement","rationale":"An instruction does not remove the generator's reasoning from the session, and it does not change how attention spreads across 16 files reviewed in one pass."},{"text":"Give the reviewing session extra tools, such as git blame, a dependency graph server, and a linter, so it can check each file.","correct":false,"trap":"tool-bloat","rationale":"More tools add decision complexity without fixing either cause: the reviewer still shares the generator's context and still covers 16 files in one pass."}],"takeaway":"Review generated code with an independent instance, and split large reviews into per-file passes plus an integration pass."},{"id":"s5q19","domain":4,"ts":"4.6","type":"single","prompt":"After attention problems on large PRs, the team switched to one review pass per changed file. Local findings improved, but last week a PR renamed the currency field in orders/serializer.py and nothing flagged that billing/invoice.py still reads the old name. Each per-file pass saw only its own file. What should the team add?","options":[{"text":"Every changed file in the context of each per-file pass, so each pass can notice cross-file effects while it reviews its own file.","correct":false,"trap":"wrong-scope","rationale":"This puts cross-file context back into every local pass, which brings back the attention dilution the split was meant to remove."},{"text":"A line in each per-file prompt asking Claude to consider how changes in the file could affect other files in the same pull request.","correct":false,"trap":"system-prompt-enforcement","rationale":"A pass that sees only one file cannot check another file it never received, no matter what the instruction says."},{"text":"A second turn in each per-file session that asks Claude to recheck its own findings for anything it missed about other modules.","correct":false,"trap":"self-review","rationale":"Rechecking in the same session reuses the same single-file context and the same reasoning, so the cross-file bug stays invisible."},{"text":"A separate integration pass that gets the changed files' interfaces and per-file results and checks the data flow between files.","correct":true,"trap":null,"rationale":"Multi-pass review pairs per-file local passes with a dedicated integration pass for cross-file data flow, which is where this bug lives."}],"takeaway":"Per-file passes catch local issues; cross-file problems need their own integration pass over data flow between files."}]},{"id":"s6","title":"Structured Data Extraction","setup":"You are building a pipeline that extracts structured data from vendor invoices, receipts, and supplier contracts using the Claude API. Each document is sent with extraction tools whose input schemas define the output, and a validator checks every result before it is written to the finance system. The pipeline processes about 40,000 documents a month, mostly overnight, and a small team reviews flagged extractions by hand.","questions":[{"id":"s6q1","domain":4,"ts":"4.3","type":"single","prompt":"About 18% of invoices from small vendors have no purchase order number. The extract_invoice schema marks po_number as a required string. An audit shows that for these invoices the model returns values such as \"PO-0000\" or repeats the invoice number, which then fail matching in the finance system. What is the most effective fix?","options":[{"text":"Make po_number nullable in the schema and allow null when the invoice does not contain a purchase order number.","correct":true,"trap":null,"rationale":"A required field pressures the model to produce something. Making it nullable lets the model report absence honestly instead of fabricating a value."},{"text":"Add a system prompt instruction stating that purchase order numbers must never be invented and must be copied exactly as printed.","correct":false,"trap":"system-prompt-enforcement","rationale":"The schema still demands a string, so the instruction and the schema conflict. The model has no valid way to comply when the value is missing."},{"text":"Validate po_number against the ERP and, on a mismatch, retry with the validation error appended so the model can correct it.","correct":false,"trap":"symptom-fix","rationale":"Retry with feedback works for format errors, not missing information. No retry can find a PO number that is not on the invoice."},{"text":"Add eight few-shot examples of invoices without a purchase order that show the model writing NONE into the po_number field.","correct":false,"trap":"few-shot-overload","rationale":"This trains a sentinel string into a required field, which downstream systems must now special-case. The schema remains the actual problem."}],"takeaway":"Make schema fields nullable when source documents may lack the information, so the model is not pushed to fabricate values."},{"id":"s6q2","domain":4,"ts":"4.4","type":"single","prompt":"Extraction uses tool_use with a strict schema, and no JSON syntax errors have occurred in months. However, the validator finds that in 6% of invoices the extracted line_items amounts do not add up to the extracted total. In most of these cases a line item was split across a page break. How should you improve accuracy for these invoices?","options":[{"text":"Set tool_choice to force the extract_invoice tool on every invoice request so the model is held to the exact schema whenever it emits line items.","correct":false,"trap":"wrong-scope","rationale":"Schema compliance is already guaranteed. Forcing a specific tool controls which tool is called, not whether the numbers inside it are semantically right."},{"text":"Add an instruction to the same request asking the model to double-check that its line items add up to the total before it calls the extraction tool.","correct":false,"trap":"self-review","rationale":"Asking the model to check itself in the same pass gives it no new information. It is the same reasoning that split the line item in the first place."},{"text":"When validation fails, send a follow-up request with the original document, the failed extraction, and the specific sum mismatch, asking for a correction.","correct":true,"trap":null,"rationale":"Retry with specific error feedback works well for structural mistakes like a split line item, because the information is present and the error tells the model where to look."},{"text":"Retry each failed invoice up to three times with the original request unchanged, and keep the first extraction whose line items happen to sum to the total.","correct":false,"trap":"symptom-fix","rationale":"Blind retries give the model no hint about what went wrong, and accepting whichever run sums correctly can accept a different error that happens to balance."}],"takeaway":"Tool use removes syntax errors but not semantic ones, which are best fixed with retries that include the document, the failed output, and the specific validation error."},{"id":"s6q3","domain":4,"ts":"4.3","type":"single","prompt":"Documents arrive unlabeled and may be invoices, receipts, or contracts. Each request includes three tools, extract_invoice, extract_receipt, and extract_contract, with tool_choice set to \"auto\". In about 4% of requests the model responds with a prose summary of the document instead of calling a tool, and the pipeline drops those documents. What is the best fix?","options":[{"text":"Force tool_choice to extract_invoice, since invoices are the most common document type, and send any result that does not fit to a second classification pass.","correct":false,"trap":"wrong-scope","rationale":"Forcing one named tool removes the model's ability to pick the right schema for receipts and contracts, which creates a new class of errors."},{"text":"Set tool_choice to \"any\" so the model must call one of the three extraction tools while it still chooses which schema fits the document.","correct":true,"trap":null,"rationale":"\"any\" guarantees a tool call and therefore structured output, while leaving the choice of schema to the model when the document type is unknown."},{"text":"Add a sentence to the system prompt saying the model must call exactly one extraction tool for every document and must never answer in plain text.","correct":false,"trap":"system-prompt-enforcement","rationale":"This lowers the rate of prose replies but cannot remove it. tool_choice enforces the behavior at the API level instead."},{"text":"Scan each reply for phrases such as \"this document appears to be\" and, when one is found, resend the request with a reminder to use an extraction tool.","correct":false,"trap":"text-signal-loops","rationale":"Parsing natural-language text to drive control flow is fragile, and new phrasings slip through. The API exposes a setting that prevents the text reply."}],"takeaway":"Use tool_choice \"any\" to guarantee a tool call when several extraction schemas exist and the document type is unknown."},{"id":"s6q4","domain":5,"ts":"5.5","type":"multi","prompt":"After three months, the pipeline shows 97% field-level accuracy against human review. Finance wants to stop human review for every extraction the model marks as high confidence. Before you agree, which steps should you take? Select TWO.","options":[{"text":"Approve the change for all document types, since 97% clears the 95% target, and add a monthly reconciliation check to catch any rise in errors afterward.","correct":false,"trap":"wrong-scope","rationale":"An aggregate figure can hide a document type or field that performs far worse. A reconciliation check catches errors only after they have reached the books."},{"text":"Have the model output a confidence score for each field, and skip review for any document where every field scores 0.9 or above, the threshold finance proposed.","correct":false,"trap":"self-review","rationale":"Field-level scores are useful only once calibrated. A threshold picked by finance, never checked against a labeled validation set, treats raw self-reported confidence as accuracy."},{"text":"Break accuracy down by document type and by field to confirm that no segment, such as handwritten receipts or contract dates, is far below the aggregate.","correct":true,"trap":null,"rationale":"Aggregate accuracy can mask weak segments. Validating by document type and field is required before reducing review for any of them."},{"text":"Train a separate model on three months of review outcomes to predict which extractions contain errors, and use its scores in place of human review.","correct":false,"trap":"over-engineering","rationale":"This adds a new model to maintain and still lacks the segment analysis and ongoing sampling that show whether automation is safe."},{"text":"Keep reviewing a stratified random sample of high-confidence extractions so error rates stay measured and new error patterns are caught as they appear.","correct":true,"trap":null,"rationale":"Stratified sampling of high-confidence output keeps measuring real error rates and surfaces novel failure patterns after review is reduced."}],"takeaway":"Before automating high-confidence extractions, validate accuracy per document type and field and keep stratified sampling in place."},{"id":"s6q5","domain":4,"ts":"4.5","type":"single","prompt":"The monthly backlog of 40,000 documents is submitted through the Message Batches API. When results return, 1,150 requests have errored because their documents, mostly long supplier contracts, exceeded the context limit. The other results are valid. How should you handle this?","options":[{"text":"Resubmit the entire batch with max_tokens raised to the model's maximum so the long contracts can complete, and replace the earlier results with the new set.","correct":false,"trap":"symptom-fix","rationale":"max_tokens caps output length and does not change the input context limit. Resubmitting 38,850 valid requests also wastes the cost the batch saved."},{"text":"Move contract extraction to synchronous API calls for good, since the Batches API cannot accept documents of that size in any configuration you could submit.","correct":false,"trap":"over-engineering","rationale":"Synchronous calls face the same context limit and give up the batch discount for latency-tolerant work. The failure is about document size, not the API."},{"text":"Add a system prompt instruction telling the model to skip the less relevant parts of long contracts, then resubmit only the failed requests.","correct":false,"trap":"system-prompt-enforcement","rationale":"The request fails before the model reads anything because the input is too large. No instruction can make the model skip input it never receives."},{"text":"Use each failed request's custom_id to find its document, split those documents into chunks, and resubmit only them in a new batch.","correct":true,"trap":null,"rationale":"custom_id identifies exactly which documents failed, and chunking addresses why. Resubmitting only those keeps the valid results and the savings."}],"takeaway":"Handle batch failures by resubmitting only the failed custom_ids with a change that addresses the failure, such as chunking oversized documents."},{"id":"s6q6","domain":5,"ts":"5.6","type":"single","prompt":"On some supplier contracts, the cover summary states one total contract value while the pricing schedule in an appendix adds up to a different amount. The schema has a single contract_value field. Reviewers see the model return the summary figure on some contracts and the schedule figure on others. What is the best change to the extraction design?","options":[{"text":"Extract both figures along with their source locations, add a conflict_detected boolean, and route contracts whose two figures disagree to human review.","correct":true,"trap":null,"rationale":"Recording both values with provenance and flagging the conflict lets a person decide, rather than having the model silently pick one."},{"text":"Add a rule to the prompt that the pricing schedule is authoritative, so the model reports only the appendix total and ignores the cover summary figure.","correct":false,"trap":"symptom-fix","rationale":"This makes the output consistent but hides a real discrepancy. Sometimes the schedule is the figure that is wrong, and finance never learns there was a conflict."},{"text":"Run the extraction three times at different temperatures and store whichever contract value appears in at least two of the three runs as the final figure.","correct":false,"trap":"over-engineering","rationale":"Majority voting triples cost and still picks one value arbitrarily. Both numbers are genuinely in the document, so voting cannot resolve the conflict."},{"text":"Ask the model in a second turn of the same conversation to reconsider its contract_value and confirm which figure it believes is correct before saving it.","correct":false,"trap":"self-review","rationale":"Reconsidering in the same conversation tends to confirm the first answer, and either way the model is choosing a value it has no basis to choose."}],"takeaway":"When a source contains conflicting values, capture both with their locations and flag the conflict instead of letting the model pick one."},{"id":"s6q7","domain":4,"ts":"4.5","type":"single","prompt":"Contracts arrive throughout the day, and the business needs each one's extracted data within 30 hours of arrival. Extraction runs on the Message Batches API, which can take up to 24 hours to process a batch. Today the team submits one batch at midnight. How often must they submit batches to guarantee the 30-hour deadline?","options":[{"text":"At least every 6 hours, so no contract waits more than 6 hours to be submitted and the 24-hour processing window still fits inside 30 hours.","correct":true,"trap":null,"rationale":"Worst case is wait time plus processing time. Six hours of waiting plus 24 hours of processing is exactly 30, so 6 hours is the longest safe interval."},{"text":"Once a day at midnight is fine, since batches usually finish in a few hours and most contracts would comfortably make the 30-hour deadline.","correct":false,"trap":"batch-for-blocking","rationale":"\"Usually\" is not a guarantee. A contract arriving just after midnight can wait 24 hours and then take up to 24 more to process."},{"text":"Switch the whole pipeline to synchronous API calls as each contract arrives, because batches cannot be trusted to meet any kind of deadline.","correct":false,"trap":"over-engineering","rationale":"Batches can meet a deadline that leaves room for the 24-hour window. Dropping them gives up the 50% savings for no reason."},{"text":"Every 12 hours, since that halves the current wait and the processing time is usually far shorter than the 24-hour maximum.","correct":false,"trap":"symptom-fix","rationale":"Twelve hours of waiting plus 24 hours of processing is 36 hours in the worst case, which misses the 30-hour deadline."}],"takeaway":"With batches, the longest wait before submission plus the 24-hour processing window must fit inside the deadline."},{"id":"s6q8","domain":1,"ts":"1.4","type":"single","prompt":"An extraction agent has three tools: extract_invoice, validate_extraction, and post_to_ledger. The system prompt says to always call validate_extraction and get a pass before posting. Audits find that about 2% of ledger entries were posted with no passing validation, usually on invoices the model judged \"simple.\" What is the most reliable fix?","options":[{"text":"Add a programmatic gate that blocks post_to_ledger for a document until validate_extraction has returned a pass for that same document ID.","correct":true,"trap":null,"rationale":"A programmatic prerequisite blocks the downstream call deterministically, which prompt instructions with a non-zero failure rate cannot do."},{"text":"Move the validation rule to the top of the system prompt and state in bold that skipping validation is never allowed, even for simple invoices.","correct":false,"trap":"system-prompt-enforcement","rationale":"The rule is already in the prompt and fails 2% of the time. Stronger wording is still probabilistic when the ordering must always hold."},{"text":"Have the model write VALIDATION PASSED in its reply before calling post_to_ledger, and let the loop allow posting only after that phrase appears.","correct":false,"trap":"text-signal-loops","rationale":"The model can write the phrase without a passing result, so this still depends on its compliance. The gate must check the actual validate_extraction result, not reply text."},{"text":"Run a nightly job that finds ledger entries without a matching validation record and reverses them so they can be processed again the next day.","correct":false,"trap":"symptom-fix","rationale":"This cleans up bad entries after they reach the finance system instead of preventing the unvalidated post in the first place."}],"takeaway":"When one step must always come before another, enforce it with a programmatic prerequisite, because prompt instructions have a non-zero failure rate."},{"id":"s6q9","domain":2,"ts":"2.3","type":"single","prompt":"Each document request includes extract_metadata, which reads the vendor name, document type, and currency, plus enrichment tools lookup_vendor and convert_currency. With tool_choice set to \"auto\", the model sometimes calls lookup_vendor first with a guessed vendor name, before any metadata exists. How should you configure the requests so metadata is always extracted first?","options":[{"text":"Set tool_choice to \"any\" on the first request, so the model must call one of the tools instead of replying with text before metadata is ready.","correct":false,"trap":"symptom-fix","rationale":"This patches a failure the pipeline does not have, text replies. \"any\" guarantees a tool call but lets the model choose which one, so it can still call lookup_vendor first."},{"text":"Force tool_choice to extract_metadata on every turn of the conversation, so no other tool can be called before or after the metadata step.","correct":false,"trap":"wrong-scope","rationale":"Forcing the tool on every turn means the enrichment tools can never run. The forced choice belongs on the first request only."},{"text":"Force tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} on the first request, then handle enrichment in follow-up turns.","correct":true,"trap":null,"rationale":"Forced tool selection guarantees that a specific tool runs first. Later turns can then call the enrichment tools with the metadata in hand."},{"text":"Add a system prompt rule that extract_metadata must always be the first tool called and that vendor names must never be guessed from text.","correct":false,"trap":"system-prompt-enforcement","rationale":"A prompt rule makes the right order more likely but not certain. tool_choice can guarantee which tool is called first."}],"takeaway":"Use forced tool selection to make a specific tool run first, then let later turns handle the remaining steps."},{"id":"s6q10","domain":4,"ts":"4.2","type":"single","prompt":"Supplier contracts put payment terms in different places: a dedicated Payment Terms section, a clause buried in General Provisions, or a row in a pricing table. Reviewers find payment_terms returned as null on 22% of contracts that do state terms, almost all with the clause and table layouts. The prompt already says to search the whole contract. What is the most effective fix?","options":[{"text":"Add forty complete contracts from every supplier to the prompt as examples, so the model has seen each supplier's layout before it extracts.","correct":false,"trap":"few-shot-overload","rationale":"Forty full contracts bloat every request. Two to four targeted examples covering the three layouts address the gap at a fraction of the cost."},{"text":"Repeat the instruction to search the whole contract at the end of the prompt, adding that clauses and tables must be read as carefully as sections.","correct":false,"trap":"system-prompt-enforcement","rationale":"The instruction already exists and is being missed on these layouts. Repeating prose does not show the model what the terms look like there."},{"text":"Split each contract into sections and run a separate extraction agent on every section, then merge whatever payment terms each agent reports.","correct":false,"trap":"over-engineering","rationale":"This multiplies calls and adds merge logic, and a table row or clause can still be missed by the agent that sees it."},{"text":"Add a few examples showing correct payment_terms extraction from each layout: a dedicated section, an embedded clause, and a pricing table row.","correct":true,"trap":null,"rationale":"Few-shot examples of correct extraction from varied document structures directly address empty extraction of fields that are present."}],"takeaway":"When fields come back empty on some document layouts, add a few examples that show correct extraction from each layout."},{"id":"s6q11","domain":4,"ts":"4.2","type":"single","prompt":"Receipts from farm suppliers list amounts informally, such as \"a dozen\", \"2 flats\", or \"half crate\". The schema has a nullable numeric quantity and a unit field, and a paragraph of instructions explains how to normalize them. Outputs are still inconsistent, and for lines like \"eggs, assorted\" that state no amount the model invents a quantity of 1. What should you add?","options":[{"text":"A unit conversion tool, a product catalog search tool, and a web search tool, so the extractor can look up typical quantities for each item.","correct":false,"trap":"tool-bloat","rationale":"Extra tools add decision complexity and invite more guessing. Looking up a typical quantity is still not what the receipt says."},{"text":"A few examples showing informal amounts such as \"2 flats\" turned into a quantity and unit, and a line with no stated amount extracted as null.","correct":true,"trap":null,"rationale":"Few-shot examples reduce hallucination in extraction by showing how to handle informal measurements and when to leave a value empty."},{"text":"A second paragraph restating the normalization rules in stronger terms, with a warning that the model must never guess a quantity.","correct":false,"trap":"system-prompt-enforcement","rationale":"Detailed prose is already producing inconsistent results. More prose with a warning does not demonstrate the expected handling."},{"text":"A separate normalization agent with its own prompt that post-processes every receipt line after extraction and rewrites the quantity.","correct":false,"trap":"over-engineering","rationale":"A second agent adds cost and latency and cannot recover the true amount once the extractor has invented one."}],"takeaway":"Few-shot examples reduce extraction hallucination by showing how to handle informal or missing values that prose rules leave unclear."},{"id":"s6q12","domain":4,"ts":"4.3","type":"single","prompt":"The extract_invoice tool schema defines invoice_date as a string, and tool use keeps every result schema-valid. Yet the finance system rejects 9% of records because dates arrive as \"4 March 2025\", \"Mar 4, 2025\", or \"2025-03-04\", copied as each vendor prints them. What is the best fix?","options":[{"text":"Add a regex step after extraction that rewrites the three date formats seen so far into YYYY-MM-DD before records reach finance.","correct":false,"trap":"symptom-fix","rationale":"The regex covers only formats already seen and breaks on the next vendor's style. The extraction itself should produce one format."},{"text":"Add twenty example invoices, one from each major vendor, so the model sees every date style it might meet in production.","correct":false,"trap":"few-shot-overload","rationale":"Many examples inflate each request without stating the target format. A plain normalization rule is the missing piece."},{"text":"Add format normalization rules to the prompt, such as writing every date as YYYY-MM-DD, alongside the existing strict schema.","correct":true,"trap":null,"rationale":"Strict schemas guarantee structure, not formatting. Normalization rules in the prompt handle inconsistent source formats."},{"text":"Pass every record to a second Claude call whose only job is to normalize the date and amount fields before validation.","correct":false,"trap":"over-engineering","rationale":"A second call doubles cost for a problem the first call can solve with one added rule."}],"takeaway":"Strict schemas guarantee structure, not format; add normalization rules to the prompt to handle inconsistent source formatting."},{"id":"s6q13","domain":4,"ts":"4.3","type":"multi","prompt":"The extract_contract schema defines payment_method as an enum of ach, wire, check, and card. Some contracts specify letters of credit or net settlement, and others say only \"payment by a method agreed between the parties.\" Reviewers find these contracts forced into wire or check. Which schema changes should you make? Select TWO.","options":[{"text":"Add a dozen examples to the prompt showing how to map letters of credit and other unusual methods onto the four existing values.","correct":false,"trap":"few-shot-overload","rationale":"This teaches the model to force a fit more consistently. The data is still wrong because the categories cannot represent these methods."},{"text":"Add an \"other\" value to payment_method, paired with a payment_method_detail string that records whatever method the contract names.","correct":true,"trap":null,"rationale":"The \"other\" plus detail pattern keeps the enum usable downstream while capturing methods outside the fixed list."},{"text":"Add a separate extraction tool for each payment method, such as extract_ach_contract and extract_wire_contract, and let the model pick one.","correct":false,"trap":"tool-bloat","rationale":"Multiplying tools increases decision complexity and still has no tool for a method outside the list."},{"text":"Add an \"unclear\" value to payment_method for contracts whose wording does not settle which payment method the parties will use.","correct":true,"trap":null,"rationale":"An \"unclear\" enum value lets the model report ambiguity honestly instead of guessing wire or check."},{"text":"Train a classifier that reads each contract after extraction and corrects payment_method whenever it disagrees with the model.","correct":false,"trap":"over-engineering","rationale":"A trained corrector is extra infrastructure, and it would face the same four-value enum that cannot hold these cases."}],"takeaway":"Give enums an \"other\" value plus a detail field for new categories and an \"unclear\" value for ambiguous cases, so the model never has to force a fit."},{"id":"s6q14","domain":4,"ts":"4.4","type":"single","prompt":"The validator requires vendor_tax_id, and failed extractions are retried with the specific validation error appended. Format errors usually clear on the first retry. But one group of invoices fails all three retries, and each of them says \"Tax ID as registered in master agreement\" instead of printing the number. What should you do with this group?","options":[{"text":"Raise the retry limit to six and make the appended error message more specific about where on the invoice the tax ID usually appears.","correct":false,"trap":"symptom-fix","rationale":"The number is not on these invoices. More retries and better hints cannot extract information the document does not contain."},{"text":"Add a turn in the same conversation asking the model to reread the invoice carefully and confirm that the tax ID is really missing from it.","correct":false,"trap":"self-review","rationale":"Confirming the absence does not produce the value, and the pipeline would still have no tax ID to write."},{"text":"Stop retrying them, since the ID is not in the document, and route them to review or include the master agreement in the request.","correct":true,"trap":null,"rationale":"Retries fail when the information exists only in an external document. Supplying that document or routing to review is what resolves it."},{"text":"Give a second agent web search so it can look up each vendor's tax ID online and insert the first match into the failed extraction.","correct":false,"trap":"over-engineering","rationale":"This adds a new agent and an unreliable source for a value that the master agreement already holds."}],"takeaway":"Retries with error feedback fix format and structure errors, but they cannot recover information that is absent from the source document."},{"id":"s6q15","domain":4,"ts":"4.4","type":"single","prompt":"When line items do not sum to the invoice total, the pipeline retries with the mismatch in the feedback. Reviewers found that on invoices where the vendor itself made an arithmetic error, retries \"succeed\" because the model changes line item amounts until they match the printed total. How should you redesign this validation?","options":[{"text":"Add a rule to the retry promp
