<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CCAR-F exam prep with a Learner path and an exam-style Practitioner path.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%233c2e2a%22%2F%3E%3Cpath%20d%3D%22M18%2047%2032%2016l14%2031%22%20fill%3D%22none%22%20stroke%3D%22%23fdfdfb%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M23%2039q9-9%2018%200%22%20fill%3D%22none%22%20stroke%3D%22%23fdfdfb%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2215%22%20r%3D%225.5%22%20fill%3D%22%23e6e3ee%22%20stroke%3D%22%233c2e2a%22%20stroke-width%3D%222.5%22%2F%3E%3C%2Fsvg%3E">

<body>
<title>Architect Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered card column on warm paper. Ode palette from the AI Day Master Deck. Light only, by choice. */
:root {
  color-scheme: light;
  --bg: #f3f1ec;
  --surface: #fdfdfb;
  --ink: #3c2e2a;
  --body-ink: #5c504c;
  --muted: #857c78;
  --line: #e2ddd8;
  --accent: #3c2e2a;
  --accent-soft: #e6e3ee;
  --sun: #cee5ee;
  --sun-soft: #f1f0ec;
  --good: #4e7a5d;
  --good-soft: #e3e9e4;
  --bad: #a9564b;
  --bad-soft: #f4e6e2;
  --tile: #f3f1ec;
  --shadow: 0 12px 40px rgba(60,46,42,.08);
  --d1: #3c2e2a; --d2: #6f9a80; --d3: #9aa863; --d4: #6ea6bd; --d5: #9586bd;
  --t1: #e3e9e4; --t2: #e8ebd7; --t3: #cee5ee; --t4: #e6e3ee; --t5: #e9e4df;
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .84em; background: var(--t1); color: var(--ink); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.025em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--d5); outline-offset: 2px; }

.top { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 500; letter-spacing: -.01em; font-size: 1.05rem; background: none; border: 0; cursor: pointer; padding: 0; }
.brand-mark { width: 28px; height: 28px; display: block; }
.brand-mark svg, .hero-mark svg { width: 100%; height: 100%; display: block; }
.top-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; min-width: 0; }
.top-right .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }

main { max-width: 720px; margin: 0 auto; }
.screen { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(20px, 5vw, 36px); }
.eyebrow { font-size: .75rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 22px; font-weight: 500; background: var(--accent); transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
.btn { color: var(--surface); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(60,46,42,.18); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { box-shadow: none; border-color: var(--muted); }
.btn.small { padding: 7px 14px; font-size: .85rem; }
.link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; }

/* Welcome */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero { min-height: calc(100svh - 120px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; position: relative; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 10% -10%; z-index: -1; background: radial-gradient(40% 45% at 35% 45%, var(--t4), transparent 70%), radial-gradient(35% 40% at 68% 55%, var(--t1), transparent 70%); filter: blur(30px); opacity: .9; }
.hero-mark { width: 72px; height: 72px; display: block; border-radius: 18px; box-shadow: 0 14px 36px rgba(60,46,42,.18); }
.hero .hero-title { font-size: clamp(2.8rem, 11vw, 5rem); }
.hero-form { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
.hero-input { display: flex; flex-direction: row; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); transition: border-color .15s; }
.hero-input:focus-within { border-color: var(--ink); }
.hero-input input { text-align: left; flex: 1; min-width: 0; width: auto; font-size: 1rem; outline: none; border: 0; background: transparent; border-radius: 999px; padding: 10px 14px; }
.hero-input .btn { flex: none; }
.hero-title { font-size: clamp(2.3rem, 7.5vw, 3.6rem); font-weight: 400; letter-spacing: -.035em; line-height: 1.05; }
.hero-title .hl { background: var(--t4); border-radius: .18em; padding: 0 .14em; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 500; font-size: .9rem; }
.field input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; transition: border-color .15s; }
.field input:focus { outline: none; border-color: var(--ink); }
.hint { font-size: .85rem; color: var(--muted); }
.err { color: var(--bad); font-size: .85rem; min-height: 1.2em; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fact { background: var(--t1); border-radius: 16px; padding: 10px 12px; }
.fact b { display: block; font-family: var(--display); font-weight: 400; letter-spacing: -.02em; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .75rem; color: var(--muted); }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, 1fr); } }

/* Path choice */
.path-screen { min-height: calc(100svh - 140px); display: flex; flex-direction: column; justify-content: center; gap: 28px; padding-block: 12px; }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 600px) { .paths { grid-template-columns: 1fr; } }
.path { text-align: left; cursor: pointer; border: 1.5px solid transparent; background: var(--surface); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; transition: transform .2s, border-color .2s, box-shadow .2s; box-shadow: var(--shadow); }
.path:hover { transform: translateY(-3px); border-color: var(--ink); }
.path-head { display: flex; align-items: center; gap: 10px; }
.path h2 { font-size: 1.2rem; }
.path p { color: var(--body-ink); font-size: .88rem; margin: 0; line-height: 1.35; }
.path ul { margin: 0; padding-left: 16px; color: var(--body-ink); font-size: .8rem; display: flex; flex-direction: column; gap: 1px; line-height: 1.35; }
.path-icon { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; }
.path-icon svg { width: 20px; height: 20px; }
.path.learn { background: var(--t1); }
.path.learn .path-icon { background: var(--surface); color: var(--ink); }
.path.prac { background: var(--t4); }
.path.prac .path-icon { background: var(--surface); color: var(--ink); }
.path .go { margin-top: 2px; font-weight: 500; font-size: .9rem; color: var(--ink); }
.path .last { font-size: .8rem; color: var(--muted); }
.fresh { justify-content: center; gap: 20px; margin-top: -10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
/* Learner levels */
.level { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.level.locked { opacity: .6; }
.level-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.level-head h2 { font-size: 1.25rem; }
.lessons { display: flex; flex-direction: column; gap: 6px; }
.lesson { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: .92rem; }
.lesson .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lesson .ln { flex: 1; }
.lesson .lc { color: var(--muted); font-size: .8rem; }
.lesson.done .lc { color: var(--good); }
.lesson.next { border-color: var(--ink); }
.lesson[disabled] { cursor: not-allowed; }
.insight.unlock { background: var(--t4); }

/* Intro walkthrough */
.intro { min-height: 440px; display: flex; flex-direction: column; gap: 20px; }
.intro-stage { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.intro-stage h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 24px; background: var(--ink); }
.pop { animation: pop .5s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(10px); } to { opacity: 1; transform: none; } }
.big-num { font-family: var(--display); font-weight: 300; letter-spacing: -.04em; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bignums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.bignums > div { background: var(--tile); border-radius: 18px; padding: 16px; }
.bignums small { color: var(--muted); }
.dombar { display: flex; height: 44px; border-radius: 14px; overflow: hidden; gap: 3px; }
.dombar > div { height: 100%; transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; display: grid; place-items: center; color: var(--ink); font-weight: 500; font-size: .85rem; font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.domlist { display: flex; flex-direction: column; gap: 8px; }
.domlist div { display: flex; align-items: baseline; gap: 10px; font-size: .95rem; }
.domlist .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; transform: translateY(1px); }
.domlist em { font-style: normal; color: var(--muted); font-size: .85rem; }
.domlist b { font-variant-numeric: tabular-nums; min-width: 2.6em; font-weight: 500; }
.scen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .scen-grid { grid-template-columns: repeat(2, 1fr); } }
.scen { border: 1.5px dashed var(--line); border-radius: 18px; padding: 14px; font-size: .9rem; font-weight: 500; transition: all .4s; min-height: 76px; }
.scen small { display: block; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.scen.lit { border-style: solid; border-color: var(--t3); background: var(--t3); transform: translateY(-2px); }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { display: flex; gap: 14px; align-items: flex-start; background: var(--tile); border-radius: 16px; padding: 14px 16px; }
.rule .n { font-family: var(--display); font-weight: 400; font-size: 1.2rem; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; }
.rule b { display: block; }
.rule span { color: var(--muted); font-size: .92rem; }
.traps { display: flex; flex-wrap: wrap; gap: 8px; }
.trapchip { border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 500; background: var(--bad-soft); color: var(--ink); }

/* Quiz card */
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--ink); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--tile); color: var(--ink); }
.tag .sw { width: 8px; height: 8px; border-radius: 50%; }
.qprompt { font-size: clamp(1.1rem, 3.4vw, 1.3rem); font-weight: 400; letter-spacing: -.01em; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt[disabled] { cursor: default; }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 500; font-size: .85rem; background: var(--tile); color: var(--muted); transition: all .15s; }
.opt .txt { flex: 1; min-width: 0; padding-top: 3px; }
.opt.sel { border-color: var(--ink); background: var(--t4); }
.opt.sel .key { background: var(--ink); color: var(--surface); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt.dim .key { opacity: .5; }
.opt.dim .txt { color: var(--muted); }
[hidden] { display: none !important; }
.opt .rat { display: block; margin-top: 8px; font-size: .9rem; color: var(--muted); }
.opt .rat .trapchip { padding: 2px 8px; font-size: .72rem; margin-right: 6px; }
.opt .rat .okchip { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .72rem; font-weight: 500; background: var(--good); color: var(--surface); margin-right: 6px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.feedback { border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--t2); }
.feedback h3 { font-size: 1.2rem; font-weight: 500; }
.feedback .rulebox { border-left: 3px solid var(--ink); padding-left: 12px; font-weight: 600; }
.scenario-box { background: var(--tile); border-radius: 16px; padding: 14px 16px; font-size: .95rem; color: var(--muted); }
.scenario-box b { color: var(--ink); }
.conf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; font-weight: 500; }
.pill.on { border-color: var(--ink); background: var(--t4); }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .85rem; }
.timer.over { color: var(--bad); }
.kbd-hint { font-size: .78rem; color: var(--muted); }
@media (hover: none) { .kbd-hint { display: none; } }

/* Setup + results */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; }
.choice span { font-size: .85rem; color: var(--muted); }
.choice.on { border-color: var(--ink); background: var(--t4); }
.score { font-family: var(--display); font-weight: 300; letter-spacing: -.05em; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; font-size: .9rem; }
.bar-row .lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
.bar-row .lbl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.bar > div { height: 100%; border-radius: 99px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.insight { background: var(--t3); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.insight b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; }
.revisit { display: flex; flex-direction: column; gap: 10px; }
.revisit div { background: var(--tile); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.revisit b { display: block; }
.section-title { font-size: 1.15rem; font-weight: 500; }

/* Confetti */
.burst { position: fixed; pointer-events: none; z-index: 50; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: fly .8s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .burst { display: none; }
}
</style>

<header class="top">
  <button class="brand" id="brand" type="button" aria-label="Back to start"><span class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#3c2e2a"/><path d="M18 47 32 16l14 31" fill="none" stroke="#fdfdfb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 39q9-9 18 0" fill="none" stroke="#fdfdfb" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="15" r="5.5" fill="#e6e3ee" stroke="#3c2e2a" stroke-width="2.5"/></svg></span>Architect Prep</button>
  <div class="top-right" id="topRight"></div>
</header>
<main id="app" aria-live="polite"></main>

<script>
const DATA = {"learner":{"concepts":[{"id":"c01","domain":1,"ts":"1.1","title":"The agentic loop","explain":"An agent is like a cook who keeps asking the recipe what to do next. Each time Claude replies, the reply carries a stop_reason that says why it stopped. If the reason is tool_use, Claude wants you to run a tool and hand back the result. If the reason is end_turn, Claude has finished.","rule":"Loop on stop_reason: keep going for tool_use and stop for end_turn.","questions":[{"id":"c01a","prompt":"Your agent calls Claude in a loop. What should decide whether the loop runs again?","options":["Whether the reply text contains a phrase like \"I am done\"","Whether the loop has already run five times","Whether stop_reason is tool_use or end_turn","Whether the reply contains any text at all"],"answer":2,"why":"The stop_reason field is the official signal for whether Claude wants a tool run or has finished."},{"id":"c01b","prompt":"Claude replies with stop_reason tool_use and asks to look up an order. What should your code do next?","options":["Run the tool and send back the result","Stop the loop and show the reply to the user","Ask Claude again with the same messages and no changes","Guess the order details and carry on without the tool"],"answer":0,"why":"A tool_use stop means Claude is waiting for the tool result, so you run it and send the result back."}],"applied":[{"id":"c01c","prompt":"Your loop exits as soon as a reply contains text. Claude often writes \"Let me check that order\" alongside a tool call, so the loop quits before the tool runs. What should you change?","options":["Strip all text from replies before checking whether to stop","Tell Claude in the prompt never to write text next to tools","Stop only on stop_reason end_turn, whatever the text says","Cap the loop at ten turns so it always runs a few times"],"answer":2,"why":"A reply can hold text and a tool call together, so only stop_reason tells you whether Claude is finished."},{"id":"c01d","prompt":"Your loop runs the tool Claude asked for, but the next request does not include the tool's result. Claude keeps asking for the same tool. What went wrong?","options":["The tool result was never added to the conversation history","The loop needs a higher iteration cap to finish the job","The tool description is too vague for Claude to trust it","The loop should ignore stop_reason after the first tool call"],"answer":0,"why":"Claude can only use a tool result that is appended to the messages it receives next."}]},{"id":"c02","domain":1,"ts":"1.4","title":"Rules enforced by code","explain":"A sign saying \"please wash your hands\" is a request, but a door that only opens after a soap sensor trips is a guarantee. Prompts are requests that Claude usually follows. Hooks and prerequisite gates are code that runs every time, so use them when a rule must never be broken.","rule":"If a rule must always hold, enforce it in code with a hook or gate, not in the prompt.","questions":[{"id":"c02a","prompt":"A refund agent must always verify the customer's identity before issuing a refund. Which approach is the most reliable?","options":["Add a bold line to the system prompt reminding it to verify","Add several example conversations that show verification first","Block the refund tool in code until verification passes","Ask the agent to double check its own steps before refunding"],"answer":2,"why":"A code gate runs every time, while prompts and examples only make the right behavior likely."},{"id":"c02b","prompt":"A hook can look at a tool call before it runs. A refund over 500 dollars must never go out without a manager. What should the hook do?","options":["Log a warning and let the refund go through anyway","Block the call and send the case to a human manager","Rewrite the amount down to 500 and run the call","Wait for Claude to mention the limit in its own reply"],"answer":1,"why":"A hook can stop the call before it runs and hand the case to a person, which guarantees the policy."}],"applied":[{"id":"c02c","prompt":"An account agent must call get_balance before close_account. The prompt already says so in capital letters, yet a few closures still skip the check. What should you do?","options":["Repeat the instruction at both the start and end of the prompt","Block close_account in code until get_balance has returned","Add more example chats where the balance is checked first","Ask the agent to list its completed steps before it closes"],"answer":1,"why":"Prompt wording only makes the order likely, while a programmatic prerequisite blocks the call every time."},{"id":"c02d","prompt":"A team's only refund limit is the system prompt line \"Never refund more than $500.\" A manager asks whether this guarantees the limit. What is the accurate answer?","options":["Yes, a clear system prompt rule is always followed","Yes, as long as the rule is written in bold capitals","No, the limit must be restated in every user message","No, prompts can still fail now and then, so use a hook"],"answer":3,"why":"Prompt instructions have a non-zero failure rate, so a rule that must always hold belongs in code."}]},{"id":"c03","domain":1,"ts":"1.3","title":"Subagents need context","explain":"A subagent is like a contractor you hire for one job. The contractor starts with a blank slate and cannot read your earlier chats. A coordinator agent must put everything the helper needs into the task it hands over, and it should keep each helper focused on one job.","rule":"Subagents do not inherit your history, so pass what they need in the task itself.","questions":[{"id":"c03a","prompt":"A coordinator asks a research subagent to \"summarize the findings\". The subagent has no idea which findings. What is the root cause?","options":["The subagent model is too small to follow instructions","The coordinator never put the findings in the task","The subagent needs a much longer system prompt to work","The coordinator should do all the work without subagents"],"answer":1,"why":"Subagents start fresh, so the coordinator must include the findings in the task it sends."},{"id":"c03b","prompt":"A coordinator splits a report into search, analysis and writing helpers. What should each helper receive?","options":["The whole earlier conversation so it can work out the job","Nothing, because helpers can see the coordinator's memory","Only a short title and the helper can ask for the rest","A clear task that includes the inputs for that part"],"answer":3,"why":"Each helper works only from what the coordinator hands it, so the task must carry the needed inputs."}],"applied":[{"id":"c03c","prompt":"A coordinator collects web search results and document analysis, then asks a synthesis subagent to \"write the report using what we found\". The report is generic and cites nothing. What should change?","options":["Put the full findings and their sources in the subagent's prompt","Give the synthesis subagent its own search tools to look again","Tell the synthesis subagent to try harder to be specific","Raise the synthesis subagent's output token limit a lot"],"answer":0,"why":"The subagent cannot see what the coordinator found unless the findings are passed in its prompt."},{"id":"c03d","prompt":"A coordinator passes its findings to a subagent as one long paragraph. The subagent's output no longer says which source each claim came from. What would fix this?","options":["Ask the subagent to infer the most likely source of each claim","Shorten the paragraph so the subagent can read it more easily","Pass findings as structured data with source and page fields","Let the subagent look up the sources in the coordinator's history"],"answer":2,"why":"Structured data keeps content and source metadata apart, and the subagent cannot read the coordinator's history anyway."}]},{"id":"c04","domain":1,"ts":"1.7","title":"Resume or fork a session","explain":"Think of a saved game. Resuming loads your save and carries on from the same point. Forking copies the save so you can try a risky path without losing the original. Use resume to continue the same work and fork to explore a different approach side by side.","rule":"Resume to continue the same thread and fork to branch off and compare options.","questions":[{"id":"c04a","prompt":"You finished a long code review yesterday and want to keep working on it today with all its context. What fits best?","options":["Start a fresh session and paste a rough summary from memory","Fork the session so the review is split into two copies","Ask Claude to redo the whole review from the beginning","Resume the earlier session so its history is still there"],"answer":3,"why":"Resuming reloads the same session, so the earlier context is available without any rebuilding."},{"id":"c04b","prompt":"You analyzed a codebase and now want to try two different refactoring plans without them affecting each other. What fits best?","options":["Fork the session once for each plan to keep them apart","Run both plans in one session and hope they do not clash","Resume the same session twice and edit both at once","Delete the analysis and begin each plan from scratch"],"answer":0,"why":"Forking gives each plan its own branch that starts from the shared analysis."}],"applied":[{"id":"c04c","prompt":"You resume yesterday's named session about the payments module. Overnight a teammate rewrote two of the files it had analyzed. What should you do first?","options":["Carry on as normal since the session already knows the files","Fork the session so the old analysis stays safe from changes","Have the session re-explore the entire codebase from scratch","Tell the session which files changed so it re-reads them"],"answer":3,"why":"Naming the changed files lets the resumed session re-analyze just those instead of trusting stale results or starting over."},{"id":"c04d","prompt":"After a large refactor, most of the tool results in an old session no longer match the code. What is the most reliable way to continue the work?","options":["Resume the old session and trust its earlier results","Start a new session and give it a structured summary","Fork the old session so the stale results split in two","Resume the old session and ask it to forget old files"],"answer":1,"why":"When prior tool results are stale, a fresh session with an injected summary is more reliable than resuming."}]},{"id":"c05","domain":2,"ts":"2.1","title":"Tool descriptions drive choice","explain":"Claude picks a tool the way you pick a drawer, by reading the label. If two labels sound alike, it will grab the wrong one. When Claude keeps choosing the wrong tool, the label is the first thing to fix, with clear wording about what the tool does and when to use it.","rule":"When Claude picks the wrong tool, fix the tool descriptions first.","questions":[{"id":"c05a","prompt":"Claude keeps calling get_customer when it should call lookup_order. Both descriptions just say \"Looks up data\". What is the best first fix?","options":["Merge both tools into one giant tool with a mode flag","Add twenty example chats showing the right choice","Build a classifier that picks the tool before Claude runs","Write clear descriptions that say what each tool covers"],"answer":3,"why":"Vague descriptions are the root cause, and clearer labels are the smallest fix that solves it."},{"id":"c05b","prompt":"Two search tools overlap and Claude often mixes them up. Which description change helps the most?","options":["Make both descriptions shorter so they are easier to scan","State what each tool searches and when not to use it","Repeat the tool name three times in each description","Add a line telling Claude to choose carefully each time"],"answer":1,"why":"Saying what each tool covers and when to avoid it gives Claude the facts it needs to choose."}],"applied":[{"id":"c05c","prompt":"An agent has search_web and search_docs, and both descriptions say \"Searches for information\". Internal policy questions keep going to search_web. What is the best first fix?","options":["Add a classifier that picks the tool before Claude runs","Add a system prompt line saying \"always search thoroughly\"","Say what each tool searches, its inputs and when to use it","Remove search_web so every question goes to search_docs"],"answer":2,"why":"Tool descriptions are the main thing Claude uses to choose, so clear, distinct descriptions fix the root cause."},{"id":"c05d","prompt":"Tool descriptions are clear, but the system prompt says \"For any customer question, always check the order first.\" Claude now calls lookup_order even for account questions. What should you fix?","options":["The system prompt line that ties questions to one tool","The tool names, which should all be made a lot shorter","The model temperature, which is probably set too high","The examples, which should be raised to twenty or more"],"answer":0,"why":"Keyword-heavy system prompt instructions can override good tool descriptions and create unwanted tool associations."}]},{"id":"c06","domain":2,"ts":"2.2","title":"Tell the agent what failed","explain":"When a tool breaks, a vague \"something went wrong\" leaves the agent stuck. A good error says what kind of failure it was and whether trying again could help. Mark it with the isError flag so Claude knows it was a failure. Also, a search that finds nothing is a valid answer and is not an error.","rule":"Return structured errors with the failure type and retry advice, and keep empty results separate.","questions":[{"id":"c06a","prompt":"A tool times out and returns only the text \"Error\". The agent then retries a request that was invalid. What would help most?","options":["Return an isError result with a type and a retryable flag","Return an empty list so the agent gives up quietly","Raise the model's temperature so it tries new ideas","Hide the failure and let the agent work out the cause"],"answer":0,"why":"A flagged error that says its type and whether a retry can help lets the agent react correctly."},{"id":"c06b","prompt":"A customer search runs fine but no customer matches. How should the tool respond?","options":["Mark it isError because the agent did not get what it wanted","Throw an exception so the whole loop stops and restarts","Return a normal empty result to show nothing matched","Return a made up customer so the agent can keep going"],"answer":2,"why":"No matches is a valid outcome, so it should look different from a failure."}],"applied":[{"id":"c06c","prompt":"A refund tool rejects a request because it breaks policy, but returns the same \"Operation failed\" it uses for timeouts. The agent keeps retrying. What should the tool return?","options":["An isError result saying \"Operation failed, try again later\"","An isError result with a business category and isRetryable false","A normal empty result so the agent stops asking for a refund","No result at all, so the agent's loop times out on its own"],"answer":1,"why":"Marking a policy failure as a non-retryable business error tells the agent to stop retrying and explain it instead."},{"id":"c06d","prompt":"A tool receives a date from the agent in a format it cannot parse. Which error category and retry advice fit best?","options":["Transient error: retry the same call right away","Permission error: stop and request admin access","No error: return an empty result with no matches","Validation error: retry only with fixed input"],"answer":3,"why":"Bad input is a validation error, so the same call will keep failing until the input is corrected."}]},{"id":"c07","domain":2,"ts":"2.3","title":"Few tools and tool_choice","explain":"A worker with a small, well-labeled toolbox picks the right tool more often than one buried under dozens. Give each agent only the tools its job needs, usually around four or five. When you need a specific tool called, tool_choice can force it instead of hoping.","rule":"Give each agent a small set of relevant tools and use tool_choice to force a required call.","questions":[{"id":"c07a","prompt":"One agent has 18 tools and keeps picking poorly. What is the best fix?","options":["Add a longer prompt that explains each of the 18 tools","Give the agent only the few tools that fit its job","Rename all the tools so their names are all shorter","Switch to a larger model and keep every tool in place"],"answer":1,"why":"A smaller, focused tool set reduces confusion and is a proportionate fix."},{"id":"c07b","prompt":"Your app must always run extract_invoice on a document before anything else. What should you do?","options":["Write \"always call extract_invoice first\" in the prompt","Ask Claude to confirm the first step in its own words","Remove the other tools after the first answer arrives","Set tool_choice so that extract_invoice is forced"],"answer":3,"why":"Forcing the tool with tool_choice guarantees the call, while a prompt line only suggests it."}],"applied":[{"id":"c07c","prompt":"A billing subagent was also given the shipping team's tools, and it sometimes changes shipping addresses on its own. What is the best fix?","options":["Add a prompt line asking it to leave shipping work alone","Give it even more tools so it has a wider set to pick from","Switch to a larger model that is better at choosing tools","Limit the billing subagent to the tools its role needs"],"answer":3,"why":"Agents misuse tools outside their specialty, so scoping tools to the role prevents it."},{"id":"c07d","prompt":"An extraction app sometimes gets a chatty text reply instead of a tool call. It has three extraction tools, one per document type, and the type is not known in advance. Which setting fixes this?","options":["tool_choice \"auto\", so Claude decides for itself each time","tool_choice \"any\", so Claude must call one of the tools","Forced tool_choice naming the first of the three tools","No tools at all, with a request for JSON in the prompt"],"answer":1,"why":"With \"any\" Claude must call a tool but can still pick the one that fits, while \"auto\" allows plain text."}]},{"id":"c08","domain":3,"ts":"3.1","title":"CLAUDE.md levels","explain":"CLAUDE.md files are notes Claude reads at the start of a session. There are layers, much like house rules, street rules and city rules. A user-level file applies only to you, a project file in the repo is shared with the whole team, and a folder file applies only inside that folder. If Claude follows a rule for one person but not another, run /memory to see which files each session actually loaded.","rule":"Put team rules in the project CLAUDE.md in the repo, since user-level files are not shared.","questions":[{"id":"c08a","prompt":"Your team wants every developer's Claude to follow the same coding standards. Where should the rules live?","options":["In each developer's own user-level CLAUDE.md","In a note pinned in the team chat channel","In the project CLAUDE.md that is committed to the repo","In a long reminder typed at the start of each session"],"answer":2,"why":"A project file in version control reaches everyone who clones the repo."},{"id":"c08b","prompt":"A new teammate says Claude ignores the team's naming rules. The rules sit only in your own ~/.claude/CLAUDE.md. What is the cause?","options":["That file is personal, so teammates never see it","The teammate must be using an older version of the model","Claude forgets rules that are older than a week or so","The rules were written with too many words to be read"],"answer":0,"why":"User-level files stay on your machine, so teammates never see those rules."}],"applied":[{"id":"c08c","prompt":"Claude follows the team's rules for one developer but not for another on the same repo. What should each developer run first to diagnose this?","options":["Run /memory to see the loaded memory files","Run /compact to shrink each developer's context","Run --resume to reload each developer's last session","Run -p to print every configuration file in the repo"],"answer":0,"why":"The /memory command shows which memory files are loaded, which is how you diagnose inconsistent behavior."},{"id":"c08d","prompt":"A monorepo's root CLAUDE.md pastes in both the API and the frontend standards in full, so every package gets both. What is a cleaner setup?","options":["Move both standards into each developer's user-level CLAUDE.md","Paste both standards again at the end of the root CLAUDE.md","Have each package's CLAUDE.md @import only its own standards","Delete both standards and explain them in chat when needed"],"answer":2,"why":"@import lets each package include only the standards files relevant to it, keeping CLAUDE.md modular."}]},{"id":"c09","domain":3,"ts":"3.3","title":"Rules for certain files","explain":"Some rules only matter for certain files, like test rules for test files. A rules file in the .claude/rules folder can carry a path pattern, called a glob, such as **/*.test.ts. Claude loads that rule only when it touches matching files, which keeps everything else uncluttered.","rule":"Use .claude/rules files with path globs for rules that apply to specific file types.","questions":[{"id":"c09a","prompt":"You want testing conventions to apply only to files ending in .test.ts, wherever they sit. What is the best setup?","options":["Put the conventions at the top of the root CLAUDE.md","Create a rule file with a glob that matches .test.ts","Tell Claude in chat to remember the conventions for tests","Copy a CLAUDE.md into every folder that holds a test"],"answer":1,"why":"A glob-scoped rule loads only for matching files and works in any folder."},{"id":"c09b","prompt":"Your root CLAUDE.md is long and full of rules that apply to only one area. What is the best cleanup?","options":["Delete all the rules and rely on Claude's own judgment","Make the root file longer so nothing can be missed","Move each area's rules into a glob-scoped rule file","Split the rules into several chat messages each session"],"answer":2,"why":"Scoped rule files load only when relevant, so the root file stays short."}],"applied":[{"id":"c09c","prompt":"Terraform conventions sit in the root CLAUDE.md, so they load even while Claude edits React files. What keeps them out of unrelated work?","options":["A line saying to skip this part unless editing Terraform","A .claude/rules/ file with paths: [\"terraform/**/*\"]","Moving them into each developer's ~/.claude/CLAUDE.md","Splitting them into more sections in the root CLAUDE.md"],"answer":1,"why":"A path-scoped rule loads only when Claude edits matching files, so it adds no context elsewhere."},{"id":"c09d","prompt":"Handler conventions live in CLAUDE.md files copied into eight folders. Files named *.handler.ts in newer folders keep missing the conventions. What is the best fix?","options":["Copy the CLAUDE.md into each new handler folder too","Move the conventions into each developer's home folder","Paste the conventions into the root CLAUDE.md as well","One rule file with paths matching **/*.handler.ts"],"answer":3,"why":"A glob-scoped rule covers matching files in every folder, new or old, and loads only when those files are edited."}]},{"id":"c10","domain":3,"ts":"3.6","title":"Claude Code in CI","explain":"A CI job runs with nobody at the keyboard, so Claude Code must not stop and ask questions. The -p flag runs it in non-interactive mode, where it takes one prompt, prints an answer and exits. Asking for JSON output makes the result easy for other tools to read.","rule":"In CI, run Claude Code with -p and request structured output so scripts can parse it.","questions":[{"id":"c10a","prompt":"A pipeline step starts Claude Code and then hangs forever waiting for input. What fixes it?","options":["Pipe in a long list of yes answers for every prompt","Run it with the -p flag for non-interactive mode","Increase the pipeline timeout to several more hours","Run the job twice in a row and keep the faster run"],"answer":1,"why":"The -p flag makes Claude Code run once without waiting for a person to type."},{"id":"c10b","prompt":"A script must read Claude's review comments from a CI run. What is the most dependable output?","options":["Free text that the script searches for the word \"issue\"","A screenshot of the terminal saved by the CI system","A long essay that a person reads and copies by hand","Structured JSON output that scripts can parse directly"],"answer":3,"why":"Structured JSON gives scripts predictable fields, so no guessing is needed."}],"applied":[{"id":"c10c","prompt":"A CI job runs claude -p and posts findings as inline PR comments, but the script often fails to parse Claude's reply. What should you add?","options":["A prompt line asking Claude to please answer in valid JSON","A retry that reruns the job until parsing happens to work","--output-format json with --json-schema for fixed fields","A regular expression that pulls findings out of the prose"],"answer":2,"why":"These CLI flags enforce machine-parseable structured output, while prompts and regexes only make it likely."},{"id":"c10d","prompt":"After each new commit, the CI review posts the same comments again, including issues the author already fixed. What should the next run include?","options":["The prior findings, and a request to report only new or open issues","A longer timeout so the review can read the full commit history","The same prompt as before, with a lower temperature each time","A note asking Claude to keep every comment as short as possible"],"answer":0,"why":"Giving the review its earlier findings lets it skip duplicates and report only new or unaddressed issues."}]},{"id":"c11","domain":4,"ts":"4.1","title":"Explicit criteria beat vague words","explain":"Telling Claude to \"be careful\" or \"only flag important issues\" is like telling a referee to \"call fouls fairly\". Nobody knows where the line is. List the exact things to flag and the things to skip, ideally with a short example, and the results become steady.","rule":"Replace vague words like careful or important with specific, testable criteria.","questions":[{"id":"c11a","prompt":"Your code review prompt says \"only report important issues\", yet the output is inconsistent. What is the best fix?","options":["List the exact kinds of issues to report or to skip","Add the word very before important in the prompt","Run the review three times and use the average","Ask Claude to rate its own confidence on every issue"],"answer":0,"why":"Specific criteria remove the guesswork that vague words leave behind."},{"id":"c11b","prompt":"A summarizer is told to \"keep it short but complete\" and the length keeps varying. What helps most?","options":["Tell it to try much harder to be consistent","Add a polite note asking for steady output each time","Switch off summaries and let people read everything","State a clear limit such as three one-line bullets"],"answer":3,"why":"A concrete limit gives Claude a target it can meet every time."}],"applied":[{"id":"c11c","prompt":"A team added \"be conservative and only report high-confidence findings\" to a security review prompt, but false positives barely dropped. What should they do instead?","options":["Only show findings rated above 90% confidence","Repeat \"be conservative\" at the start and end","Have Claude explain its confidence on each one","Define which issue types to report and skip"],"answer":3,"why":"General caution words and confidence filters do not improve precision the way specific categorical criteria do."},{"id":"c11d","prompt":"A code reviewer's style category produces mostly false positives, and developers have started ignoring its security findings too. What is a sensible first step?","options":["Keep every category and add \"be careful\" to the style part","Turn off the style category while its criteria are improved","Ask developers to read each finding more closely than before","Add confidence scores and hide every finding below a cutoff"],"answer":1,"why":"Pausing a high false-positive category restores trust in the accurate ones while you fix its prompt."}]},{"id":"c12","domain":4,"ts":"4.3","title":"Schemas for structured output","explain":"If you need data in a fixed shape, give Claude a tool with a JSON schema and have it fill in the fields. This guarantees the shape is valid, much like a form with labeled boxes. A schema cannot guarantee the values are true, though, so make a field nullable when the data may be missing instead of forcing a guess.","rule":"Use tool_use with a JSON schema for shape, and allow null so Claude never has to invent values.","questions":[{"id":"c12a","prompt":"You need invoice data as clean JSON every time. Which approach is the most reliable?","options":["Ask politely for valid JSON in the prompt text","Parse the reply with patterns and fix errors afterward","Define a tool with a JSON schema and have Claude call it","Show three sample outputs and trust Claude to copy them"],"answer":2,"why":"A schema on a tool call enforces the structure, while prompts and samples only encourage it."},{"id":"c12b","prompt":"Some invoices have no purchase order number and Claude sometimes makes one up. What should you change?","options":["Tell Claude in bold never to make anything up","Make the field required so Claude always fills it","Remove the field so it can never be wrong","Make the field nullable so Claude can leave it blank"],"answer":3,"why":"A nullable field gives Claude a safe way to say the value is absent."}],"applied":[{"id":"c12c","prompt":"An extraction tool with a strict JSON schema always returns valid JSON, yet on some invoices the line items do not add up to the total. Why did the schema not catch this?","options":["Schemas fix shape, not whether the values are correct","The schema must be missing a required field for the total","tool_choice was set to auto instead of forcing the tool","JSON schemas only check the first few fields of an object"],"answer":0,"why":"Tool use with a schema removes syntax errors, but semantic errors like wrong sums still need separate checks."},{"id":"c12d","prompt":"A ticket schema has a category enum of billing, shipping and returns. New kinds of tickets keep getting forced into the wrong category. What schema change helps?","options":["Make the category field required so it is never empty","Drop the enum and let Claude write any category it likes","Add \"other\" with a detail field, plus \"unclear\"","Add more examples of billing and shipping tickets"],"answer":2,"why":"An \"other\" value with a detail string handles new categories, and \"unclear\" covers ambiguous cases without forcing a guess."}]},{"id":"c13","domain":4,"ts":"4.5","title":"Batch or real time","explain":"The Message Batches API is like sending a parcel by slow freight. It costs less, but results can take up to 24 hours and there is no promise of speed. That suits overnight jobs where no one is waiting, and it is a poor fit for anything that blocks a person or a merge.","rule":"Use batches for slow, non-urgent work and normal calls for anything someone is waiting on.","questions":[{"id":"c13a","prompt":"Which job is the best fit for the Message Batches API?","options":["Scoring ten thousand old support tickets overnight for a report","Checking a pull request before the author can merge it","Answering a customer in a live chat window right now","Approving a payment while the shopper waits on the page"],"answer":0,"why":"Batches are cheaper but slow, so they fit large jobs that nobody is waiting on."},{"id":"c13b","prompt":"A team wants to save money by sending its pre-merge checks through the Batches API. What is the problem?","options":["Batch results are always lower quality than normal calls","Batches cannot handle any code files at all","Batches only work on weekends and outside office hours","Results may take up to 24 hours, which blocks the merge"],"answer":3,"why":"A merge gate needs a fast answer, and batches give no time guarantee."}],"applied":[{"id":"c13c","prompt":"An overnight batch of 5,000 documents comes back with 40 failures, mostly documents that were too long for the context window. What should you do?","options":["Resubmit all 5,000 documents in a fresh batch the next night","Move the whole job to the real-time API to avoid failures","Resubmit only the 40, found by custom_id, after chunking them","Drop the 40 failures and report on the other 4,960 only"],"answer":2,"why":"custom_id identifies the failed requests, so you fix and resend only those."},{"id":"c13d","prompt":"A team wants to run an agent through the Batches API, but the agent must call a lookup tool mid-task and use the result. What is the problem?","options":["A batch request cannot run tools mid-request and carry on","Batches cost more than normal calls whenever tools are used","Batch results come back with no way to match them to requests","Batch requests fail if they take longer than one hour"],"answer":0,"why":"The batch API cannot run tools mid-request, while it does cut cost by 50%, match results by custom_id and allow up to 24 hours."}]},{"id":"c14","domain":5,"ts":"5.1","title":"Keep key facts safe","explain":"When a long chat is summarized, small details like an order number or a promised refund amount can get squeezed out. Keep a short block of case facts, such as ids, amounts and dates, and include it word for word in every request. The summary can shrink, but the facts stay intact.","rule":"Keep exact key facts in a case-facts block instead of trusting a summary to keep them.","questions":[{"id":"c14a","prompt":"After a long support chat is summarized, the agent forgets the exact refund amount the customer was promised. What prevents this?","options":["Summarize more often so each summary is shorter","Trust that the model will remember the important parts","Ask the customer to repeat the amount whenever it matters","Keep the amount in a case-facts block sent with each request"],"answer":3,"why":"A verbatim facts block survives summarizing, so exact values are never lost."},{"id":"c14b","prompt":"A long coding session keeps losing the agreed database name and version after compaction. What is the best fix?","options":["Compact the conversation more often to save space","Repeat the details in the chat now and then by hand","Write a short note of the fixed facts and include it each time","Start over with a new session after every few messages"],"answer":2,"why":"A small fixed block of facts is carried through every request, so compaction cannot drop it."}],"applied":[{"id":"c14c","prompt":"In one chat a customer raises a late order, a double charge of $42.10 and a wrong size. After summarizing, the agent mixes up which order had which problem. What would help most?","options":["Summarize the chat more often so each summary covers less","Keep each issue's order ID, amount and status in a facts layer","Ask the customer to restate all three issues at each step","Handle only the latest issue and close the other two first"],"answer":1,"why":"Structured issue data kept outside the summary preserves the exact facts for each issue."},{"id":"c14d","prompt":"A summary of a long chat says the customer \"expects a partial refund soon\", but the customer had actually said \"$80 by Friday\". What went wrong?","options":["The model can only hold a few numbers","The customer stated the amount vaguely","The summary was too long to be useful","Summarizing blurred exact values"],"answer":3,"why":"Progressive summarization tends to turn amounts and dates into vague words, so exact facts belong in a case-facts block."}]},{"id":"c15","domain":5,"ts":"5.2","title":"When to hand off to a human","explain":"Escalating to a person should depend on clear, checkable triggers. These include a customer asking for a human, a case outside policy, or no progress after real attempts. An upset tone alone is a poor trigger because plenty of calm cases need help and plenty of upset ones are easy to solve.","rule":"Escalate on explicit requests and policy limits, never on mood alone.","questions":[{"id":"c15a","prompt":"A customer writes \"Please connect me to a human agent.\" What should the agent do?","options":["Offer to keep trying first and ask them to wait","Check how angry the message sounds before deciding","Hand the case to a human as the customer asked","Run a sentiment score and escalate only above a limit"],"answer":2,"why":"An explicit request for a person is a clear trigger that should be honored right away."},{"id":"c15b","prompt":"A team wants to escalate whenever a customer sounds frustrated. What is the weakness in that plan?","options":["Frustration is a vague signal and misses real policy cases","Frustrated customers should never be sent to a human","Models are unable to read any tone in written text","Human agents are always too busy to take escalations"],"answer":0,"why":"Mood is an unreliable trigger, so use clear rules such as policy limits or explicit requests."}],"applied":[{"id":"c15c","prompt":"A customer is annoyed that a delivery is late, but the fix is a standard reship the agent can do. They have not asked for a human. What should the agent do?","options":["Acknowledge the frustration and offer the reship now","Escalate to a human since the customer is clearly upset","Wait for a sentiment score to pass a set level first","Send only the tracking link and skip the frustration"],"answer":0,"why":"When the issue is within the agent's ability, it should acknowledge the feeling and resolve it, escalating only if the customer asks."},{"id":"c15d","prompt":"A customer asks the agent to match a competitor's lower price. The policy only covers price changes on your own site. What should the agent do?","options":["Refuse, since the policy does not allow price matches","Approve it, since the policy allows price adjustments","Escalate, since the policy is silent on this request","Wait to escalate until the customer sounds frustrated"],"answer":2,"why":"A gap in policy is an escalation trigger, so a human should decide instead of the agent guessing."}]},{"id":"c16","domain":5,"ts":"5.3","title":"Pass errors up clearly","explain":"In a team of agents, a helper that fails quietly leaves the coordinator guessing. A helper should report what it tried, what went wrong and what it still managed to get. With that, the coordinator can retry, use another source or tell the user honestly what is missing, and each claim keeps its source.","rule":"Report failures with details and partial results, never as silence or a bare crash.","questions":[{"id":"c16a","prompt":"A search subagent cannot reach one source and returns an empty list. The coordinator reports there is no information. What went wrong?","options":["The coordinator should have searched without subagents","The failure was hidden as an empty result with no details","The subagent should have returned a longer empty list","The user should have asked a much simpler question"],"answer":1,"why":"An empty result looks like success, so the subagent should have reported the failure and what it tried."},{"id":"c16b","prompt":"A research helper finds eight of ten sources and the last two fail. What should it send back to the coordinator?","options":["Only an error message and none of the eight results","The eight results plus a note on which two failed and why","The eight results only, to keep the report clean and short","A confident final answer that ignores the two failed sources"],"answer":1,"why":"Partial results plus clear failure details let the coordinator decide what to do next."}],"applied":[{"id":"c16c","prompt":"A subagent's database query times out once. It reports this straight to the coordinator, which then stops the whole workflow. What is a better design?","options":["End the workflow whenever any subagent hits an error","Return an empty result so the workflow keeps moving","Retry without limit and never report it to anyone","Retry locally and report up only if it still fails"],"answer":3,"why":"Subagents should handle transient failures locally and pass up only what they cannot resolve, with what they tried."},{"id":"c16d","prompt":"Two of six sources were down during a research run, but the final report reads as if coverage were complete. What should the synthesis output include?","options":["Only the findings from four sources, shown as the full picture","Notes on which findings are well supported and where gaps are","A best guess at what the two missing sources would have said","An error message in place of the report, since sources failed"],"answer":1,"why":"Coverage annotations tell readers which areas are solid and which have gaps from unavailable sources."}]},{"id":"c17","domain":1,"ts":"1.2","title":"The coordinator runs the show","explain":"A coordinator agent is like a project lead who hands out work, collects results and decides what happens next. Subagents report only to the coordinator, not to each other, so every message passes through one place where errors and routing are handled. A good coordinator picks only the helpers a request needs and checks the combined result for gaps.","rule":"Route all subagent work through the coordinator, and let it choose helpers and fill gaps.","questions":[{"id":"c17a","prompt":"In a hub-and-spoke multi-agent system, how do two subagents share information?","options":["By sending messages straight to each other as they work","By reading each other's full conversation history","Through the coordinator, which routes what each needs","By sharing one long context window among all of them"],"answer":2,"why":"The coordinator handles all communication between subagents, which keeps routing and error handling in one place."},{"id":"c17b","prompt":"A simple question needs only one quick search, but the system always runs search, analysis and writing helpers. What should the coordinator do instead?","options":["Pick only the helpers this request actually needs","Run every helper anyway so nothing is ever missed","Let the helpers vote on which of them runs first","Send it to all helpers and keep the fastest answer"],"answer":0,"why":"A coordinator should look at what the request needs and invoke only those subagents."}],"applied":[{"id":"c17c","prompt":"The coordinator reviews a draft report and sees no data on costs, one of the areas the user asked about. What should it do next?","options":["Send the draft and tell the user costs were out of scope","Ask the synthesis helper to fill the gap from memory","Restart the whole pipeline from scratch with the same plan","Send a targeted cost query to search, then rerun synthesis"],"answer":3,"why":"The coordinator closes gaps by re-delegating targeted work and re-invoking synthesis until coverage is sufficient."},{"id":"c17d","prompt":"Two search subagents keep returning the same articles while parts of the topic get no coverage. What is the best fix?","options":["Let the two subagents read each other's results directly","Give each subagent a distinct subtopic or source type","Add a third search subagent with exactly the same task","Ask both subagents to search harder and return more"],"answer":1,"why":"Partitioning the scope across subagents cuts duplication and spreads coverage, and it keeps communication routed through the coordinator."}]},{"id":"c18","domain":1,"ts":"1.5","title":"Hooks that tidy tool results","explain":"A hook is a small piece of code that runs at a fixed point in the agent loop, every single time. A PostToolUse hook runs right after a tool returns, so it can tidy the result before Claude reads it, like a translator who turns every date into one format. Another kind of hook checks an outgoing tool call and can block it or send it elsewhere.","rule":"Use a PostToolUse hook to normalize tool results so Claude always sees one consistent format.","questions":[{"id":"c18a","prompt":"Three MCP tools return dates as Unix timestamps, ISO 8601 strings and plain text. Where is the best place to make them consistent?","options":["A line in the system prompt asking Claude to convert each date","A PostToolUse hook converting dates before Claude reads them","A few examples showing Claude how to read each date style","A note in each tool description that lists its date format"],"answer":1,"why":"A hook converts every result in code, every time, while prompts and examples only make conversion likely."},{"id":"c18b","prompt":"When does a PostToolUse hook run?","options":["Before Claude decides which tool it wants to call","Only when a tool returns an error instead of data","Once at the very end, after the agent has finished","After a tool returns, before Claude reads it"],"answer":3,"why":"PostToolUse runs on the tool result before the model processes it, which is why it suits normalization."}],"applied":[{"id":"c18c","prompt":"An order tool returns numeric status codes like 3 and 7, and the agent sometimes tells customers the wrong status. What is the most reliable fix?","options":["Map each code to a plain name in a PostToolUse hook","Add a table of all status codes to the system prompt","Ask Claude to double check each code before replying","Switch to a larger model that may know the codes"],"answer":0,"why":"Translating codes in a hook means Claude only ever sees the correct plain status, with no reliance on recall."},{"id":"c18d","prompt":"A support agent needs two guarantees: dates from every tool arrive in one format, and refunds over $500 never go out without a human. Which setup fits?","options":["Run one hook after the refund tool finishes to check both rules","Write both rules into the system prompt with clear examples","Normalize results after tools return; check refund calls before they run","Normalize dates before each call and review refunds afterward"],"answer":2,"why":"Result normalization belongs after the tool returns, and a policy block must intercept the call before it runs."}]},{"id":"c19","domain":1,"ts":"1.6","title":"Fixed steps or an adaptive plan","explain":"Some jobs are like an assembly line, with the same steps in the same order every time. Others are like detective work, where each clue decides the next step. Use a fixed chain of prompts for predictable work, and use a plan that adapts to what is found for open-ended work.","rule":"Chain fixed steps for predictable tasks and let the plan adapt for open-ended investigations.","questions":[{"id":"c19a","prompt":"Which task suits a fixed sequence of prompt steps best?","options":["Finding why a rare bug hits only some customers","Exploring an unknown codebase to see what might break","Researching a question where each clue changes the plan","Extracting then formatting fields on every invoice"],"answer":3,"why":"A predictable sequence of steps that repeats for every input is a natural fit for prompt chaining."},{"id":"c19b","prompt":"What makes dynamic decomposition a good fit for a task?","options":["The steps are always the same for every input","The task is small enough to finish in one prompt","Next steps depend on what earlier steps find","The output must follow one strict, fixed format"],"answer":2,"why":"Adaptive plans shine when discoveries along the way decide what to do next."}],"applied":[{"id":"c19c","prompt":"You ask Claude to \"add thorough tests to a legacy codebase\" and it starts writing tests for the first file it opens. What approach works better?","options":["Write tests file by file in alphabetical order until done","Map the structure, find high-impact areas, then plan and adapt","Ask for exactly one test per function across the codebase","Generate all of the tests in a single prompt to save time"],"answer":1,"why":"Open-ended work goes better when Claude maps the code first and builds a prioritized plan that adapts as dependencies appear."},{"id":"c19d","prompt":"A team's document review always needs the same three checks: legal terms, pricing and dates. One large prompt keeps skipping a check. What should they do?","options":["Chain three prompts, each running one check in order","Let the agent decide afresh which checks to run each time","Add more words to the single prompt about every check","Run the large prompt twice and merge the two outputs"],"answer":0,"why":"Breaking a predictable review into sequential steps gives each check focused attention."}]},{"id":"c20","domain":2,"ts":"2.4","title":"Where MCP servers live","explain":"MCP servers give Claude extra tools, and where you configure them decides who gets them. A project .mcp.json lives in the repo, so the whole team shares it, while ~/.claude.json is just for you. Keep secrets out of the repo by writing ${GITHUB_TOKEN} in .mcp.json, so each person's own token is filled in from their environment.","rule":"Share team MCP servers in .mcp.json with ${VAR} for secrets, and keep personal ones in ~/.claude.json.","questions":[{"id":"c20a","prompt":"The whole team needs the same Jira MCP server. Where should it be configured?","options":["In the project .mcp.json in the repo","In each person's ~/.claude.json file","In a pinned message in the team chat","In the root CLAUDE.md as a plain note"],"answer":0,"why":"A project-scoped .mcp.json is committed to the repo, so everyone gets the same server."},{"id":"c20b","prompt":"Your committed .mcp.json needs a GitHub token. How should the token appear in the file?","options":["As the real token pasted in as plain text","As ${GITHUB_TOKEN} from the environment","As a comment asking people to add their own","Left out, with the token typed in each session"],"answer":1,"why":"Environment variable expansion keeps the secret out of version control while the shared config still works."}],"applied":[{"id":"c20c","prompt":"Your team added an MCP code search tool that understands symbols and history, but Claude keeps using built-in Grep instead. What should you change first?","options":["Remove Grep from the agent so it has no other option","Add a system prompt line saying never to use Grep","Expand the MCP tool description to explain what it returns","Install a second MCP search server next to the first"],"answer":2,"why":"A detailed description of the MCP tool's capabilities and outputs helps Claude prefer it over a simpler built-in tool."},{"id":"c20d","prompt":"At the start of every task, an agent makes a dozen exploratory tool calls just to learn which database tables exist. What would cut this down?","options":["Give the agent a larger budget of tool calls","Ask the agent to guess table names from habit","Add a tool that lists one table on each call","Expose the schema catalog as an MCP resource"],"answer":3,"why":"An MCP resource shows the agent what data exists up front, so it does not need exploratory calls."}]},{"id":"c21","domain":2,"ts":"2.5","title":"Pick the right built-in tool","explain":"Claude Code's built-in tools each have one job. Grep searches inside files for text, such as a function name or an error message, and Glob finds files by name pattern, such as **/*.test.tsx. Read and Write handle whole files, while Edit changes one spot by matching unique text. If Edit cannot find a unique match, read the file and write it back in full.","rule":"Grep for content, Glob for file names, Edit for targeted changes, and Read plus Write when Edit cannot match.","questions":[{"id":"c21a","prompt":"You want to find every file that calls the function parseInvoice. Which tool fits?","options":["Glob, matching files named parseInvoice","Read, opening every single file in the project","Grep, searching file contents for the name","Edit, renaming it to see what breaks"],"answer":2,"why":"Grep searches inside files, which is how you find every caller of a function."},{"id":"c21b","prompt":"You need a list of every file named like *.test.tsx anywhere in the repo. Which tool fits?","options":["Glob with the pattern **/*.test.tsx","Grep for the word test inside every file","Read each folder and scan the file names","Bash to open each file one at a time"],"answer":0,"why":"Glob matches file paths by pattern, so it lists files by name without opening them."}],"applied":[{"id":"c21c","prompt":"Edit fails because the line you want to change appears several times in config.ts. What is the reliable fallback?","options":["Retry Edit with the same text until it works","Use Grep to change the matching line in place","Delete the file and recreate it from memory","Read the file, then Write it back"],"answer":3,"why":"When Edit has no unique anchor, Read plus Write replaces the file reliably."},{"id":"c21d","prompt":"You join a large codebase and need to understand how checkout works. What is the best way to start?","options":["Read every file in the repo before asking anything","Grep for the checkout entry point, then Read along imports","Glob for all files and open them in name order","Ask Claude to infer the flow from common patterns"],"answer":1,"why":"Building understanding step by step from an entry point avoids loading the whole codebase up front."}]},{"id":"c22","domain":3,"ts":"3.2","title":"Commands and skills","explain":"A custom slash command is a saved prompt you run by name. Commands in the repo's .claude/commands/ folder reach the whole team, while ~/.claude/commands/ is just for you. Skills live in .claude/skills/ with a SKILL.md file whose frontmatter sets options: context: fork runs the skill in its own sub-agent so its long output stays out of your chat, and allowed-tools limits what it can use.","rule":"Share commands and skills through the repo, and use frontmatter such as context: fork and allowed-tools to control how a skill runs.","questions":[{"id":"c22a","prompt":"A skill produces pages of codebase analysis that clutter your main chat. Which frontmatter option helps?","options":["argument-hint, to ask which folder to scan","context: fork, to run it in its own sub-agent","allowed-tools, to give it extra search tools","A longer skill description so it runs less often"],"answer":1,"why":"context: fork runs the skill in an isolated sub-agent, so its verbose output stays out of the main conversation."},{"id":"c22b","prompt":"You want a personal version of the team's /deploy-check skill without changing it for teammates. What should you do?","options":["Edit the shared skill in .claude/skills/ directly","Add your own changes to the project CLAUDE.md","Ask each teammate to switch off the shared skill for now","Make a differently named copy in ~/.claude/skills/"],"answer":3,"why":"A personal variant with a different name in your user folder leaves the team's skill untouched."}],"applied":[{"id":"c22c","prompt":"A team's /migrate skill must only write files, never run shell commands, and developers often forget to name the table. What should the SKILL.md frontmatter include?","options":["allowed-tools limited to file writes, plus an argument-hint","context: fork alone, so the skill runs apart from the chat","A line in the skill body asking it to avoid shell commands","A rule in CLAUDE.md telling Claude to ask for the table"],"answer":0,"why":"allowed-tools restricts what the skill can do, and argument-hint prompts for the missing parameter."},{"id":"c22d","prompt":"A team writes its full release checklist into CLAUDE.md, though it is only needed once a week. What is a better home for it?","options":["A longer CLAUDE.md with the checklist at the top","Each developer's personal ~/.claude/CLAUDE.md","A skill developers invoke when they release","A comment at the top of the release script"],"answer":2,"why":"Skills suit task-specific workflows run on demand, while CLAUDE.md is for standards that should always load."}]},{"id":"c23","domain":3,"ts":"3.4","title":"Plan first or just do it","explain":"Plan mode is like drawing a blueprint before building. Claude explores the code and proposes an approach before it changes anything, which suits large, multi-file work with several valid designs. For a small, clear fix, such as one check in one function, direct execution is quicker. The Explore subagent can also take on noisy discovery and hand back just a summary.","rule":"Plan first for large or architectural changes, and execute directly for small, well-scoped fixes.","questions":[{"id":"c23a","prompt":"Which task is the best fit for direct execution?","options":["Moving the app from one web framework to another","Choosing between two queue systems for a new service","Deciding which shared modules each service should own","Adding a null check to one function with a clear bug"],"answer":3,"why":"A small, well-scoped change in one place does not need a planning phase."},{"id":"c23b","prompt":"What is the main benefit of plan mode on a large change?","options":["It writes code faster by skipping review steps","It lets Claude work without tools for the whole task","It explores and designs before any files change","It removes the need to test the changes afterward"],"answer":2,"why":"Plan mode lets Claude explore safely and settle on an approach before committing to edits, which prevents rework."}],"applied":[{"id":"c23c","prompt":"You must migrate a logging library used in about 50 files. The approach is unclear and some call sites differ. What is the best workflow?","options":["Edit files directly one by one and fix problems as they appear","Plan the migration first, then execute the plan directly","Stay in plan mode for the whole job, including every edit","Ask Claude to change all 50 files in one direct prompt"],"answer":1,"why":"Plan mode suits the investigation, and direct execution suits carrying out the agreed plan."},{"id":"c23d","prompt":"During a long multi-phase task, the discovery step fills the main context with pages of file listings and search output. What would help?","options":["Run discovery in the Explore subagent and keep its summary","Paste the listings into a note and reread it later on","Skip discovery and start editing files straight away","Turn off plan mode so the output is a bit shorter"],"answer":0,"why":"The Explore subagent isolates verbose discovery and returns a summary, which protects the main context."}]},{"id":"c24","domain":3,"ts":"3
