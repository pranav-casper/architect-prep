.5","title":"Show, test and ask","explain":"When words alone keep being misread, show Claude what you mean. Two or three concrete input and output examples settle a transformation faster than another paragraph. Writing tests first and sharing the failures gives Claude a clear target, and letting Claude interview you first surfaces questions you had not thought of.","rule":"Use concrete examples, failing tests and the interview pattern instead of rewording vague instructions.","questions":[{"id":"c24a","prompt":"Claude keeps formatting phone numbers differently from what you described in words. What helps most?","options":["Show two or three input and output examples","Describe the format again in a longer paragraph","Ask Claude to be more careful with the format","Let Claude pick any format it prefers"],"answer":0,"why":"Concrete examples communicate a transformation more clearly than prose that is being read inconsistently."},{"id":"c24b","prompt":"What is the interview pattern?","options":["You quiz Claude on the code after it is done","Claude asks you questions before building","Two Claude sessions debate the design together","Claude interviews users to collect feature requests"],"answer":1,"why":"In the interview pattern, Claude asks questions first to surface considerations you may not have anticipated."}],"applied":[{"id":"c24c","prompt":"A data import script has three problems. Fixing the parser changes how the date bug shows up, and the third is an unrelated typo in a log message. How should you send them?","options":["Send all three in separate messages, one after another","Send only the typo first because it is the quickest one","Send the two linked issues together, and the typo on its own","Wait until more bugs appear and then send them together"],"answer":2,"why":"Interacting problems belong in one detailed message, while an independent issue can be fixed separately."},{"id":"c24d","prompt":"A migration script crashes on rows with null values, and two written explanations have not fixed it. What should you send next?","options":["A longer explanation of why null values matter here","A request to rewrite the whole script from scratch","A note asking Claude to think harder about edge cases","A test case with null input and its expected output"],"answer":3,"why":"A specific test case with input and expected output shows exactly how the edge case must behave."}]},{"id":"c25","domain":4,"ts":"4.2","title":"Teach by example","explain":"When detailed instructions still give uneven results, show a few worked examples. Two to four well-chosen examples teach the format you want and how to handle tricky, borderline cases. The best ones explain why one choice beat a close alternative, so Claude can apply the same judgment to new cases it has never seen.","rule":"Use two to four targeted examples, with reasoning, when instructions alone give inconsistent results.","questions":[{"id":"c25a","prompt":"Your instructions describe the review format in detail, yet every finding looks different. What is the most effective next step?","options":["Repeat the format rules a second time in capitals","Ask Claude to keep its findings short and tidy","Add a few examples of the exact format","Limit the output to only the top five findings"],"answer":2,"why":"Few-shot examples are the most effective way to get consistent formatting when instructions alone fall short."},{"id":"c25b","prompt":"What makes a few-shot example for an ambiguous case most useful?","options":["It shows why one choice beat a close alternative","It is very long and covers every possible situation","It is copied from the exact input the model will see","It lists only cases the model gets right"],"answer":0,"why":"Showing the reasoning behind a choice helps Claude generalize that judgment to new cases."}],"applied":[{"id":"c25c","prompt":"An extraction agent often returns null for a required field when a document puts it somewhere unusual, such as a footnote. What should you add?","options":["A rule saying the field must never be left empty","A retry that reruns the same prompt until it fills","A larger model that reads each document slowly","A few examples of extraction from varied layouts"],"answer":3,"why":"Examples that cover varied document structures teach Claude where to look, which reduces empty extractions."},{"id":"c25d","prompt":"A code reviewer keeps flagging a safe, common pattern as a bug. You want that to stop without missing real bugs that look similar. What helps most?","options":["Tell the reviewer to skip anything that looks like it","Add examples contrasting the safe pattern with a real bug","Add fifty examples of the safe pattern to the prompt","Remove that whole category of check from the review"],"answer":1,"why":"Contrasting acceptable code with genuine issues cuts false positives while still letting Claude generalize."}]},{"id":"c26","domain":4,"ts":"4.4","title":"Retry with the error attached","explain":"When an extraction fails a check, a blind retry often repeats the mistake. Send a follow-up with the original document, the failed output and the exact error, such as \"line items sum to 90 but the total says 100\". This works for format and structure mistakes, but no retry can find information that is not in the document at all.","rule":"Retry with the specific error attached, and stop retrying when the data is missing from the source.","questions":[{"id":"c26a","prompt":"An extraction fails validation because a date is in the wrong format. What should the retry include?","options":["The same prompt again, unchanged, for another try","The document, its failed output and the error","Only the error message, without the document","A short note telling Claude its answer was wrong"],"answer":1,"why":"Giving Claude the source, its failed attempt and the specific error guides it to the correction."},{"id":"c26b","prompt":"When will retrying an extraction NOT help?","options":["When a date came back in the wrong format","When a value landed in the wrong field","When the output structure was malformed","When the value is not in the document"],"answer":3,"why":"Retries fix format and structure mistakes, but they cannot produce information the source lacks."}],"applied":[{"id":"c26c","prompt":"An invoice extraction reports a total of 500, but its line items add up to 450. How can you catch this kind of mismatch automatically?","options":["Extract a calculated total next to the stated total and compare","Make the total field required in the JSON schema","Ask Claude to be extra careful when reading totals","Use tool use so the output always fits the schema"],"answer":0,"why":"A schema guarantees shape, not correct values, so extracting both totals lets code flag the discrepancy."},{"id":"c26d","prompt":"A contract extraction keeps failing on the renewal date. The contract says \"see Appendix B\", and the appendix was never sent. Retries with error feedback have not helped. What is the real issue?","options":["The error feedback was not specific enough","The model needs a few more retries to succeed","The date is in a document that was never sent","The schema should make the date a required field"],"answer":2,"why":"Retries cannot recover information that exists only in a document Claude never received."}]},{"id":"c27","domain":4,"ts":"4.6","title":"A fresh pair of eyes","explain":"Checking your own essay right after writing it is hard, because you remember what you meant. Claude has the same problem: in the same session it keeps its earlier reasoning and is less likely to question it. A second, independent Claude instance that sees only the output, not the reasoning behind it, catches more subtle issues. For a large change, also review each file on its own and then run a separate pass on how the files connect.","rule":"Review generated work with a separate instance that does not carry the generator's reasoning.","questions":[{"id":"c27a","prompt":"Why is a same-session self-review weaker than an independent review?","options":["The same session cannot read the code it just wrote","Self-review always uses more tokens than a new instance","Models are not allowed to review their own output","It keeps its own reasoning and rarely doubts it"],"answer":3,"why":"The generating session carries its earlier reasoning, which makes it less likely to doubt its own choices."},{"id":"c27b","prompt":"Which setup catches the most subtle bugs in generated code?","options":["Ask the same session to review its work twice","Turn on extended thinking in the same session","Send the code to a fresh instance for review","Add \"check very carefully\" to the prompt"],"answer":2,"why":"An independent instance without the generator's context is more effective than self-review or extended thinking."}],"applied":[{"id":"c27c","prompt":"A pipeline writes a migration, then asks in the same conversation \"review the migration above for bugs\". It rarely finds any, yet bugs reach production. What should change?","options":["Tell the review step to find at least three bugs","Run the review in a new instance without the history","Repeat the same-session review until it finds one","Have the writing step explain its reasoning in detail"],"answer":1,"why":"Moving the review to an independent instance removes the reasoning context that blinds self-review."},{"id":"c27d","prompt":"One review pass over a 30-file pull request gives shallow comments and calls the same function safe in one file and unsafe in another. What should change?","options":["Review each file on its own, then run a cross-file pass","Tell the reviewer to stay consistent across all files","Have the generating session review the whole PR again","Send the full PR to a larger model in a single pass"],"answer":0,"why":"Per-file passes keep attention on local issues, and a separate integration pass checks how files connect without contradictory findings."}]},{"id":"c28","domain":5,"ts":"5.4","title":"Exploring big codebases","explain":"In a very long exploration session, context fills up and answers can drift, mentioning \"typical patterns\" instead of the specific classes found earlier. Save key findings to a scratchpad file and check it later. Send narrow questions to subagents so their noisy output stays out of the main session, and use /compact when context fills with verbose output.","rule":"Persist findings in a scratchpad, delegate noisy exploration to subagents and compact when context gets full.","questions":[{"id":"c28a","prompt":"Late in a long session, Claude talks about \"typical patterns\" instead of the classes it found earlier. What is happening?","options":["Context is degrading after a long, full session","The codebase changed while the session was open","Claude is being careful by giving general answers","The model was switched to a smaller one midway"],"answer":0,"why":"Vague, generic answers late in a long session are a sign of context degradation."},{"id":"c28b","prompt":"What is a scratchpad file for during a long exploration?","options":["Storing a full copy of every tool output","Saving key findings to look at again later","Holding secrets the agent should keep hidden","Keeping a draft of the final user answer"],"answer":1,"why":"A scratchpad keeps important findings outside the context window, so they survive as the session grows."}],"applied":[{"id":"c28c","prompt":"You need every place the refund flow touches, but tracing it fills the main session with hundreds of lines. What is the better approach?","options":["Keep tracing in the main session and hope it fits","Paste all of the trace output into a new message","Have a subagent trace it and send a summary","Ask Claude to skip the parts that seem minor"],"answer":2,"why":"A subagent isolates the verbose tracing, and the main agent keeps only the summary it needs."},{"id":"c28d","prompt":"A multi-agent exploration job crashes halfway, and on restart every agent begins from nothing. What design prevents this?","options":["Rerun the whole job from the start after a crash","Keep all state in the coordinator's chat history","Ask each agent to remember its progress next time","Agents export state; the coordinator loads a manifest"],"answer":3,"why":"Structured state exports plus a manifest let the coordinator resume each agent where it stopped."}]},{"id":"c29","domain":5,"ts":"5.5","title":"Trust, but sample","explain":"A headline accuracy number can hide weak spots: a system that is 97% accurate overall might still get one document type wrong half the time. Check accuracy by document type and field before cutting human review. Keep sampling a random slice of high-confidence results, and set confidence thresholds using a labeled set where the right answers are known.","rule":"Check accuracy per segment, sample high-confidence results and calibrate thresholds on labeled data.","questions":[{"id":"c29a","prompt":"An extraction system is 97% accurate overall. Why might that still be risky?","options":["It means each field is wrong about 3% of the time","Accuracy above 95% usually signals overfitting","It may hide poor accuracy on one document type","It counts only documents a human has reviewed"],"answer":2,"why":"An aggregate number can mask weak performance on specific document types or fields."},{"id":"c29b","prompt":"Why keep sampling some high-confidence extractions for human review?","options":["To measure real error rates and spot new errors","To keep reviewers busy when the queue is short","To retrain the model on every sampled result","Because high confidence often means a wrong result"],"answer":0,"why":"Sampling confident results measures their true error rate and catches new error patterns early."}],"applied":[{"id":"c29c","prompt":"A team wants to skip human review for every extraction with confidence above 0.9. How should they set that threshold safely?","options":["Pick 0.9 because it sounds safe","Ask the model which threshold it would prefer","Use last week's average confidence as the line","Calibrate it on a labeled validation set"],"answer":3,"why":"Thresholds should be calibrated against labeled data where the correct answers are known."},{"id":"c29d","prompt":"Reviewers can check only 200 of 5,000 daily extractions. Which ones should they see first?","options":["The first 200 extractions that arrive each morning","Low-confidence and conflicting-source cases","Only the extractions the model scored the highest","Only those from the largest customer accounts"],"answer":1,"why":"Limited reviewer time is best spent on low-confidence and ambiguous or contradictory cases."}]},{"id":"c30","domain":5,"ts":"5.6","title":"Keep claims tied to sources","explain":"When findings are summarized, the link between a claim and its source is easy to lose. Have each subagent return claims paired with their source, such as the URL, document name and a short excerpt, plus a date, and keep those pairs through synthesis. When two good sources disagree, show both values with their sources instead of quietly picking one.","rule":"Keep each claim tied to its source and date, and report conflicts openly instead of choosing a winner.","questions":[{"id":"c30a","prompt":"Two credible reports give different market sizes. What should the synthesis do?","options":["Average the two numbers into one single figure","Show both values, each with its source noted","Keep the one from the better known publisher","Leave the market size out of the report"],"answer":1,"why":"Conflicting credible values should be reported together with attribution rather than resolved arbitrarily."},{"id":"c30b","prompt":"What should a research subagent return with each claim so attribution survives?","options":["A confidence score from one to ten","A short summary of its reasoning steps","A list of related topics to search next","Its source: URL, document and excerpt"],"answer":3,"why":"A structured claim-source mapping lets later agents keep attribution through synthesis."}],"applied":[{"id":"c30c","prompt":"A report flags a contradiction between two sources on a statistic. One source is from 2019 and the other is from 2024. What would have prevented the false alarm?","options":["Requiring subagents to include publication dates","Telling synthesis to always prefer the newer source","Dropping any statistic that appears in two sources","Asking the user which of the sources they trust"],"answer":0,"why":"Dates in structured outputs let synthesis see a change over time instead of a contradiction."},{"id":"c30d","prompt":"A final report has many claims but no way to tell where each came from, even though the search subagents recorded URLs. Where was attribution most likely lost?","options":["In the search tool, which returned too many results","In the user's question, which did not ask for sources","In a summary step that compressed the findings","In the model choice, which was too small for citations"],"answer":2,"why":"Summaries that compress findings without claim-source mappings are where attribution gets dropped."}]}]},"practitioner":{"scenarios":[{"id":"s1","title":"Customer Support Resolution Agent","setup":"You are building a customer support resolution agent with the Claude Agent SDK. It handles returns, billing disputes and account issues, many of which are ambiguous when they arrive. The agent reaches backend systems through custom MCP tools: get_customer, lookup_order, process_refund and escalate_to_human. The business target is at least 80% first-contact resolution, with escalation reserved for cases that genuinely need a person.","questions":[{"id":"s1q1","domain":1,"ts":"1.5","type":"single","prompt":"Company policy says refunds above $500 need human approval. The system prompt states this rule in bold, and a test suite of 200 conversations passed. In the first month of production, an audit finds 11 refunds between $520 and $1,400 that process_refund executed without escalation. In each case the customer had described financial hardship. What change best guarantees the policy is followed?","options":[{"text":"Move the $500 rule to both the top and the bottom of the system prompt, and add a line stating that hardship never justifies an exception to the limit.","correct":false,"trap":"system-prompt-enforcement","rationale":"Repetition and placement can lower the failure rate, but the rule is still enforced by the model's judgment. Hardship stories are exactly the pressure that caused the misses."},{"text":"Add few-shot examples to the system prompt showing hardship cases above $500 in which the agent declines the refund and calls escalate_to_human.","correct":false,"trap":"few-shot-overload","rationale":"Examples shape behavior but remain probabilistic. A financial policy that must hold on every call needs enforcement outside the model."},{"text":"Add a hook that intercepts process_refund calls, blocks any amount over $500, and returns a message telling the agent to call escalate_to_human.","correct":true,"trap":null,"rationale":"A tool call interception hook enforces the limit in code on every call and redirects the agent to the escalation workflow. The prompt can no longer be talked around."},{"text":"Route each process_refund call through a second Claude instance that reads the conversation and approves or rejects the refund before it runs.","correct":false,"trap":"over-engineering","rationale":"This adds another model call per refund and is still a judgment call by an LLM. A simple numeric threshold is better checked in code."}],"takeaway":"When a business rule must hold every time, enforce it with a hook on the tool call rather than with prompt wording."},{"id":"s1q2","domain":2,"ts":"2.2","type":"single","prompt":"process_refund returns isError: true with the text \"Operation failed\" for every failure. Logs show the agent retrying refunds that were rejected because the order is outside the 30-day return window, sometimes four times in a row. It also tells customers whose refund hit a payment gateway timeout that their refund is not allowed. What should you change first?","options":[{"text":"Return an errorCategory, an isRetryable flag and a short customer-facing explanation in each process_refund error so the agent can tell these cases apart.","correct":true,"trap":null,"rationale":"The agent cannot choose a recovery path when every failure looks the same. Structured metadata lets it stop retrying policy rejections and retry or explain timeouts correctly."},{"text":"Add a system prompt rule that process_refund may be retried at most once per conversation, after which the agent apologizes and offers escalation.","correct":false,"trap":"symptom-fix","rationale":"Capping retries hides the wasted calls but the agent still cannot tell a timeout from a policy rejection, so customers keep getting the wrong explanation."},{"text":"Add exponential backoff inside the MCP server so process_refund retries internally and reports a failure only after five attempts have run out.","correct":false,"trap":"wrong-scope","rationale":"Backoff helps transient errors but retries the 30-day window rejection five more times for nothing, and the final error is just as generic as before."},{"text":"Split process_refund into separate tools for orders inside and outside the return window so the agent never calls a refund path that will be rejected.","correct":false,"trap":"tool-bloat","rationale":"This adds tools and pushes eligibility logic into tool selection. It does nothing for gateway timeouts, which are the other half of the problem."}],"takeaway":"Structured error responses with a category and a retryable flag let the agent pick the right recovery for each failure type."},{"id":"s1q3","domain":5,"ts":"5.2","type":"multi","prompt":"First-contact resolution is 62%. A review of 300 escalated tickets finds two patterns. The agent escalates routine in-policy cases, such as a duplicate charge, whenever the customer writes in an angry tone. It also approves competitor price-match requests on its own, although the written policy only covers price drops on the company's own site. Which two changes address both patterns? Select TWO.","options":[{"text":"Score each customer message for sentiment and call escalate_to_human automatically when the negative score stays above a set threshold for two turns.","correct":false,"trap":"sentiment-escalation","rationale":"Tone does not measure case complexity. This would make the first pattern worse by escalating more angry but simple cases."},{"text":"Add escalation criteria and examples to the system prompt, stating that requests the policy does not cover, like price matching, go to a human.","correct":true,"trap":null,"rationale":"Explicit criteria with examples fix the unclear boundary. Policy gaps like competitor price matching are a recognized escalation trigger."},{"text":"Ask the agent to rate its confidence from 1 to 10 before acting, and route the case to escalate_to_human whenever its own rating comes in below 7.","correct":false,"trap":"self-review","rationale":"Self-reported confidence is poorly calibrated. The agent was already confident when it approved price matches it had no policy basis for."},{"text":"Train a classifier on two years of historical tickets to predict which conversations need a human, and run it before the agent sees each request.","correct":false,"trap":"over-engineering","rationale":"This needs labeled data and new infrastructure before the cheaper prompt fix has even been tried."},{"text":"Instruct the agent to acknowledge frustration and offer to fix in-policy issues, escalating only if the customer then repeats a request for a person.","correct":true,"trap":null,"rationale":"This keeps simple angry cases with the agent while still honoring a customer who insists on a human."}],"takeaway":"Escalate on policy gaps and explicit requests for a human, not on sentiment or self-rated confidence."},{"id":"s1q4","domain":5,"ts":"5.1","type":"single","prompt":"Some billing conversations run past 40 turns, so older turns are condensed by progressive summarization. In a sample review, the agent later quoted a refund of \"about $80\" when the customer was owed $84.37, and lost track of which of three order numbers had already been refunded. What is the most effective fix?","options":[{"text":"Raise the token threshold that triggers summarization so the full history stays in context for longer before older turns are condensed.","correct":false,"trap":"symptom-fix","rationale":"This delays the loss but does not prevent it. Long conversations still reach the threshold and the figures still get compressed."},{"text":"Update the summarization prompt to say that all amounts, dates and order numbers must be preserved exactly as they appear in the original turns.","correct":false,"trap":"system-prompt-enforcement","rationale":"Summaries compress by design, and an instruction to keep every figure exact will still fail on some turns. The facts need a home outside the summary."},{"text":"Before each process_refund call, spawn a subagent that rereads the full raw transcript from storage and confirms the amount and the order number.","correct":false,"trap":"over-engineering","rationale":"This adds a subagent and latency to every refund and only checks one action. The agent still reasons from vague facts the rest of the time."},{"text":"Keep amounts, order numbers, dates and statuses in a case facts block that is included in every prompt, outside the summarized history.","correct":true,"trap":null,"rationale":"Transactional facts held in a persistent block are never summarized, so the agent always has exact figures and refund status."}],"takeaway":"Pull transactional facts into a persistent case facts block instead of trusting them to survive summarization."},{"id":"s1q5","domain":1,"ts":"1.4","type":"single","prompt":"Human agents report that escalated tickets arrive with notes like \"Customer has a billing problem, please assist.\" They cannot see the AI conversation, so they ask the customer to repeat everything, and post-escalation satisfaction has dropped. escalate_to_human currently accepts a single free-text reason field. What change best fixes the handoff?","options":[{"text":"Attach the full conversation transcript to every escalated ticket so the human agent can read the complete exchange before replying.","correct":false,"trap":"symptom-fix","rationale":"The human now has data but must read a long transcript to find the facts, and nothing states what was found or what should happen next."},{"text":"Change the escalate_to_human schema to require customer ID, order ID, issue summary, suspected cause, refund amount and recommended action.","correct":true,"trap":null,"rationale":"Required structured fields make the agent compile a usable handoff every time, giving a human who never saw the conversation what they need to act."},{"text":"Give the human support console access to get_customer and lookup_order so agents can rebuild each case themselves from the backend data.","correct":false,"trap":"wrong-scope","rationale":"Humans can look up records but still do not know what the customer said, what was tried, or what the agent concluded."},{"text":"Add a system prompt instruction telling the agent to write detailed, well-organized escalation notes covering everything a human would need.","correct":false,"trap":"system-prompt-enforcement","rationale":"Vague guidance like this gives inconsistent notes. A schema with required fields defines what complete means."}],"takeaway":"Escalation handoffs should be structured summaries with required fields, because the human does not have the transcript."},{"id":"s1q6","domain":2,"ts":"2.1","type":"single","prompt":"The tool descriptions were recently rewritten and now clearly separate lookup_order (order and refund status) from process_refund (issues a new refund). Even so, logs show the agent calling process_refund for messages like \"Has my refund for order #4471 gone through yet?\" The system prompt includes the line: \"When a customer mentions a refund, call process_refund promptly to keep resolution times low.\" What should you do?","options":[{"text":"Rewrite that system prompt line so it no longer ties the word refund to process_refund, and let the tool descriptions guide the choice.","correct":true,"trap":null,"rationale":"A keyword-sensitive instruction is overriding good descriptions. Removing the false association is the smallest change that fixes selection."},{"text":"Add few-shot examples to the system prompt in which questions about the status of an earlier refund are routed to lookup_order instead.","correct":false,"trap":"few-shot-overload","rationale":"Examples fight the conflicting instruction rather than removing it, and every new phrasing that mentions a refund can still trip the keyword rule."},{"text":"Add a hook that blocks process_refund whenever lookup_order shows that a refund for the same order has already been issued or is pending.","correct":false,"trap":"symptom-fix","rationale":"This stops duplicate refunds but the agent still picks the wrong tool first and never answers the status question it was asked."},{"text":"Merge lookup_order and process_refund into one manage_refund tool that checks for an earlier refund and only issues a new one when none exists.","correct":false,"trap":"over-engineering","rationale":"This mixes a read with a write and hides a side effect behind a status question. The misrouting comes from one prompt line."}],"takeaway":"Check the system prompt for keyword-sensitive instructions that override well-written tool descriptions."},{"id":"s1q7","domain":1,"ts":"1.1","type":"single","prompt":"The agent's loop stops when a reply contains \"Is there anything else I can help with?\" or after 8 iterations. Logs show two failures. Some conversations end mid-investigation, because the model wrote that phrase in the same response as a lookup_order call. And complex billing cases hit the 8-iteration cap before the refund is processed. How should the loop decide when to stop?","options":[{"text":"Continue while the response's stop_reason is \"tool_use\", running each requested tool and appending its result, and stop once stop_reason is \"end_turn\".","correct":true,"trap":null,"rationale":"stop_reason is the model's explicit signal. \"tool_use\" means it is waiting on tool results, and \"end_turn\" means it has finished. This fixes both failures at once."},{"text":"Keep the phrase check, add other closing phrases such as \"Have a great day\" to the list, and raise the iteration cap from 8 to 20 for billing cases.","correct":false,"trap":"text-signal-loops","rationale":"More phrases and a higher cap still guess at completion from wording and an arbitrary limit. A response can contain closing text and a tool call together."},{"text":"Stop the loop as soon as a response contains any assistant text block, since text means the model has finished calling tools for this turn.","correct":false,"trap":"text-signal-loops","rationale":"Responses often mix text with tool_use blocks. Treating any text as completion is the same bug that cut conversations short."},{"text":"Send each response to a small classifier model that predicts whether the conversation is finished, and end the loop when it reports high confidence.","correct":false,"trap":"over-engineering","rationale":"A second model adds cost and another probabilistic guess, when the API already reports exactly why the model stopped."}],"takeaway":"Drive the agent loop from stop_reason: keep going on \"tool_use\" and stop on \"end_turn\". Never end it by parsing the model's words or hitting an iteration cap."},{"id":"s1q8","domain":1,"ts":"1.4","type":"multi","prompt":"A customer writes: \"I was charged twice for order #4471, the replacement for #4390 never arrived, and I need to change my shipping address. I'm really fed up.\" Today the agent handles only the first issue it notices and closes the ticket, so customers write back about the rest. Which two changes fix this? Select TWO.","options":[{"text":"Have the agent first split the message into distinct issues, investigate each one using the shared customer record, then send one combined resolution.","correct":true,"trap":null,"rationale":"Decomposing a multi-concern request and working each item with shared context is the pattern that stops issues from being dropped."},{"text":"Keep a structured list of open issues, with order IDs, amounts and status, in context, and close the ticket only once every item is resolved or handed off.","correct":true,"trap":null,"rationale":"A persistent list of issues keeps every item visible across turns, so the agent cannot treat the ticket as done after the first one."},{"text":"Detect frustration in phrases like \"really fed up\", and send any message that combines several complaints with angry wording to escalate_to_human.","correct":false,"trap":"sentiment-escalation","rationale":"All three issues are routine and in policy. Tone is not a sign of complexity, so this escalates cases the agent can resolve."},{"text":"Spawn one separate subagent per issue, each with its own copy of the tools, and let each subagent send its own reply to the customer when it finishes.","correct":false,"trap":"over-engineering","rationale":"Separate agents with no shared context produce disjointed replies, and it is far more machinery than the problem needs."},{"text":"Reply asking the customer to open a separate ticket for each problem, so that every conversation the agent handles only contains a single issue.","correct":false,"trap":"symptom-fix","rationale":"This pushes the work onto the customer and hurts first-contact resolution instead of fixing how the agent handles requests."}],"takeaway":"Break multi-issue requests into distinct items, track each one as structured state, work them with shared context, and answer with one resolution."},{"id":"s1q9","domain":1,"ts":"1.5","type":"single","prompt":"get_customer returns account dates as Unix timestamps, lookup_order returns order dates in ISO 8601, and the returns tool reports status as numeric codes such as 3 or 7. The agent sometimes tells customers an order is outside the 30-day return window when it is not, because it misreads these values. What is the most reliable fix?","options":[{"text":"Add a PostToolUse hook that converts every date to ISO 8601 and maps status codes to named statuses before the agent ever sees the tool results.","correct":true,"trap":null,"rationale":"A PostToolUse hook normalizes the data in code on every call, so the model only reasons over one consistent format."},{"text":"Add a section to the system prompt explaining each tool's date format and listing what every numeric status code means, with a worked example.","correct":false,"trap":"system-prompt-enforcement","rationale":"The model still has to convert formats correctly every time, and that conversion is exactly where it slips."},{"text":"Rewrite all three MCP servers to share one date format and status vocabulary, and pause return handling in the agent until the rewrite ships.","correct":false,"trap":"over-engineering","rationale":"Changing three backends is slow and heavy when a hook at the agent boundary gives the same consistency today."},{"text":"Ask the agent to double-check every date calculation in a second message before it tells a customer whether an order is in the return window.","correct":false,"trap":"self-review","rationale":"The same model rechecking its own reading tends to repeat the same misreading. The inputs need fixing, not more review."}],"takeaway":"Normalize inconsistent tool outputs in a PostToolUse hook, so the model always reasons over clean, uniform data."},{"id":"s1q10","domain":1,"ts":"1.1","type":"single","prompt":"To save tokens, a developer changed the agent loop so that after running a tool it sends the tool_result back with the placeholder content \"done\" instead of the real output. Since then, logs show the agent calling lookup_order for order #5520 four or five times in a row and then telling the customer it cannot find the order. The backend returns the order correctly every time. What is the fix?","options":[{"text":"Add a system prompt rule saying the agent must never call lookup_order twice for the same order number in one conversation.","correct":false,"trap":"system-prompt-enforcement","rationale":"The model repeats the call because it never sees the data. A prompt rule against repeating would only make it give up sooner, still without the order details."},{"text":"Before each reply, have the agent review its own earlier turns and confirm that it has used every tool result it got.","correct":false,"trap":"self-review","rationale":"The same session reviewing its turns only finds \"done\" in each result. No amount of self-checking recovers data that was never appended."},{"text":"Send each tool's real output back as the tool_result, so the model can use that data on the next iteration.","correct":true,"trap":null,"rationale":"The model only knows what is in the conversation. Appending the actual tool result is what lets it use the order data instead of asking for it again."},{"text":"Add a summarizer subagent that reads each real tool result and writes a short note into the system prompt for the next request.","correct":false,"trap":"over-engineering","rationale":"This adds a second agent to work around a bug in the loop. Returning the real result in the tool_result block is the standard, simpler fix."}],"takeaway":"Append each tool's actual result to the conversation history between iterations; the model can only reason about information it can see."},{"id":"s1q11","domain":1,"ts":"1.1","type":"single","prompt":"The first version of the agent runs a fixed sequence for every ticket: get_customer, then lookup_order, then process_refund or escalate_to_human. Account issues such as a locked login have no order, so lookup_order fails and the ticket gets escalated. Tickets that mention two orders only get the first one checked. How should you restructure the agent?","options":[{"text":"Give Claude the tools and run the loop on stop_reason, so the model chooses each next tool from the request and results.","correct":true,"trap":null,"rationale":"Model-driven tool selection adapts to what each ticket needs, such as skipping lookup_order for a login issue or checking both orders in a billing case."},{"text":"Add branches to the sequence for account, billing and return tickets, each with its own fixed order of calls picked by keyword.","correct":false,"trap":"symptom-fix","rationale":"More branches patch the two failure types seen so far. The next ticket that does not fit a branch fails the same way."},{"text":"Put a classifier in front of the agent that labels each ticket's type and selects one of several prebuilt tool sequences.","correct":false,"trap":"over-engineering","rationale":"This adds a model and still forces each ticket into a fixed sequence, which is the actual cause of both failures."},{"text":"Keep the sequence, but let the loop exit early whenever the model's reply says that a step does not apply to this ticket.","correct":false,"trap":"text-signal-loops","rationale":"Parsing reply text to control the loop is unreliable, and it still cannot add the steps that a two-order ticket needs."}],"takeaway":"Let the model decide the next tool from context inside a stop_reason-driven loop instead of hard-coding one tool sequence for every request."},{"id":"s1q12","domain":1,"ts":"1.4","type":"single","prompt":"The system prompt tells the agent to confirm with lookup_order that an order belongs to the verified customer before calling process_refund on it. An evaluation of 5,000 conversations shows the agent follows this 99.4% of the time. At 40,000 conversations a month, that means about 240 conversations could refund an order nobody checked. What should you do?","options":[{"text":"Move the instruction to the top of the system prompt, mark it mandatory, and repeat it inside the process_refund tool description.","correct":false,"trap":"system-prompt-enforcement","rationale":"Stronger wording may raise 99.4% a little, but prompt instructions keep a non-zero failure rate on a financial operation."},{"text":"Add a dozen few-shot examples in which the agent checks ownership with lookup_order before every single process_refund call.","correct":false,"trap":"few-shot-overload","rationale":"Examples are still probabilistic guidance. The rule must hold on every call, so it belongs in code, not in more prompt content."},{"text":"Before each refund, have the agent reread the conversation and confirm for itself that the ownership check really happened.","correct":false,"trap":"self-review","rationale":"This asks the same model that skipped the check to notice it skipped the check. It is another prompt-level step with the same failure mode."},{"text":"Add a programmatic gate that rejects process_refund until lookup_order has returned that order for the verified customer.","correct":true,"trap":null,"rationale":"Ownership checks before money moves need deterministic compliance. A code-level gate blocks the call every time the check has not happened."}],"takeaway":"When a step must always happen before a financial action, enforce it with a programmatic prerequisite; prompt compliance always has a non-zero miss rate."},{"id":"s1q13","domain":1,"ts":"1.4","type":"single","prompt":"A customer disputes charges on two orders. The agent refunds $62 on order #7781, then finds that order #7790 needs a policy exception and calls escalate_to_human with the note \"Second order needs review.\" The human agent cannot see the conversation, assumes nothing was done, and refunds both orders, so #7781 is refunded twice. What should you change?","options":[{"text":"The full conversation transcript attached to the ticket, so the human can read every step the agent took before deciding anything.","correct":false,"trap":"symptom-fix","rationale":"A raw transcript makes the human dig for facts that the agent already knows. A structured summary states them directly."},{"text":"Require each escalation to carry the customer ID, each order's status, refunds already issued, root cause and recommended action.","correct":true,"trap":null,"rationale":"A mid-process handoff must say what is already done, what remains, why and what to do next, because the human has no transcript."},{"text":"A set of ten few-shot examples of good escalation notes added to the system prompt, showing the agent how to write handoffs.","correct":false,"trap":"few-shot-overload","rationale":"The gap is a missing handoff structure. Required fields in the escalation define it reliably; more examples only hint at it."},{"text":"Add a system prompt rule telling the agent to write detailed, thorough notes whenever it calls escalate_to_human.","correct":false,"trap":"system-prompt-enforcement","rationale":"\"Detailed\" is vague wording the agent can still satisfy while leaving out the $62 refund. Required handoff fields make the content dependable."}],"takeaway":"A mid-process escalation must carry a structured summary of customer details, actions already taken, root cause and recommended next step."},{"id":"s1q14","domain":1,"ts":"1.5","type":"single","prompt":"A hook blocks any single process_refund call above $500 and returns only the text \"Blocked.\" Since launch, logs show the agent responding to a block by splitting a $780 refund into a $450 call and a $330 call, both of which pass. In other cases it tells the customer the refund is impossible and closes the ticket. How should you change the hook?","options":[{"text":"Keep the hook as it is and add a system prompt rule that forbids splitting a single refund into several smaller process_refund calls.","correct":false,"trap":"system-prompt-enforcement","rationale":"The split is a policy violation, so it needs the same deterministic check as the limit itself. A prompt rule can still be missed."},{"text":"Lower the hook's per-call limit to $250, so that splitting a large refund takes so many calls that the agent stops trying it.","correct":false,"trap":"symptom-fix","rationale":"This blocks valid small refunds and still allows splitting. It also does nothing about the agent closing tickets after a block."},{"text":"Track the running refund total per order in the hook, and when it blocks, return a reason telling the agent to call escalate_to_human.","correct":true,"trap":null,"rationale":"Checking the cumulative total closes the splitting gap, and a clear redirect sends the agent to the right alternative workflow instead of a dead end."},{"text":"Send every blocked refund to a second Claude instance that judges whether the split was legitimate before letting it go through.","correct":false,"trap":"over-engineering","rationale":"A second model adds cost and is still probabilistic. A per-order total in the existing hook enforces the rule exactly."}],"takeaway":"Interception hooks should enforce the real policy (including cumulative totals) and redirect blocked actions to an alternative workflow such as escalation."},{"id":"s1q15","domain":1,"ts":"1.5","type":"multi","prompt":"You are reviewing several rules in the agent's system prompt. Audits show the agent breaks each one in roughly 1% to 3% of conversations. Leadership wants rules whose violation causes financial loss to hold every time, and accepts occasional misses on the rest. Which two changes should you make? Select TWO.","options":[{"text":"Greet customers by first name: a PostToolUse hook appends a reminder with the name to every get_customer result.","correct":false,"trap":"over-engineering","rationale":"A missed greeting costs nothing. Prompt guidance is enough, and a hook adds moving parts for no business need."},{"text":"Refunds only to the original payment method: a hook rejects process_refund calls with a payment method that differs.","correct":true,"trap":null,"rationale":"Refunding to a different method is a direct financial loss, so it needs a deterministic hook rather than probabilistic prompt compliance."},{"text":"Original payment method only: add few-shot examples of refunds going back to the original card, instead of a hook.","correct":false,"trap":"few-shot-overload","rationale":"Examples are still probabilistic guidance, and a refund sent to another method is a direct loss. This rule needs a hook that blocks the call."},{"text":"Leave the fraud rule in the prompt, written in capitals at the top, since fraud-flagged accounts appear in very few tickets.","correct":false,"trap":"system-prompt-enforcement","rationale":"Rare cases are exactly where prompt compliance slips, and each miss is a financial loss. Frequency does not change the need for a hook."},{"text":"No refunds on fraud-flagged accounts: a hook checks the get_customer flag and blocks process_refund, routing to a human.","correct":true,"trap":null,"rationale":"Fraud refunds lose money, so the rule must always hold. The hook blocks the call and routes the case to a person."}],"takeaway":"Use hooks for rules that must always hold, such as financial controls, and leave style preferences to prompt guidance."},{"id":"s1q16","domain":2,"ts":"2.1","type":"single","prompt":"The team added a manage_account tool with an operation parameter that accepts \"view\", \"update_email\" or \"close\", described only as \"Manages customer accounts.\" Logs show the agent passing \"close\" when customers say things like \"I'd like to close out this complaint.\" Two accounts have been closed by mistake. What is the best fix?","options":[{"text":"Add few-shot examples showing that phrases like \"close out this complaint\" mean ending the chat, not closing the account.","correct":false,"trap":"few-shot-overload","rationale":"Examples cover the phrasings you thought of. The root problem is a generic tool with a one-line description, which examples do not fix."},{"text":"Add a system prompt rule that the close operation may only be used when the customer says the exact words \"close my account\".","correct":false,"trap":"system-prompt-enforcement","rationale":"A keyword rule is brittle in both directions and leaves the vague tool design in place. Clear tool boundaries are the fix."},{"text":"Add a clarify_intent tool that the agent must call before manage_account to restate in writing what the customer wants.","correct":false,"trap":"tool-bloat","rationale":"An extra tool adds a step to every account request without making manage_account any clearer about what each operation does."},{"text":"Split it into view_account, update_account_email and close_account, each describing its inputs, outputs and when to use it.","correct":true,"trap":null,"rationale":"Purpose-specific tools with clear descriptions and contracts remove the ambiguity that let a vague phrase map to a destructive operation."}],"takeaway":"Split generic multi-purpose tools into purpose-specific tools whose descriptions state inputs, outputs and when to use each one."},{"id":"s1q17","domain":2,"ts":"2.2","type":"multi","prompt":"get_customer returns isError: true with \"Customer lookup failed\" both when the CRM times out and when a search runs but finds no matching customer. Logs show the agent retrying no-match searches three times and then telling new customers there is a system problem. During real CRM outages it says the same thing. Which two changes let the agent respond correctly? Select TWO.","options":[{"text":"On a CRM timeout, return isError: true with errorCategory \"transient\", isRetryable: true and a short description.","correct":true,"trap":null,"rationale":"Structured metadata tells the agent this is a temporary access failure that is worth retrying, not a statement about the customer."},{"text":"Have the MCP server retry every failed lookup three times before replying, so short CRM outages never reach the agent.","correct":false,"trap":"symptom-fix","rationale":"No-match searches would still come back as errors, just slower. The two cases still look identical to the agent."},{"text":"Add a system prompt rule that after two failed get_customer calls the agent tells the customer no account exists for them.","correct":false,"trap":"system-prompt-enforcement","rationale":"During an outage this would tell real customers they have no account. The agent needs a signal that separates the two cases."},{"text":"When the search runs and finds no match, return a successful empty list, not an error, so it reads as a valid answer.","correct":true,"trap":null,"rationale":"A query that ran with no matches is a valid result. Returning it as success lets the agent ask for another identifier instead of retrying."},{"text":"Add a check_crm_health tool that the agent calls before each get_customer, so it knows whether the CRM is reachable first.","correct":false,"trap":"tool-bloat","rationale":"An extra tool and call on every lookup works around the real gap: get_customer's own response does not say what happened."}],"takeaway":"Report access failures as structured, retryable errors and report searches with no matches as successful empty results, so the agent can tell them apart."},{"id":"s1q18","domain":2,"ts":"2.2","type":"single","prompt":"The process_refund MCP tool catches payment gateway exceptions and returns them as ordinary text content, such as \"Gateway error 502: refund not submitted\", without setting isError. In a sample of 400 failed refunds, the agent told 37 customers that their refund had been processed. What should you change first?","options":[{"text":"Add a system prompt rule telling the agent to read every process_refund result for the word \"error\" before confirming anything.","correct":false,"trap":"system-prompt-enforcement","rationale":"This asks the model to infer failure from free text, which is what already fails 37 times in 400. The tool should signal failure explicitly."},{"text":"Return gateway failures with isError: true and structured metadata such as errorCategory and isRetryable, not plain text.","correct":true,"trap":null,"rationale":"The isError flag is how an MCP tool tells the agent a call failed. Structured metadata then lets it choose to retry or explain."},{"text":"Add a confirm_refund tool that the agent must call after each process_refund to check whether the refund really went through.","correct":false,"trap":"tool-bloat","rationale":"An extra tool and call on every refund works around a tool that does not report its own failures. Fix the error signal instead."},{"text":"Have the agent restate each process_refund result to itself in a second message and confirm success before it replies.","correct":false,"trap":"self-review","rationale":"The same session rereading ambiguous text will often read it the same way. The failure must be marked in the tool response itself."}],"takeaway":"MCP tools must flag failures with isError and structured metadata; returning errors as normal content lets the agent treat failures as success."},{"id":"s1q19","domain":5,"ts":"5.1","type":"single","prompt":"lookup_order returns 46 fields per order, including warehouse codes, carrier scan events and tax lines. Customers asking about returns often have 8 to 12 orders, so a few lookups fill much of the context window. Later in these conversations the agent misses return-window dates it fetched earlier. Only 5 of the fields matter for returns. What is the best fix?","options":[{"text":"Add a system prompt instruction telling the agent to ignore every field in lookup_order results except the five used for returns.","correct":false,"trap":"system-prompt-enforcement","rationale":"Ignored fields still fill the context window. The instruction changes attention at best and does nothing about token use."},{"text":"Summarize the conversation every ten turns, so older lookup_order results are condensed into short prose notes as it grows.","correct":false,"trap":"symptom-fix","rationale":"Progressive summarization tends to blur exact dates and amounts, which are the facts the agent is already losing."},{"text":"Trim each lookup_order result to the return-relevant fields, such as dates, status and amount, before it enters context.","correct":true,"trap":null,"rationale":"Keeping only relevant fields stops tool results from consuming context out of proportion to their value, so key dates stay easy to find."},{"text":"Spawn a subagent for each lookup_order call that reads the raw result and writes a prose summary back into the conversation.","correct":false,"trap":"over-engineering","rationale":"A subagent per lookup adds cost and latency to do what a simple field filter on the tool output does exactly."}],"takeaway":"Trim verbose tool outputs to the fields the task needs before they accumulate in context."},{"id":"s1q20","domain":5,"ts":"5.2","type":"single","prompt":"A customer's first message reads: \"I need to update my shipping address. Please connect me with a human agent, I don't want to do this with a bot.\" Address changes are routine for the agent. Today it calls get_customer and lookup_order, then offers to make the change itself, and about half of these customers leave a negative survey. What should the agent do?","options":[{"text":"Send the message to a classifier that rates how simple the task is, and escalate only if it is too complex for the agent.","correct":false,"trap":"over-engineering","rationale":"This adds infrastructure to judge complexity, but complexity is not the trigger here. The customer explicitly asked for a person."},{"text":"Ask the agent to rate its confidence in making the change itself, and escalate only when that rating is below 7 out of 10.","correct":false,"trap":"self-review","rationale":"Self-reported confidence is a poor escalation signal, and the customer's explicit request is what matters here, not the agent's ability."},{"text":"Score the message for frustration, and escalate only if negative sentiment is high; otherwise make the address change itself.","correct":false,"trap":"sentiment-escalation","rationale":"Tone is not the trigger. The customer explicitly asked for a human, which should be honored whatever the sentiment score says."},{"text":"Honor the request at once: call escalate_to_human with a short summary, without investigating or offering to do it.","correct":true,"trap":null,"rationale":"An explicit request for a human is an escalation trigger on its own. It should be honored immediately, even when the task is simple."}],"takeaway":"Honor an explicit request for a human immediately, without first investigating or trying to resolve the issue."},{"id":"s1q21","domain":5,"ts":"5.2","type":"single","prompt":"A customer gives the name \"Maria Lopez\" and asks about a billing dispute. get_customer returns three accounts with that name in the same city. The agent currently picks the account with the most recent order and carries on. In a review of 150 cases like this, 19 were handled on the wrong account. What should you change?","options":[{"text":"Have the agent ask for another identifier, such as an email or order number, whenever get_customer returns several matches.","correct":true,"trap":null,"rationale":"Multiple matches call for clarification. One more identifier settles which account is right without guessing or a handoff."},{"text":"Change get_customer to return only its single best match, ranked by recent activity and location, so duplicates never appear.","correct":false,"trap":"symptom-fix","rationale":"This hides the ambiguity inside the tool and keeps guessing. The wrong-account cases would continue, just out of view."},{"text":"Add a ranking classifier that scores each candidate account against the conversation and selects the top match on its own.","correct":false,"trap":"over-engineering","rationale":"A classifier is still a heuristic choice between real people, built as new infrastructure. Asking the customer is simpler and certain."},{"text":"Add few-shot examples showing the agent choosing the right Maria Lopez by comparing order history with what she describes.","correct":false,"trap":"few-shot-overload","rationale":"Examples teach a better guess, but it is still a guess. The rule is to ask for more identifiers when matches are ambiguous."}],"takeaway":"When a lookup returns multiple customer matches, ask for an additional identifier instead of picking one with a heuristic."}]},{"id":"s2","title":"Code Generation with Claude Code","setup":"Your engineering team uses Claude Code daily for code generation, refactoring, debugging and documentation. The repository is a TypeScript monorepo with a shared CLAUDE.md, several custom slash commands and a few project skills. Developers work on everything from one-line fixes to multi-week migrations. You own the team's Claude Code configuration and are asked to fix workflow problems as they come up.","questions":[{"id":"s2q1","domain":3,"ts":"3.1","type":"single","prompt":"A developer who joined last week says Claude never follows the team's API error-handling conventions for her, while it does for the tech lead. Running /memory on both machines shows that the tech lead's session loads ~/.claude/CLAUDE.md, which contains those conventions. The repository's CLAUDE.md does not mention them. What is the right fix?","options":[{"text":"Add an onboarding script that copies the tech lead's ~/.claude/CLAUDE.md into each new developer's home directory on day one.","correct":false,"trap":"symptom-fix","rationale":"Copies drift as soon as the lead edits his file, and the conventions still live outside version control where nobody reviews them."},{"text":"Move the error-handling conventions into the project CLAUDE.md or a .claude/rules/ file, and commit that change to the repository.","correct":true,"trap":null,"rationale":"Team standards belong in project-level configuration that is shared through version control, so every clone loads them."},{"text":"Add the import line @~/.claude/CLAUDE.md to the repository's CLAUDE.md so that every developer's session picks up the conventions.","correct":false,"trap":"wrong-scope","rationale":"The path resolves to each developer's own home directory, so the new hire imports her own empty file, not the lead's."},{"text":"Create an /api-conventions command in .claude/commands/ that prints the conventions, and ask developers to run it when a session starts.","correct":false,"trap":"wrong-scope","rationale":"Commands are on-demand. Conventions that must apply to all API code should load automatically, not depend on someone remembering to run a command."}],"takeaway":"User-level CLAUDE.md applies only to that user, so shared standards must live in project-level configuration."},{"id":"s2q2","domain":2,"ts":"2.4","type":"single","prompt":"The team wants everyone to use the same Jira MCP server in Claude Code. A developer committed a working .mcp.json, but it contains his personal API token in plain text, and security has asked for it to be removed. Other developers still need the server to be available automatically when they clone the repository. What should you do?","options":[{"text":"Move the Jira server entry into each developer's ~/.claude.json and delete .mcp.json from the repository so tokens stay on their owners' machines.","correct":false,"trap":"wrong-scope","rationale":"User scope is for personal or experimental servers. It removes the secret but also removes the shared, automatic setup the team asked for."},{"text":"Add .mcp.json to .gitignore and post a template of the file on the team wiki so each developer can add a token and create the file locally.","correct":false,"trap":"symptom-fix","rationale":"This hides the secret by taking the config out of version control, so every developer maintains a hand-made copy that drifts."},{"text":"Build a small custom MCP server that wraps the Jira REST API and reads a shared service token from a secrets file bundled with the repository.","correct":false,"trap":"over-engineering","rationale":"A standard integration like Jira is better served by an existing server, and bundling a shared token in the repo recreates the original leak."},{"text":"Keep the server in the project .mcp.json, replace the literal token with ${JIRA_API_TOKEN}, and have each developer set that variable locally.","correct":true,"trap":null,"rationale":"Environment variable expansion in project-scoped .mcp.json keeps the shared config in the repo while each developer supplies their own credential."}],"takeaway":"Share MCP servers through project .mcp.json and keep credentials out of it with environment variable expansion."},{"id":"s2q3","domain":3,"ts":"3.4","type":"single","prompt":"You are replacing a homegrown date library with date-fns. A search shows 47 files import it, and some call sites depend on its unusual timezone handling. In an earlier attempt, output from dozens of Grep and Read calls filled the context window before any plan existed. How should you run the next attempt?","options":[{"text":"Use direct execution and migrate each file as soon as Grep finds it, so the discovery output never has to be held in context all at once.","correct":false,"trap":"wrong-scope","rationale":"A 47-file migration with timezone edge cases needs a design decision up front. Migrating file by file risks rework when a tricky call site turns up late."},{"text":"Paste the list of 47 files and their call sites into CLAUDE.md so the analysis is loaded at startup and Claude does not need to search at all.","correct":false,"trap":"symptom-fix","rationale":"This puts one-off migration data into a file loaded in every session for every developer, and it goes stale as soon as the code changes."},{"text":"Work in plan mode, hand call-site discovery to the Explore subagent so only a summary comes back, then execute the approved plan directly.","correct":true,"trap":null,"rationale":"Plan mode suits a multi-file change with design choices, and the Explore subagent keeps verbose discovery out of the main context."},{"text":"Open 47 separate sessions in direct execution, one per importing file, so that each session has a small context and cannot run out of room.","correct":false,"trap":"over-engineering","rationale":"Independent sessions cannot make a consistent decision about the timezone behavior, and coordinating 47 of them costs far more than one planned run."}],"takeaway":"Plan large multi-file changes in plan mode and isolate verbose discovery in the Explore subagent."},{"id":"s2q4","domain":3,"ts":"3.2","type":"multi","prompt":"The team's /dependency-audit skill in .claude/skills/ walks the whole monorepo and prints thousands of lines. After running it, developers notice Claude losing track of decisions made earlier in the same session. Security also wants the skill limited so that it cannot modify files or run shell commands while it runs. Which two changes meet these needs? Select TWO.","options":[{"text":"Add context: fork to the frontmatter so that the skill runs in an isolated sub-agent context and only its final result comes back.","correct":true,"trap":null,"rationale":"Forking keeps the verbose audit output out of the main conversation, which is what was crowding out earlier decisions."},{"text":"Add argument-hint to the frontmatter so developers are prompted for a package name and the audit only scans the part they name.","correct":false,"trap":"symptom-fix","rationale":"Narrower scans produce less output, but a full audit still floods the session. The output needs isolation, not just trimming."},{"text":"Add a line to the skill body telling Claude it must not edit files or run commands during the audit and should only read and report.","correct":false,"trap":"system-prompt-enforcement","rationale":"An instruction in the body is guidance the model can drift from. Security asked for a limit on what the skill can do."},{"text":"Set allowed-tools in the frontmatter to Read, Grep and Glob so the skill has no access to Edit, Write or Bash while the audit runs.","correct":true,"trap":null,"rationale":"Restricting allowed-tools limits the skill to read-only inspection while it runs, which meets the security requirement in configuration."},{"text":"Move the skill to ~/.claude/skills/ so that its output stays in a personal scope and no longer affects the shared project conversation.","correct":false,"trap":"wrong-scope","rationale":"Skill location controls who can use it, not where its output goes. It would also take the skill away from the rest of the team."}],"takeaway":"Use context: fork to isolate verbose skill output and allowed-tools to restrict what a skill can do."},{"id":"s2q5","domain":3,"ts":"3.5","type":"single","prompt":"You ask Claude Code to write normalizePhone(), which converts legacy CRM phone strings to E.164. You have rewritten the prose requirements three times, and each version still handles extensions like \"x204\" and numbers without a country code differently. What should you do next?","options":[{"text":"Give Claude three concrete input and output pairs, including one with an extension and one with no country code.","correct":true,"trap":null,"rationale":"When prose is read inconsistently, two or three concrete examples pin down the transformation far better than more description."},{"text":"Write a fuller prose specification that lists every formatting rule in priority order, with a paragraph on each edge case.","correct":false,"trap":"symptom-fix","rationale":"Three prose rewrites have already failed. A longer version of the same approach is still open to interpretation."},{"text":"Ask Claude to reread its implementation in the same session, list any inconsistencies it finds, and fix them before you look.","correct":false,"trap":"self-review","rationale":"The same session shares the reasoning that produced the inconsistency and has no reference for what correct output is."},{"text":"Collect 25 examples covering every phone format in the CRM and paste all of them into the request with the prose requirements.","correct":false,"trap":"few-shot-overload","rationale":"A few targeted examples are enough to show the ambiguous cases. Dozens add noise and invite matching instead of generalizing."}],"takeaway":"When prose requirements are interpreted inconsistently, give two or three concrete input and output examples."},{"id":"s2q6","domain":5,"ts":"5.4","type":"single","prompt":"A developer spends an afternoon in one Claude Code session mapping how payments flow through a legacy service. Early on, Claude correctly named LedgerWriter and RetryQueue as the key classes. Three hours later its answers contradict those findings and refer to \"a typical repository pattern\" instead of the classes it found. What should the developer do going forward?","options":[{"text":"Add a CLAUDE.md rule stating that answers must cite specific class names from this codebase and must not describe generic patterns.","correct":false,"trap":"system-prompt-enforcement","rationale":"The model is not choosing to be generic. It has lost the earlier findings in a long context, and a rule cannot bring them back."},{"text":"Ask Claude to check each new answer against everything it found earlier in the conversation and flag any contradictions first.","correct":false,"trap":"self-review","rationale":"The earlier findings are what has degraded, so checking against them in the same context is unreliable."},{"text":"Have Claude record key findings in a scratchpad file as it goes, and refer later questions to that file.","correct":true,"trap":null,"rationale":"A scratchpad file persists findings outside the degrading context, so later answers can rely on what was actually discovered."},{"text":"Restart the investigation in plan mode, which keeps exploration read-only and so stops findings being lost as the session grows.","correct":false,"trap":"wrong-scope","rationale":"Plan mode controls whether Claude makes changes. It does not protect findings from context degradation in a long session."}],"takeaway":"Counter context degradation in long exploration sessions by persisting key findings in a scratchpad file."},{"id":"s2q7","domain":3,"ts":"3.1","type":"single","prompt":"Your monorepo has 9 packages. The team's coding standards live in four files under docs/standards/: typescript.md, python.md, accessibility.md and data-privacy.md. Each package needs a different subset, chosen by that package's maintainers, and the standards change often. How should each package get the right standards?","options":[{"text":"In each package's CLAUDE.md, use @import to reference only the standards files its maintainers choose, so every package always pulls the current text.","correct":true,"trap":null,"rationale":"@import keeps one source of truth for each standard while letting each package include exactly the subset it needs."},{"text":"Paste the full text of all four standards files into the root CLAUDE.md, so every package always has every standard loaded whatever it does.","correct":false,"trap":"wrong-scope","rationale":"Every package then loads standards that do not apply to it, which wastes context and blurs which rules matter where."},{"text":"Copy the relevant sections of each standards file into every package's CLAUDE.md, and ask maintainers to re-copy them whenever standards change.","correct":false,"trap":"symptom-fix","rationale":"Copies drift out of date as soon as a standard changes. It works on day one but fails the \"changes often\" requirement."},{"text":"Ask each developer to add the standards they need to ~/.claude/CLAUDE.md, since they know best which packages they personally work on.","correct":false,"trap":"wrong-scope","rationale":"User-level files are not shared through version control, so teammates get inconsistent standards and maintainers lose control."}],"takeaway":"Use @import in package-level CLAUDE.md files to pull in just the shared standards each package needs from one source of truth."},{"id":"s2q8","domain":3,"ts":"3.1","type":"single","prompt":"The root CLAUDE.md has grown to 1,900 lines covering testing, API conventions, deployment and code style. Three developers edited it last week and hit merge conflicts, and people struggle to find which section governs a topic. Everything in it applies across the whole repository. What is the most maintainable way to organize it?","options":[{"text":"Move each section into the ~/.claude/CLAUDE.md of the developer who owns that topic, so edits stop colliding.","correct":false,"trap":"wrong-scope","rationale":"User-level files are not shared through version control, so every other developer would lose those standards."},{"text":"Split it into focused topic files in .claude/rules/, such as testing.md, api-conventions.md and deployment.md.","correct":true,"trap":null,"rationale":"Topic-specific rule files replace a monolithic CLAUDE.md, so each topic is easy to find and edits rarely collide."},{"text":"Turn each section into a subagent with its own system prompt that the main session consults on that topic.","correct":false,"trap":"over-engineering","rationale":"These are always-on project standards. Subagents add orchestration for a problem that is only file organization."},{"text":"Keep one file, add a table of contents at the top, and ask developers to announce edits in a team channel first.","correct":false,"trap":"symptom-fix","rationale":"A table of contents helps navigation but the file stays monolithic, so conflicts and sprawl continue."}],"takeaway":"Split a large CLAUDE.md into focused topic files in .claude/rules/ instead of keeping one monolithic file."},{"id":"s2q9","domain":3,"ts":"3.1","type":"single","prompt":"Two developers working in packages/billing get different behavior: for one, Claude always wraps money values in the team's Decimal helper, and for the other it uses plain numbers. Both have pulled the latest main branch and run the same Claude Code version. Before changing any configuration, what should you do first?","options":[{"text":"Add a line in capitals to the root CLAUDE.md stating that all money values must always use the Decimal helper.","correct":false,"trap":"system-prompt-enforcement","rationale":"This changes configuration before you know the cause, and louder wording does not explain why the two sessions differ."},{"text":"Ask Claude in each session to explain why it picked its approach, and use the answers to find the missing rule.","correct":false,"trap":"self-review","rationale":"The model's own account of its choice is not a reliable view of which files were loaded. /memory shows that directly."},{"text":"Write a script that gathers every CLAUDE.md and rules file from both machines and diffs them line by line.","correct":false,"trap":"over-engineering","rationale":"A custom script rebuilds what /memory already reports, and it may miss which files a session actually loaded."},{"text":"Run /memory in both sessions to see which memory files each one has loaded, then compare the two lists.","correct":true,"trap":null,"rationale":"/memory shows exactly which CLAUDE.md files are loaded, which is the direct way to diagnose inconsistent behavior across sessions."}],"takeaway":"Use /memory to see which memory files a session has loaded when behavior differs between developers or sessions."},{"id":"s2q10","domain":3,"ts":"3.2","type":"single","prompt":"The team's /scaffold-endpoint skill needs a route name and an HTTP method. When developers invoke it with no arguments, Claude guesses, and last week it generated a POST /items handler nobody asked for. You want developers prompted for the missing values without otherwise changing how the skill works. What should you add?","options":[{"text":"Add argument-hint to the SKILL.md frontmatter describing the route name and method the skill expects.","correct":true,"trap":null,"rationale":"argument-hint exists to prompt developers for required parameters when they invoke a skill without arguments."},{"text":"Add a line to the skill body telling Claude to refuse to scaffold anything when the route or method is missing.","correct":false,"trap":"system-prompt-enforcement","rationale":"This relies on the model following an instruction and gives developers no hint about what to pass in the first place."},{"text":"Wrap the skill in a shell script that parses arguments and will not start Claude Code until both are supplied.","correct":false,"trap":"over-engineering","rationale":"A wrapper script adds tooling outside Claude Code for a need the skill frontmatter already covers."},{"text":"Add few-shot examples of correct invocations to the skill body so developers copy the pattern next time.","correct":false,"trap":"few-shot-overload","rationale":"Examples in the skill body guide Claude, not the developer typing the command, so nothing prompts for the values."}],"takeaway":"Use argument-hint in skill frontmatter to prompt developers for required parameters when they invoke the skill without arguments."},{"id":"s2q11","domain":3,"ts":"3.2","type":"single","prompt":"Your project CLAUDE.md contains a 350-line release procedure: bump versions, update the changelog, tag and publish. Releases happen about twice a month, but the procedure loads in every session, and developers say Claude sometimes starts editing the changelog during unrelated work. What should you do with the procedure?","options":[{"text":"Move the procedure into the release manager's ~/.claude/CLAUDE.md, since one person cuts each release.","correct":false,"trap":"wrong-scope","rationale":"User-level files are not shared, so anyone else who cuts a release loses the procedure, and it would still load in every one of that person's sessions."},{"text":"Keep it in CLAUDE.md under a heading that tells Claude to apply the procedure only when cutting a release.","correct":false,"trap":"system-prompt-enforcement","rationale":"The text still loads every session and still depends on the model applying it only at the right time, which is the current failure."},{"text":"Move it into a project skill in .claude/skills/ that developers invoke when they cut a release.","correct":true,"trap":null,"rationale":"Skills are for on-demand, task-specific workflows. CLAUDE.md is for standards that should always be loaded."},{"text":"Create a dedicated release subagent with its own tool set and the full procedure in its system prompt.","correct":false,"trap":"over-engineering","rationale":"A project skill already gives on-demand loading. A custom subagent adds configuration with no extra benefit here."}],"takeaway":"Put task-specific workflows in skills that load on demand, and keep CLAUDE.md for universal standards that should always apply."},{"id":"s2q12","domain":3,"ts":"3.3","type":"multi","prompt":"Terraform conventions take up 220 lines of the root CLAUDE.md. Terraform files live in infra/ and also in a deploy/ folder inside each of 12 services. Frontend developers never touch Terraform but still load these conventions in every session. Which two changes make the conventions load only when they are needed, from one copy that is easy to maintain? Select TWO.","options":[{"text":"Create .claude/rules/terraform.md with paths: [\"**/*.tf\"] in its YAML frontmatter, and put the conventions there.","correct":true,"trap":null,"rationale":"A path-scoped rule loads only when Claude edits matching files, wherever they sit in the repository."},{"text":"Copy the conventions into a CLAUDE.md in infra/ and in each service's deploy/ folder, 13 files in total.","correct":false,"trap":"wrong-scope","rationale":"Directory-level files work per folder, so 13 copies must be kept in sync. A glob rule covers every location from one file."},{"text":"Create a Terraform subagent with the conventions in its system prompt and send all .tf edits to it.","correct":false,"trap":"over-engineering","rationale":"This adds a new agent and routing for something a single path-scoped rule file handles."},{"text":"Remove the
