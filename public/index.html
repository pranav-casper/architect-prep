 Terraform section from the root CLAUDE.md, because anything left there loads in every session.","correct":true,"trap":null,"rationale":"The root CLAUDE.md always loads. The conventions only stop costing tokens elsewhere once they are moved out of it."},{"text":"Keep the section in the root CLAUDE.md with a note telling Claude to ignore it unless it is editing .tf files.","correct":false,"trap":"system-prompt-enforcement","rationale":"The text still loads and uses tokens in every session, and the note only asks the model to disregard it."}],"takeaway":"Move file-type conventions out of the root CLAUDE.md into .claude/rules/ files with glob paths, so they load only for matching files."},{"id":"s2q13","domain":3,"ts":"3.3","type":"single","prompt":"Each of 9 packages has its own CLAUDE.md that repeats the team's SQL migration conventions, because migration files live in packages/*/migrations/. Last month someone updated the rule on reversible migrations in 4 of the copies, and new migrations in the other 5 packages still break it. What should you change?","options":[{"text":"Add a CI check that diffs the nine package CLAUDE.md files and fails the build when their migration sections differ.","correct":false,"trap":"symptom-fix","rationale":"The check catches drift after it happens but keeps nine copies to maintain. One shared rule removes the drift."},{"text":"Move the migration conventions into the root CLAUDE.md so they load for every task in every package of the repo.","correct":false,"trap":"wrong-scope","rationale":"This fixes drift but loads migration rules into every session, including work that never touches a migration."},{"text":"Add a dozen example migrations with correct down steps to each package's CLAUDE.md so Claude copies the pattern.","correct":false,"trap":"few-shot-overload","rationale":"More content in nine files makes drift worse. The problem is duplicated conventions, not a lack of examples."},{"text":"Replace the nine copies with one .claude/rules/ file whose paths frontmatter matches **/migrations/*.sql.","correct":true,"trap":null,"rationale":"A single glob-scoped rule applies to migration files in every package and loads only when they are edited."}],"takeaway":"For conventions that apply to files spread across many directories, use one path-scoped rule instead of copies in subdirectory CLAUDE.md files."},{"id":"s2q14","domain":3,"ts":"3.3","type":"single","prompt":"Your React conventions live in .claude/rules/react.md with paths: [\"packages/web/**/*\"], because packages/web was the first package to use React. Since then, packages/admin and packages/checkout have added .tsx components, and Claude does not apply the conventions when editing them. The conventions are the same for every .tsx file in the repository. What should you change?","options":[{"text":"Add a line to the root CLAUDE.md telling Claude to follow react.md whenever it edits a .tsx file in any package.","correct":false,"trap":"system-prompt-enforcement","rationale":"This asks the model to load the rule by instruction when the paths glob can load it automatically for every matching file."},{"text":"Change the paths glob to a file-type pattern such as **/*.tsx, so the rule applies to components in every package.","correct":true,"trap":null,"rationale":"Glob patterns can apply conventions to files by type regardless of directory, so one pattern covers every current and future package."},{"text":"Put a CLAUDE.md with the React conventions in packages/admin and packages/checkout, next to the existing rule.","correct":false,"trap":"wrong-scope","rationale":"Directory-level files create copies to keep in sync, and the next package with .tsx files needs yet another copy."},{"text":"Add packages/admin/**/* and packages/checkout/**/* to the paths list, next to the existing packages/web entry.","correct":false,"trap":"symptom-fix","rationale":"This patches the two packages seen so far. The rule is about a file type, so the next package with components fails the same way."}],"takeaway":"When a convention applies to a file type across the codebase, scope the rule with a file-type glob such as **/*.tsx instead of a directory path."},{"id":"s2q15","domain":3,"ts":"3.4","type":"single","prompt":"A production error report includes a stack trace pointing to line 88 of src/utils/formatInvoice.ts, where a null discount value causes a TypeError. The fix is a null check in that one function, and an existing test file covers it. A teammate proposes that every Claude Code task must start in plan mode. How should you handle this fix?","options":[{"text":"Enter plan mode to explore the invoicing module and design the change, since planning first prevents rework.","correct":false,"trap":"over-engineering","rationale":"Plan mode is for large or ambiguous changes. A one-line fix with a clear stack trace gains nothing from a design phase."},{"text":"Have the Explore subagent map every caller of formatInvoice, then decide in plan mode if a null check is safe.","correct":false,"trap":"over-engineering","rationale":"Broad discovery and planning are overhead for a well-scoped single-function fix that existing tests already cover."},{"text":"Use direct execution: ask Claude to add the null check in formatInvoice.ts and run the existing tests.","correct":true,"trap":null,"rationale":"Direct execution fits simple, well-scoped changes such as a single-file bug fix with a clear stack trace."},{"text":"Connect the error tracker's MCP server so Claude can look into the report further before it edits anything.","correct":false,"trap":"tool-bloat","rationale":"The stack trace already identifies the line and the cause. More tools add steps without changing the fix."}],"takeaway":"Use direct execution for simple, well-scoped changes such as a single-file fix with a clear stack trace; reserve plan mode for complex work."},{"id":"s2q16","domain":3,"ts":"3.4","type":"single","prompt":"You need to add inventory sync between the orders service and a supplier. One option uses the supplier's webhooks and needs a new public endpoint and a queue. The other polls the supplier's API every minute from an existing cron worker. Either way the change touches the orders, inventory and notifications packages. How should you start?","options":[{"text":"Enter plan mode to explore the three packages and compare both approaches, including what infrastructure each needs.","correct":true,"trap":null,"rationale":"Choosing between approaches with different infrastructure across several packages is the kind of decision plan mode is designed for."},{"text":"Start in direct execution with polling, since it reuses the cron worker, and switch to plan mode if problems appear.","correct":false,"trap":"symptom-fix","rationale":"The architectural choice is known up front. Waiting for problems to appear risks costly rework across three packages."},{"text":"Ask Claude to build both approaches on separate branches in direct execution and keep whichever passes tests first.","correct":false,"trap":"over-engineering","rationale":"Building both doubles the work, and passing tests first says little about which design fits the infrastructure better."},{"text":"Build the webhook version in direct execution, then ask the same session whether polling would have been better.","correct":false,"trap":"self-review","rationale":"This commits to one approach before exploring, and the session that built it is poorly placed to judge the alternative it skipped."}],"takeaway":"Use plan mode when a task involves choosing between approaches with different infrastructure needs across several packages."},{"id":"s2q17","domain":3,"ts":"3.5","type":"single","prompt":"You ask Claude Code to add a caching layer in front of a pricing service. Nobody on the team has built caching for this service before, and your request covers only the cache library and a 5-minute TTL. You suspect there are design questions you have not thought of. What should you do before implementation starts?","options":[{"text":"Have Claude implement it now, then review its own code in the same session for any design issues it missed.","correct":false,"trap":"self-review","rationale":"Reviewing after the fact in the same session tends to accept its own choices, and design gaps are cheaper to find before code exists."},{"text":"Connect MCP servers for the cache and the pricing database so Claude can inspect live data while it codes.","correct":false,"trap":"tool-bloat","rationale":"More tools give Claude data but do not surface the design decisions you have not considered."},{"text":"Paste 20 caching implementations from other projects into the request so Claude can infer the right design.","correct":false,"trap":"few-shot-overload","rationale":"A pile of other designs does not reveal this service's requirements, such as when prices change."},{"text":"Ask Claude to interview you first about issues such as cache invalidation and failure modes, then build.","correct":true,"trap":null,"rationale":"The interview pattern has Claude ask questions that surface considerations you may not have anticipated in an unfamiliar domain."}],"takeaway":"In an unfamiliar domain, use the interview pattern so Claude asks about design considerations before it implements."},{"id":"s2q18","domain":3,"ts":"3.5","type":"single","prompt":"Claude generated a retry wrapper for a payment API that sits behind a 30-second gateway timeout. Review finds three problems: the per-attempt timeout is 12 seconds, it retries 4 times, and the backoff doubles from 2 seconds. Each value can only be set correctly with the other two in mind, so the total stays under 30 seconds. How should you ask for the fix?","options":[{"text":"Fix them one at a time, starting with the timeout, and raise the next problem only after Claude finishes the last.","correct":false,"trap":"symptom-fix","rationale":"Sequential fixes suit independent issues. Here each change shifts the total time, so fixing one at a time keeps breaking the budget."},{"text":"Describe all three problems in one message along with the 30-second budget, so the values are chosen together.","correct":true,"trap":null,"rationale":"When fixes interact, a single detailed message lets Claude solve them together against the shared constraint."},{"text":"Ask the same session to review its wrapper again and keep adjusting it until it decides the wrapper is correct.","correct":false,"trap":"self-review","rationale":"The session that wrote the wrapper is poorly placed to judge it, and the 30-second constraint is never stated."},{"text":"Paste a dozen retry wrappers from other services into the request so Claude can copy the values they use.","correct":false,"trap":"few-shot-overload","rationale":"Other services have different budgets. The missing piece is the constraint linking the three values."}],"takeaway":"Give all interacting problems in one detailed message; fix problems one at a time only when they are independent."},{"id":"s2q19","domain":5,"ts":"5.4","type":"multi","prompt":"A developer is mapping the order-fulfillment flow of a large legacy service in one long Claude Code session. Grep and Read output from discovery has filled most of the context, and Claude's newer answers have started to drift. The next phase has three separate questions: which modules write to the shipments table, where retries happen, and which tests cover cancellations. Which two steps should the developer take? Select TWO.","options":[{"text":"Paste the full Grep and Read output into CLAUDE.md so that it loads at the start of every new session.","correct":false,"trap":"wrong-scope","rationale":"Raw discovery output in CLAUDE.md fills every future session with the same verbose content that caused the drift."},{"text":"Ask Claude to rerun all the discovery searches in the same session so the early findings are fresh again.","correct":false,"trap":"symptom-fix","rationale":"Repeating discovery adds even more verbose output to a context that is already nearly full."},{"text":"Run /compact to shrink the verbose discovery output in context while keeping the key findings so far.","correct":true,"trap":null,"rationale":"/compact reduces context usage when a long exploration session has filled up with verbose discovery output."},{"text":"Ask the same session to check each new answer against its earlier ones and flag any contradictions.","correct":false,"trap":"self-review","rationale":"The session is already degrading, so asking it to police its own answers relies on the context that is failing."},{"text":"Spawn a subagent for each of the three questions, so its exploration stays isolated and only a summary returns.","correct":true,"trap":null,"rationale":"Subagents keep verbose exploration out of the main context, which keeps coordinating the high-level picture."}],"takeaway":"In long explorations, use /compact to cut verbose output and delegate specific questions to subagents that return summaries."}]},{"id":"s3","title":"Multi-Agent Research System","setup":"You are building a multi-agent research system with the Claude Agent SDK. A coordinator agent delegates work through the Task tool to four subagents: web search, document analysis, synthesis and report generation. Each subagent has its own AgentDefinition with a system prompt and a restricted tool list. The system researches a topic and produces a comprehensive report with citations.","questions":[{"id":"s3q1","domain":1,"ts":"1.3","type":"single","prompt":"Reports often ignore the document analysis results, even though that subagent's output looks correct in the logs. The coordinator invokes the synthesis subagent with the prompt \"Synthesize the findings gathered so far into key themes.\" The synthesis agent's replies contain only general knowledge about the topic. What change fixes this?","options":[{"text":"Give the synthesis subagent the web search and document analysis tools so it can gather any findings it needs while it writes.","correct":false,"trap":"tool-bloat","rationale":"This duplicates work other agents have already done and invites a synthesis agent to start doing research outside its role."},{"text":"Update the synthesis AgentDefinition's system prompt to tell it to review the outputs of earlier subagents before naming themes.","correct":false,"trap":"system-prompt-enforcement","rationale":"The subagent cannot review what it was never given. Subagents do not inherit the coordinator's history."},{"text":"Have the synthesis agent reply NEED_FINDINGS when its input looks thin, and make the coordinator watch for that text and resend.","correct":false,"trap":"text-signal-loops","rationale":"Parsing free text for a control signal is brittle, and it still relies on a later resend instead of passing the data the first time."},{"text":"Pass the complete findings from the search and analysis subagents, with source metadata, directly in the synthesis Task prompt.","correct":true,"trap":null,"rationale":"Subagents start with isolated context, so the coordinator must pass prior findings explicitly in the prompt it sends."}],"takeaway":"Subagents do not inherit the coordinator's context, so pass prior findings explicitly in the Task prompt."},{"id":"s3q2","domain":1,"ts":"1.3","type":"single","prompt":"For a topic split into four independent subtopics, a research run takes about 11 minutes. Coordinator logs show one Task call per turn: it waits for the first web search subagent to finish before starting the second, and so on. The subtopics do not depend on one another. How should you cut latency?","options":[{"text":"Submit the four web search requests through the Message Batches API so they run together, then poll until all are done.","correct":false,"trap":"batch-for-blocking","rationale":"Batches have no latency guarantee and do not support multi-turn tool calling, which a search subagent needs."},{"text":"Have the coordinator emit all four Task calls in a single response so the subagents run in parallel.","correct":true,"trap":null,"rationale":"Multiple Task calls in one coordinator response start the subagents at once, which is the intended way to parallelize independent work."},{"text":"Give the coordinator the web search tools so it can run the four searches itself and skip spawning subagents.","correct":false,"trap":"tool-bloat","rationale":"This loads search work and verbose results into the coordinator's own context and erodes the separation of roles."},{"text":"Combine the four subtopics into one broad Task call so a single search subagent covers all of them in one run.","correct":false,"trap":"wrong-scope","rationale":"One agent still works through the subtopics in sequence, and a broad prompt tends to cover some of them thinly."}],"takeaway":"Spawn independent subagents in parallel by emitting multiple Task calls in one coordinator response."},{"id":"s3q3","domain":5,"ts":"5.3","type":"single","prompt":"Several reports state that \"no peer-reviewed research exists\" on subtopics where reviewers easily find papers. Logs show the document analysis subagent returns {\"status\": \"ok\", \"documents\": []} both when the repository search finds nothing and when the repository API times out. What should the subagent return instead?","options":[{"text":"On a timeout, return an error with the failure type, the query tried and any partial results, and keep ok for true empty results.","correct":true,"trap":null,"rationale":"Separating access failures from valid empty results, with context about what was tried, lets the coordinator decide whether to retry or note a gap."},{"text":"Keep returning an empty list in both cases, and have the coordinator retry any empty result three times before accepting it.","correct":false,"trap":"symptom-fix","rationale":"This wastes retries on true empty results and still cannot tell the coordinator whether a source was down."},{"text":"Raise an exception on any repository timeout so the coordinator stops the run rather than finishing with partial coverage.","correct":false,"trap":"wrong-scope","rationale":"One failed source should not end the whole workflow when other results are usable and the gap can be reported."},{"text":"Return a \"repository unavailable\" status on timeout, and tell the synthesis agent not to claim that research is absent.","correct":false,"trap":"system-prompt-enforcement","rationale":"A bare status hides what was attempted and what partial results exist, and the prompt rule only masks one symptom downstream."}],"takeaway":"Distinguish access failures from valid empty results and propagate structured error context to the coordinator."},{"id":"s3q4","domain":5,"ts":"5.6","type":"multi","prompt":"Reviewers flag two problems in recent reports. Many claims have no citation, although the search agent found a source for each one. And where two credible surveys give different adoption rates (34% and 41%), the report states one figure as fact and never mentions the other. Which two changes address these problems? Select TWO.","options":[{"text":"After drafting, have the report agent reread its own report and add a citation wherever it decides a claim lacks one.","correct":false,"trap":"self-review","rationale":"The source links were lost upstream. Rereading the draft cannot recover mappings the agent never received, and it will guess."},{"text":"When figures conflict, have the synthesis agent keep the figure from the more recent survey and drop the older one as outdated.","correct":false,"trap":"symptom-fix","rationale":"Newer is not the same as correct, and the two surveys may measure different populations. Silently dropping one still hides the conflict."},{"text":"Require subagents to return claim-source mappings with claim, excerpt, URL and publication date, and have synthesis keep them.","correct":true,"trap":null,"rationale":"Structured claim-source mappings carried through synthesis keep attribution from being lost when findings are compressed."},{"text":"Give the report agent the web search tools so it can find a source for any uncited claim after the draft has been written.","correct":false,"trap":"tool-bloat","rationale":"This gives a writing agent research tools outside its role, and it may attach a different source than the one the claim came from."},{"text":"When credible sources disagree, include both values with their sources and note the conflict rather than choosing one.","correct":true,"trap":null,"rationale":"Annotating conflicts with attribution keeps the report honest and lets readers see that the figure is contested."}],"takeaway":"Preserve claim-source mappings through synthesis and annotate conflicting figures with their sources instead of picking one."},{"id":"s3q5","domain":2,"ts":"2.1","type":"single","prompt":"The document analysis subagent has two tools: analyze_content (\"Analyzes content and returns insights\") and analyze_document (\"Analyzes a document and returns findings\"). analyze_document expects a PDF ID from the document store, and analyze_content expects raw web page text. About a third of calls send web text to analyze_document, which returns parse errors. What is the best first step?","options":[{"text":"Add five few-shot examples to the subagent's system prompt showing web text going to analyze_content and PDF IDs to analyze_document.","correct":false,"trap":"few-shot-overload","rationale":"Examples work around two near-identical descriptions instead of fixing them, and they add tokens to every call."},{"text":"Set tool_choice to force analyze_content on every turn, since web text is most of the input, and handle PDFs in a separate request.","correct":false,"trap":"wrong-scope","rationale":"Forcing one tool breaks the PDF path and moves routing out of the model into a second pipeline you now have to maintain."},{"text":"Rename analyze_content to extract_web_results and rewrite both descriptions to state each tool's inputs, outputs and when to use it.","correct":true,"trap":null,"rationale":"Tool descriptions drive selection. Clear names and descriptions that state inputs and boundaries remove the overlap at its source."},{"text":"Add a PostToolUse hook that catches parse errors from analyze_document and resends the same input to analyze_content automatically.","correct":false,"trap":"symptom-fix","rationale":"This patches each failure after it happens, adding a wasted call every time while the confusing descriptions stay in place."}],"takeaway":"Fix misrouting between similar tools by renaming them and writing descriptions that state inputs, outputs and boundaries."},{"id":"s3q6","domain":1,"ts":"1.2","type":"single","prompt":"For broad topics, reports often have thin coverage in one or two areas. The coordinator currently runs search, analysis, synthesis and report exactly once, in a fixed sequence. You want the system to close coverage gaps before the report is written. Which design should you use?","options":[{"text":"Have the report agent add a Limitations section listing areas where the evidence was thin, so readers know which parts to treat with care.","correct":false,"trap":"symptom-fix","rationale":"Disclosing gaps is useful but does nothing to close them, which is what was asked."},{"text":"Have the coordinator check the synthesis for gaps, send targeted queries back to search and analysis, and rerun synthesis until coverage is sufficient.","correct":true,"trap":null,"rationale":"An iterative refinement loop run by the coordinator finds the gaps and re-delegates with targeted queries before the report is produced."},{"text":"Have the synthesis agent end its output with COVERAGE COMPLETE when satisfied, and loop the pipeline until the coordinator sees that phrase.","correct":false,"trap":"text-signal-loops","rationale":"Loop control based on a phrase in free text is fragile, and nothing tells the search agents which gaps to target on the next pass."},{"text":"Run the full search, analysis and synthesis sequence three times for every topic and merge the three syntheses before the report step.","correct":false,"trap":"over-engineering","rationale":"Blind repetition triples cost and mostly repeats the same queries, so the thin areas are likely to stay thin."}],"takeaway":"Use a coordinator-driven refinement loop that evaluates synthesis for gaps and re-delegates targeted work."},{"id":"s3q7","domain":1,"ts":"1.3","type":"single","prompt":"You split the system into a coordinator plus search and analysis subagents, each defined with an AgentDefinition. In testing, the coordinator never delegates. It answers every research question from its own knowledge, and the logs show no subagent invocations at all, even though its system prompt clearly tells it to delegate. What is the most likely cause?","options":[{"text":"The coordinator's allowedTools does not include \"Task\", so it has no way to spawn the subagents its prompt tells it to use.","correct":true,"trap":null,"rationale":"Subagents are spawned through the Task tool. Without \"Task\" in allowedTools, delegation is impossible however the prompt is worded."},{"text":"The delegation instruction is not emphatic enough, so it should be repeated at the end of the system prompt and marked as mandatory.","correct":false,"trap":"system-prompt-enforcement","rationale":"The prompt already asks clearly. When there are zero invocations, check whether the agent has the tool before rewording the prompt."},{"text":"The subagent definitions must be copied into the coordinator's system prompt, because subagents only exist once the coordinator has read about them.","correct":false,"trap":"wrong-scope","rationale":"Subagents are configured as agent definitions, not described in prose. Pasting them into the prompt does not give the coordinator a way to call them."},{"text":"The coordinator's model is too capable, so swap it for a smaller model that is less willing to answer research questions on its own.","correct":false,"trap":"symptom-fix","rationale":"Model choice is not why there are zero subagent calls. A smaller model still cannot call a tool it was never given."}],"takeaway":"A coordinator can spawn subagents only if \"Task\" is in its allowedTools. Prompt wording cannot make up for a missing tool."},{"id":"s3q8","domain":1,"ts":"1.2","type":"multi","prompt":"Coordinator logs show two problems. A simple question such as \"When did the EU AI Act enter into force?\" still runs search, analysis, synthesis and report, taking six minutes. And the coordinator briefs subagents with long numbered procedures (\"Step 1: search Google Scholar. Step 2: open the top 3 results...\") that break when a source is unavailable. Which two changes address these? Select TWO.","options":[{"text":"Have the coordinator assess what each query needs and invoke only those subagents, rather than always running the full pipeline.","correct":true,"trap":null,"rationale":"Selecting subagents dynamically by query complexity lets simple factual questions skip the stages they do not need."},{"text":"Rewrite the subagent briefs to state the research goal and the quality bar for sources, and let each subagent decide how to meet it.","correct":true,"trap":null,"rationale":"Goals and quality criteria let subagents adapt when a source fails, where rigid step lists simply break."},{"text":"Extend each numbered procedure with fallback steps for every source that might be unavailable, such as trying Bing whenever Scholar fails.","correct":false,"trap":"symptom-fix","rationale":"This patches the procedure for failures you have already seen, and it gets longer and more brittle with every new source."},{"text":"Give every subagent the full set of search, analysis and synthesis tools, so each can work around a missing source on its own.","correct":false,"trap":"tool-bloat","rationale":"Extra tools blur each subagent's role and make tool selection less reliable. They also do nothing about the full-pipeline problem."},{"text":"Train a classifier on past queries to predict which pipeline stages each new question needs, and run it before the coordinator starts planning.","correct":false,"trap":"over-engineering","rationale":"The coordinator can already judge query complexity. A separate trained classifier is infrastructure the problem does not call for."}],"takeaway":"Coordinators should pick subagents per query and brief them with goals and quality criteria, not rigid step-by-step procedures."},{"id":"s3q9","domain":2,"ts":"2.3","type":"single","prompt":"The synthesis subagent was given the same 16 tools as the coordinator, including web_search and fetch_url. Logs show it often runs new searches mid-synthesis, pulling in unvetted sources that skip the analysis step, and it takes noticeably longer to pick each tool. What is the best change?","options":[{"text":"Limit the synthesis subagent to the few tools its role needs, and send any request for new research back through the coordinator.","correct":true,"trap":null,"rationale":"Scoping tools to the role stops cross-role misuse and makes tool selection faster and more reliable."},{"text":"Keep all 16 tools, but add a line to its prompt saying it must never run searches and should only combine the findings it is given.","correct":false,"trap":"system-prompt-enforcement","rationale":"The tools stay available, so this relies on the model ignoring them on every run. Removing the tools is the deterministic fix."},{"text":"Add a dedicated source-vetting tool to the synthesis subagent, so it can check the quality of any new sources it finds for itself.","correct":false,"trap":"tool-bloat","rationale":"This makes the subagent's toolset even larger and legitimizes the off-role searching instead of stopping it."},{"text":"Insert a separate reviewer agent after synthesis that strips any citation not found in the analysis output before the report is generated.","correct":false,"trap":"over-engineering","rationale":"A cleanup agent treats the symptom after the fact. Not giving synthesis the search tools prevents the problem."}],"takeaway":"Give each subagent only the tools its role needs. Extra tools get misused and make tool selection less reliable."},{"id":"s3q10","domain":1,"ts":"1.2","type":"multi","prompt":"For the topic \"urban heat mitigation,\" the coordinator starts three web search subagents in parallel and briefs each one with the full topic. Logs show 62% of the returned sources are duplicates across the three agents, and none of them returned any municipal policy documents, which the report needs. Which two changes to the coordinator should you make? Select TWO.","options":[{"text":"Add a deduplication subagent that compares all returned sources after the searches finish and drops the repeats before analysis.","correct":false,"trap":"over-engineering","rationale":"This pays for the duplicate work and then adds another agent to discard it, and it does nothing about the missing policy documents."},{"text":"Split the topic into distinct subtopics and give each search subagent one of them, instead of the full topic.","correct":true,"trap":null,"rationale":"Partitioning the scope by subtopic stops the agents from covering the same ground, which is the source of the 62% overlap."},{"text":"Tell each search subagent in its system prompt to avoid sources that the other two agents are likely to find for the same topic.","correct":false,"trap":"system-prompt-enforcement","rationale":"Subagents run in isolated contexts and cannot see what the others find, so the instruction gives them nothing to act on."},{"text":"Assign government and municipal policy sources to one dedicated search subagent, so that source type has a clear owner.","correct":true,"trap":null,"rationale":"Assigning a source type to a specific agent closes the policy-document gap and further reduces overlap between agents."},{"text":"Give each search subagent the document analysis tools too, so it can screen out repeated sources before it returns its results.","correct":false,"trap":"tool-bloat","rationale":"Analysis tools are outside the search role, and an agent screening its own results still cannot see the other agents' results."}],"takeaway":"Have the coordinator partition research scope across subagents by distinct subtopics or source types so their work does not overlap."},{"id":"s3q11","domain":1,"ts":"1.2","type":"single","prompt":"To cut latency, a developer let the synthesis subagent invoke the web search subagent directly whenever it wants another source. Since then, search failures reach synthesis in three different formats, the coordinator's logs no longer show which searches ran, and some reports cite sources the coordinator never saw. What should you do?","options":[{"text":"Keep the direct calls, and add a logging hook to the synthesis subagent that copies each search request into the coordinator's logs.","correct":false,"trap":"symptom-fix","rationale":"Copying logs fixes only visibility; errors are still handled inconsistently and unvetted sources still bypass the coordinator."},{"text":"Give the synthesis subagent the full set of web search tools, so it no longer has to invoke a second subagent to get new sources.","correct":false,"trap":"tool-bloat","rationale":"This gives synthesis tools outside its role and still lets new sources skip the coordinator, so the same problems remain."},{"text":"Route every request for new searches through the coordinator, so it alone dispatches subagents, handles errors and tracks sources.","correct":true,"trap":null,"rationale":"Hub-and-spoke routing through the coordinator restores observability, consistent error handling and control over which sources enter the report."},{"text":"Add a shared message queue that every subagent can publish to and read from, so any subagent can request work from any other one.","correct":false,"trap":"over-engineering","rationale":"A peer-to-peer queue spreads communication further and adds infrastructure, when routing through the existing coordinator solves the problem."}],"takeaway":"Route all subagent communication through the coordinator so errors, sources and activity stay visible and consistently handled."},{"id":"s3q12","domain":1,"ts":"1.2","type":"single","prompt":"Midway through a session, the user tells the coordinator, \"Only use sources from 2021 onward, and focus on EU regulation.\" The coordinator acknowledges this. But the search and analysis subagents it spawns afterward keep returning 2017 to 2019 sources about US rules. Their Task prompts contain only the subtopic name. What is the cause, and what is the fix?","options":[{"text":"The AgentDefinition system prompts for search and analysis are missing the limits, so add 2021 onward and EU focus to both of them.","correct":false,"trap":"wrong-scope","rationale":"These limits belong to one user request, so baking them into the permanent definitions would wrongly apply them to every future run."},{"text":"The report subagent is the last line of defense, so have it remove any source dated before 2021 or outside the EU before it writes.","correct":false,"trap":"symptom-fix","rationale":"Filtering at the end discards most of the work and leaves thin coverage; the subagents still search without knowing the constraint."},{"text":"The subagents lack shared memory, so give each one a store holding the coordinator's full conversation and have them read it first.","correct":false,"trap":"over-engineering","rationale":"A shared memory store is new infrastructure; putting the relevant constraints in the Task prompt is the direct, reliable fix."},{"text":"Subagents do not inherit the coordinator's conversation, so it must write the date and region limits into each Task prompt.","correct":true,"trap":null,"rationale":"Subagent context is isolated; the user's constraint exists only in the coordinator's history until the coordinator passes it on explicitly."}],"takeaway":"Subagents start with only what the coordinator puts in their prompt, so pass user constraints to every subagent explicitly."},{"id":"s3q13","domain":1,"ts":"1.3","type":"single","prompt":"The coordinator passes analysis results to the synthesis subagent as one block of prose that merges excerpts from 14 papers. In the final reports, about 1 in 5 citations names the wrong paper or page, even though the analysis agent sourced each excerpt correctly. What change best preserves attribution?","options":[{"text":"Have the synthesis subagent reread its draft against the prose block and fix any citation it now believes points to the wrong paper.","correct":false,"trap":"self-review","rationale":"The same agent rereading the same merged prose has no better information than it had the first time, so the errors persist."},{"text":"Pass findings as structured records that keep each excerpt's content apart from its metadata: document name, URL and page number.","correct":true,"trap":null,"rationale":"Keeping content and source metadata in separate fields lets synthesis carry each citation through intact instead of guessing it from prose."},{"text":"Add a line to the synthesis system prompt telling it to take special care to attribute each excerpt to the correct paper and page.","correct":false,"trap":"system-prompt-enforcement","rationale":"Once the metadata is blended into prose, no instruction can recover which excerpt came from which page."},{"text":"Add ten worked examples to the synthesis prompt that show excerpts in a prose block being matched back to their correct source papers.","correct":false,"trap":"few-shot-overload","rationale":"The gap is the format of the handoff, not the agent's skill; examples add tokens without restoring the lost source mapping."}],"takeaway":"When passing context between agents, use structured data that separates content from source metadata so attribution survives."},{"id":"s3q14","domain":1,"ts":"1.3","type":"single","prompt":"You are adding a fact-check subagent. It should verify draft claims against documents already in the document store, must never browse the web, and should be easy for the coordinator to choose for claim-checking work. Today the coordinator spawns a generic subagent and pastes fact-check instructions into each Task prompt. What is the best setup?","options":[{"text":"Create a fact-check AgentDefinition with a clear description, its own system prompt and only the document store tools.","correct":true,"trap":null,"rationale":"An AgentDefinition holds the description, system prompt and tool restrictions for a subagent type, so the role is defined once and enforced."},{"text":"Keep the generic subagent with every tool, and add a line to each Task prompt saying it must never browse the web while it checks.","correct":false,"trap":"system-prompt-enforcement","rationale":"A prompt line is guidance only; leaving web tools available means the \"never browse\" rule can still be broken."},{"text":"Give the coordinator the document store tools and have it check each claim itself, so that no extra subagent type is needed.","correct":false,"trap":"tool-bloat","rationale":"This loads the coordinator with tools outside its orchestration role and mixes verification work into its own context."},{"text":"Run fact-checking as a separate service with its own model deployment, and call it over HTTP after each report is generated.","correct":false,"trap":"over-engineering","rationale":"A new service is far more than needed; the Agent SDK already supports a dedicated subagent type for this role."}],"takeaway":"Define each subagent type with an AgentDefinition that sets its description, system prompt and restricted tool list."},{"id":"s3q15","domain":1,"ts":"1.6","type":"single","prompt":"The system now handles two workloads. A weekly competitor brief always covers the same four aspects (pricing, product launches, hiring and funding) for each of 12 tracked companies. Ad hoc requests are open-ended, such as \"why did battery recycling startups struggle in 2024?\", where each finding shapes what to look at next. Which decomposition should you use?","options":[{"text":"Dynamic decomposition for both, with the coordinator inventing a fresh plan for every tracked company in the weekly brief each week.","correct":false,"trap":"over-engineering","rationale":"Replanning a fixed, repeated structure every week adds cost and variation with no benefit, since the four aspects never change."},{"text":"One general prompt for both workloads, with many example briefs and investigations attached so the model infers the structure.","correct":false,"trap":"few-shot-overload","rationale":"The real gap is choosing the right decomposition pattern; piling on examples does not give either workload the structure it needs."},{"text":"A fixed prompt chain, one step per aspect, for the weekly brief, and dynamic decomposition that adapts to findings for ad hoc work.","correct":true,"trap":null,"rationale":"Prompt chaining suits predictable multi-aspect work, while open-ended investigation needs subtasks generated from what each step discovers."},{"text":"One long pass for each request, after which the same session reviews its own output for missed aspects and fills them in at the end.","correct":false,"trap":"self-review","rationale":"A single pass dilutes attention, and the same session checking its own work tends to miss the gaps it already overlooked."}],"takeaway":"Use prompt chaining for predictable multi-aspect tasks and dynamic, adaptive decomposition for open-ended investigations."},{"id":"s3q16","domain":2,"ts":"2.1","type":"single","prompt":"The document analysis subagent has one tool, analyze_document, described as \"Analyzes a document.\" The coordinator uses it for three jobs: pulling statistics from a paper, summarizing a paper, and checking whether a paper supports a specific claim. Outputs come back in a different shape on each call, and claim checks often return a summary instead of a verdict with evidence. What should you do?","options":[{"text":"Keep analyze_document, and add eight examples to its description showing the output expected for statistics, summaries and checks.","correct":false,"trap":"few-shot-overload","rationale":"One tool still serves three different contracts; examples add length without giving any job a defined input and output."},{"text":"Keep analyze_document, and tell the coordinator in its system prompt to say clearly in each call which of the three jobs it wants.","correct":false,"trap":"system-prompt-enforcement","rationale":"Asking for clearer requests still relies on prompt wording, and the generic tool has no contract that guarantees the matching output shape."},{"text":"Put a classifier in front of analyze_document that predicts which job each request needs and reshapes the output to match it.","correct":false,"trap":"over-engineering","rationale":"A classifier adds a model and a failure point to work around a tool that should simply be split into clear purposes."},{"text":"Split it into extract_data_points, summarize_content and verify_claim_against_source, each with a clear description and contract.","correct":true,"trap":null,"rationale":"Purpose-specific tools with defined input and output contracts make each job explicit, so outputs are consistent and claim checks return verdicts."}],"takeaway":"Split a generic tool into purpose-specific tools with clear descriptions and defined input and output contracts."},{"id":"s3q17","domain":2,"ts":"2.2","type":"single","prompt":"The web search subagent's fetch_page MCP tool returns isError: true with the text \"Fetch failed\" for every problem. Logs show the agent retrying paywalled pages that return 403 up to five times each, while it gives up on pages that timed out once and would likely load on a second try. What change should you make to fetch_page?","options":[{"text":"Keep the generic message, and cap the subagent at one retry per page so paywalled pages stop using up five attempts each.","correct":false,"trap":"symptom-fix","rationale":"A blanket cap cuts wasted paywall retries but still treats timeouts and permission errors the same, so recoverable pages are still lost."},{"text":"Return structured error metadata: an errorCategory such as transient or permission, an isRetryable flag and a description.","correct":true,"trap":null,"rationale":"Categorized errors with a retryable flag let the agent retry timeouts and stop retrying permission failures such as paywalls."},{"text":"Keep the generic message, and have the subagent's system prompt tell it to guess from each URL whether a page is likely paywalled.","correct":false,"trap":"system-prompt-enforcement","rationale":"Guessing from URLs is unreliable; the tool knows the actual failure type and should report it rather than leave the agent to infer it."},{"text":"Add an error-triage subagent that reads each failure message and decides whether the web search subagent should retry the page.","correct":false,"trap":"over-engineering","rationale":"A triage agent adds a hop and still sees only \"Fetch failed,\" so it has no more information than the search agent had."}],"takeaway":"Return structured MCP errors with a category and retryable flag so the agent can choose the right recovery for each failure."},{"id":"s3q18","domain":2,"ts":"2.3","type":"single","prompt":"The document analysis subagent has a generic fetch_url tool so it can load the document store links that the coordinator passes in. Logs show it also follows links inside those PDFs to blogs and news sites, and then analyzes that unvetted content as if it were one of the source documents. What is the best change?","options":[{"text":"Replace fetch_url with a load_document tool that accepts only validated document store URLs and rejects every other address.","correct":true,"trap":null,"rationale":"A constrained tool matched to the role makes off-scope fetching impossible, instead of hoping the agent avoids it."},{"text":"Keep fetch_url, and add a rule to the subagent's system prompt that it may only open links pointing at the document store.","correct":false,"trap":"system-prompt-enforcement","rationale":"A prompt rule leaves the generic capability in place, so the agent can still follow outside links some of the time."},{"text":"Keep fetch_url, and add a classify_source tool so the subagent can judge whether each linked page is credible enough to analyze.","correct":false,"trap":"tool-bloat","rationale":"This adds another tool and widens the role, while the generic fetch that causes the problem stays available."},{"text":"Have the subagent review its own analysis at the end and delete any findings that came from pages outside the document store.","correct":false,"trap":"self-review","rationale":"The same agent that pulled in the outside pages is asked to catch them afterward, which is unreliable and wastes the work."}],"takeaway":"Replace generic tools with constrained alternatives that only accept the inputs a subagent's role requires."},{"id":"s3q19","domain":2,"ts":"2.3","type":"single","prompt":"Before it uses enrichment tools such as lookup_citations and fetch_author_profile, the document analysis subagent must call extract_metadata on each new PDF. In 9% of runs it skips extract_metadata and enriches using a guessed title, which attaches citations to the wrong paper. How should you configure the request?","options":[{"text":"Force tool_choice to extract_metadata on every turn of the subagent, so that the metadata call can never be skipped at any point.","correct":false,"trap":"wrong-scope","rationale":"This applies the forced choice at the wrong scope: forcing it on every turn means the enrichment tools can never be called, so the subagent cannot finish its job."},{"text":"Add a rule in bold to the subagent's system prompt stating that extract_metadata must always be the very first tool it calls.","correct":false,"trap":"system-prompt-enforcement","rationale":"Prompt wording lowers the skip rate but cannot guarantee the order, and the 9% of failures attach wrong citations."},{"text":"Force the first call with tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"}, then let later turns use enrichment tools.","correct":true,"trap":null,"rationale":"Forced tool selection guarantees extract_metadata runs first, and the follow-up turns remain free to call the enrichment tools."},{"text":"Add six examples to the system prompt showing extract_metadata called on a new PDF before lookup_citations or any other tool.","correct":false,"trap":"few-shot-overload","rationale":"Examples still leave the order to the model's choice; a forced tool_choice makes it deterministic."}],"takeaway":"Use forced tool_choice to guarantee a specific tool runs first, then handle the remaining steps in follow-up turns."},{"id":"s3q20","domain":5,"ts":"5.3","type":"single","prompt":"The web search subagent reports every failed request to the coordinator immediately, including brief 503 errors that succeed on a second try. On busy days the coordinator re-plans dozens of times per run, and a run that used to take 8 minutes now takes 25. What should the web search subagent do instead?","options":[{"text":"Send any failed searches to the Message Batches API for a retry, and let the coordinator collect results once the batch completes.","correct":false,"trap":"batch-for-blocking","rationale":"The run is waiting on these results, and batches can take up to 24 hours with no latency guarantee."},{"text":"Add a monitoring agent that tracks search API health and pauses the entire research run whenever the error rate passes 5%.","correct":false,"trap":"over-engineering","rationale":"This adds an agent and still halts work over failures that a simple local retry would have resolved."},{"text":"Return each failed search as an empty result marked successful, so the coordinator re-plans only when a search finds something.","correct":false,"trap":"symptom-fix","rationale":"This silently hides real failures as \"no results,\" so the coordinator can never recover the coverage that was lost."},{"text":"Retry transient failures itself, and escalate only errors it cannot resolve, with what it tried and any partial results.","correct":true,"trap":null,"rationale":"Local recovery absorbs brief outages, and the coordinator only sees failures that need its decision, with the context to make it."}],"takeaway":"Subagents should recover locally from transient failures and propagate only unresolved errors, with attempts and partial results."},{"id":"s3q21","domain":5,"ts":"5.3","type":"multi","prompt":"The patent database was offline for an entire run. The patent subagent raised an exception, and the coordinator's top-level handler aborted the whole run, discarding 40 minutes of finished search and analysis on the other five subtopics. You want runs to finish while staying honest about what is missing. Which two changes should you make? Select TWO.","options":[{"text":"Have the patent subagent return structured error context with the failure type, the query tried and any partial results.","correct":true,"trap":null,"rationale":"Structured error context lets the coordinator keep the other subtopics and decide how to handle the missing one, instead of aborting."},{"text":"Have the patent subagent return an empty result marked as successful, so the coordinator completes the run and ships the report.","correct":false,"trap":"symptom-fix","rationale":"This finishes the run by hiding the failure, so the report reads as complete when patent coverage is actually missing."},{"text":"Requeue the patent subtopic through the Message Batches API, and hold the finished report until that batch result comes back.","correct":false,"trap":"batch-for-blocking","rationale":"The report is blocked on a batch with no latency guarantee, and the database may still be offline when it runs."},{"text":"Have the report subagent reread its finished report and decide on its own whether any sections look thin enough to need a warning.","correct":false,"trap":"self-review","rationale":"The report agent was never told the source failed, so judging its own output it cannot reliably identify the real gap."},{"text":"Have the synthesis output mark which findings are well supported and which topic areas have gaps due to an unavailable source.","correct":true,"trap":null,"rationale":"Coverage annotations tell readers exactly where the report is thin because a source could not be reached."}],"takeaway":"Neither abort on a single failure nor hide it: propagate structured errors and annotate coverage gaps in the synthesis."}]},{"id":"s4","title":"Developer Productivity with Claude","setup":"Your platform team is building an internal developer assistant with the Claude Agent SDK. Engineers use it to explore unfamiliar repositories, understand a 15-year-old billing monolith, generate service boilerplate, and automate repetitive chores. The agent uses the built-in Read, Write, Edit, Bash, Grep and Glob tools and connects to several MCP servers, including an internal code-search server and the team's Jira instance. Sessions often run for hours across large codebases.","questions":[{"id":"s4q1","domain":2,"ts":"2.5","type":"single","prompt":"An engineer asks the agent to find every caller of the deprecated function formatLegacyDate before removing it. The function is also re-exported under two other names from utils/index.ts and shared/dates.ts. Session logs show the agent ran Glob on **/*.ts, then called Read on 212 files one after another until the context window filled, and it still missed callers that used the re-exported names. What is the most effective change to this exploration strategy?","options":[{"text":"Run /compact automatically after every 25 Read calls so the agent can work through all 212 files without filling the context window before it reaches the callers.","correct":false,"trap":"symptom-fix","rationale":"Compaction frees space but keeps the read-everything strategy. The agent still has no reason to look for the re-exported names, so the missed callers stay missed."},{"text":"Build an MCP server that parses the repository into an AST call graph and exposes a find_callers tool, so the agent no longer opens files to locate usages.","correct":false,"trap":"over-engineering","rationale":"A call-graph service could work eventually, but it is a large build for a problem the built-in tools already solve when used in the right order."},{"text":"Grep for formatLegacyDate to find where it is defined and re-exported, collect each exported alias, then Grep for every alias and Read only the matching files.","correct":true,"trap":null,"rationale":"Grep finds content such as function names, and tracing wrapper modules means first finding every exported name and then searching for each one. Reading only the matches keeps context small."},{"text":"Add a system prompt rule limiting the agent to 30 Read calls per task and telling it to open files whose names contain date or format before any others.","correct":false,"trap":"system-prompt-enforcement","rationale":"A prose cap is followed only probabilistically, and filename guessing has nothing to do with where callers live. Aliased callers in unrelated files would still be missed."}],"takeaway":"Build codebase understanding incrementally with Grep for content and Read for follow-up, and trace re-exports by searching for each exported name."},{"id":"s4q2","domain":2,"ts":"2.4","type":"single","prompt":"The team added an MCP server that exposes search_symbols. It queries a precomputed index covering 31 repositories and returns definitions, references, and the owning service for any symbol. Its description reads \"Searches code.\" Traces show the agent uses the built-in Grep for 90% of symbol lookups, which misses references in the 30 repositories that are not checked out locally. What should you change first?","options":[{"text":"Rewrite the search_symbols description to say it covers all 31 indexed repositories, returns definitions and references with owning service, and suits symbol lookups better than Grep.","correct":true,"trap":null,"rationale":"Tool descriptions are the main signal the model uses to choose tools. A two-word description gives it no reason to prefer the MCP tool over a familiar built-in one."},{"text":"Remove Grep from the agent's allowedTools so that search_symbols becomes the only search option available whenever the agent needs to locate a function, class, or constant.","correct":false,"trap":"wrong-scope","rationale":"Grep is still the right tool for error strings, config values, and local content. Taking it away fixes one routing problem by breaking many legitimate uses."},{"text":"Add six few-shot examples to the system prompt showing symbol lookups routed to search_symbols, covering functions, classes, constants, and imports that cross service boundaries.","correct":false,"trap":"few-shot-overload","rationale":"Examples add tokens and patch selection for the cases shown, but the underlying gap is that the tool's description never explains what it can do."},{"text":"Add a PreToolUse hook that inspects each Grep pattern and rewrites the call to search_symbols whenever the pattern looks like an identifier rather than free text.","correct":false,"trap":"over-engineering","rationale":"Silently rewriting calls adds brittle pattern logic and hides the agent's real choices. Improving the description is the low-effort first step."}],"takeaway":"When an agent prefers a built-in tool over a more capable MCP tool, enrich the MCP tool's description before adding routing machinery."},{"id":"s4q3","domain":2,"ts":"2.4","type":"multi","prompt":"Every engineer's agent sessions should use the community Jira MCP server, authenticated with that engineer's own API token. Separately, one staff engineer wants to trial an experimental MCP server she wrote for querying profiling data on her laptop. Which configuration choices are appropriate? Select TWO.","options":[{"text":"Write a custom Jira MCP server in-house so the team controls the tool names and descriptions, and register it in the project .mcp.json alongside the code-search server.","correct":false,"trap":"over-engineering","rationale":"Jira is a standard integration with an existing community server. Custom servers are worth building for team-specific workflows, not to rename tools."},{"text":"Add the community Jira server to the project .mcp.json committed to the repository and reference the credential as ${JIRA_API_TOKEN} so each engineer supplies their own.","correct":true,"trap":null,"rationale":"Project-scoped .mcp.json shares the server through version control, and environment variable expansion keeps each engineer's token out of the repository."},{"text":"Have each engineer add the Jira server to their own ~/.claude.json, and paste the exact configuration block into the project CLAUDE.md so new hires can copy it.","correct":false,"trap":"wrong-scope","rationale":"User-level config is not shared through version control, so copies drift. CLAUDE.md holds instructions for Claude, not a distribution channel for server configuration."},{"text":"Register the experimental profiling server in the project .mcp.json too, so its tools are discovered at connection time and any teammate can try them when needed.","correct":false,"trap":"tool-bloat","rationale":"All configured servers' tools are loaded at once, so every teammate's agent gets extra tools it does not need, and they point at data that only exists on one laptop."},{"text":"Have the staff engineer register her experimental profiling server in her user-level ~/.claude.json so it is available in her sessions without touching shared config.","correct":true,"trap":null,"rationale":"User-scoped ~/.claude.json is the place for personal or experimental servers. It affects only her sessions and keeps the team's tool set unchanged."}],"takeaway":"Shared servers go in project .mcp.json with environment variable expansion for secrets, and personal or experimental servers go in ~/.claude.json."},{"id":"s4q4","domain":1,"ts":"1.7","type":"single","prompt":"Yesterday an engineer ran a long investigation of the legacy billing module in a session named billing-audit. The agent read 40 files and built a detailed map of the invoice flow. This morning a teammate merged a refactor that changed 3 of those 40 files. The engineer wants to continue the investigation today. What is the best approach?","options":[{"text":"Start a new session and have the agent re-read all 40 files from scratch, because any resumed context could hold tool results that no longer match the code on disk.","correct":false,"trap":"over-engineering","rationale":"Fresh starts make sense when most prior results are stale. Here 37 of 40 files are unchanged, so full re-exploration throws away valid work."},{"text":"Resume with --resume billing-audit and carry on as before, since the agent will see the new contents of the changed files whenever it next reads them during exploration.","correct":false,"trap":"symptom-fix","rationale":"The agent will keep reasoning from its earlier reads of those three files and has no reason to re-open them. Stale results quietly shape its conclusions."},{"text":"Use fork_session on billing-audit to create a branch for the refactored code, keeping the original branch available to compare against the pre-refactor behavior.","correct":false,"trap":"wrong-scope","rationale":"Forking creates divergent branches from a shared baseline for exploring alternatives. It does not tell either branch that files changed underneath it."},{"text":"Resume with --resume billing-audit and tell the agent which three files the refactor changed, so it re-reads and re-analyzes those files before it continues the investigation.","correct":true,"trap":null,"rationale":"Most prior context is still valid, so resuming is efficient. Naming the changed files gives the agent a targeted re-analysis instead of a full re-exploration."}],"takeaway":"Resume when prior context is mostly valid and tell the agent exactly which files changed, and start fresh with a summary only when most results are stale."},{"id":"s4q5","domain":3,"ts":"3.2","type":"single","prompt":"Engineers invoke a project skill, /map-service, that walks a service directory and prints an inventory of every module, class, and dependency. It often produces around 15,000 tokens of output. Engineers report that after running it, the rest of the session gets slower and the agent starts mixing inventory details into answers about their actual task. What change best addresses this?","options":[{"text":"Move the skill's instructions into the project CLAUDE.md so the mapping guidance loads at session start and engineers no longer need to invoke a separate skill to get it.","correct":false,"trap":"wrong-scope","rationale":"CLAUDE.md loads in every session, so this adds context to every session and still produces the verbose inventory in the main conversation."},{"text":"Add context: fork to the skill's SKILL.md frontmatter so the mapping runs in an isolated sub-agent context and only its final summary is returned to the main session.","correct":true,"trap":null,"rationale":"context: fork runs the skill in its own sub-agent context, so the 15,000 tokens of discovery output stay out of the main conversation."},{"text":"Add allowed-tools: Read, Glob to the skill's frontmatter so the mapping cannot invoke Bash or Grep and therefore produces a smaller, more focused service inventory.","correct":false,"trap":"wrong-scope","rationale":"allowed-tools restricts what the skill may do, which is useful for safety. It does not isolate output, and a Read-and-Glob inventory can be just as long."},{"text":"Have engineers run /compact right after each /map-service invocation so the verbose inventory is condensed before they continue working on their actual task.","correct":false,"trap":"symptom-fix","rationale":"Compaction is a manual cleanup step after the damage is done, and it can blur details the engineer needs. Isolating the skill avoids the pollution in the first place."}],"takeaway":"Use context: fork for skills that produce verbose or exploratory output so it does not pollute the main conversation."},{"id":"s4q6","domain":5,"ts":"5.4","type":"single","prompt":"Three hours into exploring a legacy order-management codebase, the agent answers a question about retry behavior by describing \"typical patterns in services like this\" instead of the RetryPolicyRegistry and BackoffScheduler classes it found and analyzed in the first hour. Its earlier answers were specific and correct. What is the most effective change for long exploration sessions like this one?","options":[{"text":"Add a system prompt instruction reminding the agent to name the specific classes it discovered earlier and to avoid generic descriptions when it answers codebase questions.","correct":false,"trap":"system-prompt-enforcement","rationale":"An instruction cannot bring back details that have degraded in a long context. The agent would follow it by naming whatever it still recalls, which may be wrong."},{"text":"Increase max_tokens on each request so the agent has room to include the specific class details it discovered earlier when it writes long answers late in the session.","correct":false,"trap":"symptom-fix","rationale":"max_tokens limits the length of the response. It has no effect on how well the model retains findings from hours earlier in the context."},{"text":"Have the agent record key findings in a scratchpad file as it explores, and have it read that file back before answering later questions.","correct":true,"trap":null,"rationale":"Scratchpad files persist findings outside the degrading context, so later answers can draw on the exact classes discovered earlier."},{"text":"Restart the session every 45 minutes and have the agent re-explore the codebase from the beginning, so its context is never older than the latest exploration pass.","correct":false,"trap":"over-engineering","rationale":"This discards hours of valid work and repeats the most expensive phase. Persisting findings is far cheaper than repeated full exploration."}],"takeaway":"Counter context degradation in long exploration sessions by persisting key findings to a scratchpad file the agent re-reads."},{"id":"s4q7","domain":1,"ts":"1.6","type":"single","prompt":"An engineer asks the agent to \"add comprehensive tests to this legacy payments service.\" The service has 220 files, almost no tests, and dependencies nobody has documented. Which approach should the agent take?","options":[{"text":"Map the structure first, find the highest-impact areas such as money movement, then build a prioritized test plan it updates as it discovers dependencies.","correct":true,"trap":null,"rationale":"Open-ended tasks call for adaptive decomposition: understand the structure, prioritize by impact, and revise the plan as new facts appear."},{"text":"Read all 220 files into context before writing anything, so the agent has a complete picture of the service from the very start.","correct":false,"trap":"wrong-scope","rationale":"Loading everything at once floods the context and dilutes attention. Exploration should start from entry points and go deeper as needed."},{"text":"Write tests for whatever it reads first, then ask itself in the same session at the end whether the coverage looks comprehensive enough.","correct":false,"trap":"self-review","rationale":"Without a plan, coverage follows reading order rather than risk, and the same session is a poor judge of its own gaps."},{"text":"Spin up one subagent per directory to write tests in parallel, each following the same fixed checklist, and merge all the results at the end.","correct":false,"trap":"over-engineering","rationale":"A fixed fan-out ignores where the risk actually is and what each directory depends on. It is machinery in place of investigation."}],"takeaway":"For open-ended work, decompose adaptively: map the structure, prioritize by impact, and update the plan as you learn more."},{"id":"s4q8","domain":1,"ts":"1.7","type":"single","prompt":"After a two-hour session analyzing a legacy reporting module, an engineer wants to compare two refactoring approaches: extracting a service layer, or splitting the module into smaller packages. Both attempts should start from the same analysis, and neither should influence the other. What should the engineer do?","options":[{"text":"Use fork_session to create two branches from the current analysis session, and try one refactoring approach in each branch.","correct":true,"trap":null,"rationale":"Forking gives both attempts the same analysis baseline while keeping their changes and reasoning fully separate."},{"text":"Try the first approach in the current session, then tell it to \"undo all of that\" and attempt the second approach in the same conversation.","correct":false,"trap":"wrong-scope","rationale":"The second attempt inherits the first attempt's reasoning and edits, so the comparison is no longer independent."},{"text":"Start two fresh sessions, and have each one repeat the full two-hour analysis of the module before it begins its refactoring attempt.","correct":false,"trap":"over-engineering","rationale":"This throws away the shared baseline and doubles the work, and the two analyses may not even match."},{"text":"Ask the current session to describe both approaches in prose and choose the better one itself, without trying either refactor on the code.","correct":false,"trap":"self-review","rationale":"A prose comparison by the session that holds the context replaces real evidence with its own opinion."}],"takeaway":"Use fork_session to explore divergent approaches from one shared baseline without the branches influencing each other."},{"id":"s4q9","domain":2,"ts":"2.4","type":"single","prompt":"Engineers ask the agent questions like \"which service owns the invoices table?\" The internal MCP server offers a run_sql tool, and the agent spends 6 to 10 calls per question listing schemas and tables before it can answer. What is the most effective improvement?","options":[{"text":"Expose the database schema catalog as an MCP resource, so the agent can see which tables and owners exist without making exploratory calls.","correct":true,"trap":null,"rationale":"MCP resources are made for content catalogs. The agent can read what exists up front instead of discovering it one query at a time."},{"text":"Add a dozen example conversations to the system prompt showing the exact sequence of run_sql calls to make for common ownership questions.","correct":false,"trap":"few-shot-overload","rationale":"Examples make the exploration more consistent but do not remove it, and they cost tokens on every request."},{"text":"Add separate list_schemas, list_tables, describe_table and find_owner tools, so each exploration step has its own dedicated tool.","correct":false,"trap":"tool-bloat","rationale":"More tools reshape the same exploratory calls rather than removing them, and they make tool selection harder."},{"text":"Cap the agent at three run_sql calls per question, so that it is forced to guess the owning service sooner instead of exploring first.","correct":false,"trap":"symptom-fix","rationale":"A cap trades slow answers for wrong ones. The agent still lacks the catalog it needs to answer directly."}],"takeaway":"Use MCP resources to expose catalogs like schemas or docs, so agents can see what exists without exploratory tool calls."},{"id":"s4q10","domain":1,"ts":"1.1","type":"single","prompt":"A chore-automation agent built on the Agent SDK renames a config key across a repository. Your loop code sends Claude only the system prompt, the original task and the most recent tool result on each iteration. Logs show the agent repeating Grep calls it already ran and re-editing files it already changed. What should you fix in the loop?","options":[{"text":"Set an iteration cap of 15, so the agent is stopped before it has a chance to repeat old Grep calls or re-edit changed files.","correct":false,"trap":"symptom-fix","rationale":"An arbitrary cap hides the repetition by cutting runs short, and it can stop the agent before the rename is finished."},{"text":"Append each tool_use turn and its tool_result to the message history, and send the full history on every iteration.","correct":true,"trap":null,"rationale":"The model can only reason about earlier actions it can see, so each tool call and result must stay in the conversation history."},{"text":"Add a system prompt rule telling the agent to remember which files it has edited and never repeat a Grep it already ran.","correct":false,"trap":"system-prompt-enforcement","rationale":"The agent cannot remember actions that are no longer in its context; the instruction asks for information the loop discards."},{"text":"Keep sending the trimmed messages, and stop the loop as soon as the agent's reply text says it has finished the rename.","correct":false,"trap":"text-signal-loops","rationale":"This leaves the missing history unfixed and ends the loop on wording instead of on stop_reason \"end_turn\"."}],"takeaway":"Append every tool result to the conversation history between iterations so the model can reason about what it has already done."},{"id":"s4q11","domain":1,"ts":"1.6","type":"single","prompt":"An engineer asks the agent why about 0.3% of monthly invoices are charged twice. Before reading any code, the agent writes a fixed ten-step plan covering the invoice generator. Step 2 shows the duplicates come from a retry in the payment gateway client, which the plan never mentions, but the agent keeps working through steps 3 to 10 on the generator. How should the agent approach investigations like this?","options":[{"text":"Spawn one subagent per billing package to hunt for double-charge causes in parallel, then merge whatever each of them reports back.","correct":false,"trap":"over-engineering","rationale":"A fixed fan-out spends effort on every package instead of following the lead that step 2 already found."},{"text":"Add five example plans from past billing incidents to the prompt, so the upfront plan the agent writes covers more of the modules.","correct":false,"trap":"few-shot-overload","rationale":"A better fixed plan is still fixed; the gap is that the plan does not change when a finding points somewhere new."},{"text":"Finish the fixed plan, then have the same session review its conclusions and list any modules that it thinks it may have missed.","correct":false,"trap":"self-review","rationale":"The session already ignored the gateway lead once, and reviewing its own conclusions is unlikely to reverse that."},{"text":"Generate the next subtasks from each finding, and revise the plan when a step points somewhere new, such as the gateway client.","correct":true,"trap":null,"rationale":"Open-ended investigations need an adaptive plan that creates subtasks from what each step discovers, so the gateway retry becomes the next focus."}],"takeaway":"For open-ended investigations, use an adaptive plan that generates subtasks from each finding instead of a fixed upfront sequence."},{"id":"s4q12","domain":1,"ts":"1.7","type":"single","prompt":"An engineer is running two long investigations this week, one into the tax engine and one into the refund batch job. Each morning she opens a new session and spends 20 minutes re-explaining the previous day's findings, because she has no reliable way to get back to the right conversation. What should she do?","options":[{"text":"Give each investigation a named session, such as tax-engine and refund-batch, and continue each one with --resume and its name.","correct":true,"trap":null,"rationale":"Named sessions with --resume return her to the exact prior conversation for each investigation, with its context intact."},{"text":"Run both investigations in a single long session, so the findings from both stay together and there is one conversation to reopen.","correct":false,"trap":"wrong-scope","rationale":"Mixing two investigations in one context makes each one noisier, and it still leaves her without a clean way to resume either."},{"text":"Paste each day's findings into the project CLAUDE.md, so that every session in the repository loads both investigations at startup.","correct":false,"trap":"wrong-scope","rationale":"Personal, in-progress notes do not belong in shared project config, where they load into every teammate's sessions."},{"text":"Build an MCP server that stores each day's transcript and exposes a load_investigation tool to the next morning's new session.","correct":false,"trap":"over-engineering","rationale":"This rebuilds session resumption as custom infrastructure, when --resume with a session name already does it."}],"takeaway":"Name long-running sessions and use --resume with the session name to continue a specific investigation later."},{"id":"s4q13","domain":1,"ts":"1.7","type":"single","prompt":"An engineer resumes yesterday's refund-batch session, in which the agent read 60 files. Six commits landed overnight, and she does not know which of those 60 files they touched, though most of the module is untouched. The prior analysis is still largely valid. What should she do before continuing the investigation?","options":[{"text":"Tell the resumed session that some code changed overnight, and let it decide for itself when a file seems worth re-reading.","correct":false,"trap":"symptom-fix","rationale":"A vague warning does not say which earlier results are stale, so the agent keeps reasoning from old reads of the changed files."},{"text":"Use git diff --name-only since yesterday, then tell the resumed session exactly which files changed so it re-reads only those.","correct":true,"trap":null,"rationale":"Naming the specific changed files gives the resumed session a targeted re-analysis while keeping the context that is still valid."},{"text":"Ask the resumed session which of its earlier findings it now believes are out of date, and have it re-check only those findings.","correct":false,"trap":"self-review","rationale":"The session can only judge its findings against its own old reads, so it has no way to know which files the commits changed."},{"text":"Have the resumed session re-read all 60 files before it answers anything, so every earlier result is refreshed from disk first.","correct":false,"trap":"over-engineering","rationale":"Most of the context is still valid, so full re-exploration wastes the work the session already did."}],"takeaway":"When resuming after code changes, tell the session exactly which files changed so it re-analyzes those instead of re-exploring everything."},{"id":"s4q14","domain":1,"ts":"1.7","type":"multi","prompt":"An engineer has two saved sessions. auth-trace mapped the login flow yesterday, and git log shows no commits to the auth code since then. ledger-review analyzed the ledger service six weeks ago, and that service has since been rewritten. She wants to continue both investigations today. Which two actions are appropriate? Select TWO.","options":[{"text":"Start a fresh session for the auth work and have it re-read the whole login flow, so nothing from yesterday is reused.","correct":false,"trap":"over-engineering","rationale":"The prior context is still accurate, so discarding it repeats work for no gain."},{"text":"Continue ledger-review with --resume, and trust the agent to notice the rewrite whenever it re-reads one of the files.","correct":false,"trap":"symptom-fix","rationale":"The resumed context is full of outdated results, and the agent will reason from them before it happens to re-read anything."},{"text":"Continue auth-trace with --resume auth-trace, because its earlier tool results still match the code on disk.","correct":true,"trap":null,"rationale":"Nothing in the auth code has changed, so the prior context is valid and resuming saves re-exploration."},{"text":"Resume ledger-review, then ask that session itself whether its six-week-old analysis still l
