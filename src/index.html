<title>Architect Prep</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered card column on warm paper. Ode palette from the AI Day Master Deck. Light only, by choice. */
:root {
  color-scheme: light;
  --bg: #f3f1ec;
  --surface: #fdfdfb;
  --ink: #3c2e2a;
  --body-ink: #5c504c;
  --muted: #857c78;
  --line: #e2ddd8;
  --accent: #3c2e2a;
  --accent-soft: #e6e3ee;
  --sun: #cee5ee;
  --sun-soft: #f1f0ec;
  --good: #4e7a5d;
  --good-soft: #e3e9e4;
  --bad: #a9564b;
  --bad-soft: #f4e6e2;
  --tile: #f3f1ec;
  --shadow: 0 12px 40px rgba(60,46,42,.08);
  --d1: #3c2e2a; --d2: #6f9a80; --d3: #9aa863; --d4: #6ea6bd; --d5: #9586bd;
  --t1: #e3e9e4; --t2: #e8ebd7; --t3: #cee5ee; --t4: #e6e3ee; --t5: #e9e4df;
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .84em; background: var(--t1); color: var(--ink); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.025em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--d5); outline-offset: 2px; }

.top { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 500; letter-spacing: -.01em; font-size: 1.05rem; background: none; border: 0; cursor: pointer; padding: 0; }
.brand-mark { width: 28px; height: 28px; display: block; }
.brand-mark svg, .hero-mark svg { width: 100%; height: 100%; display: block; }
.top-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; min-width: 0; }
.top-right .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }

main { max-width: 720px; margin: 0 auto; }
.screen { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(20px, 5vw, 36px); }
.eyebrow { font-size: .75rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 22px; font-weight: 500; background: var(--accent); transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
.btn { color: var(--surface); }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(60,46,42,.18); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { box-shadow: none; border-color: var(--muted); }
.btn.small { padding: 7px 14px; font-size: .85rem; }
.link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; }

/* Welcome */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero { min-height: calc(100svh - 120px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; position: relative; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 10% -10%; z-index: -1; background: radial-gradient(40% 45% at 35% 45%, var(--t4), transparent 70%), radial-gradient(35% 40% at 68% 55%, var(--t1), transparent 70%); filter: blur(30px); opacity: .9; }
.hero-mark { width: 72px; height: 72px; display: block; border-radius: 18px; box-shadow: 0 14px 36px rgba(60,46,42,.18); }
.hero .hero-title { font-size: clamp(2.8rem, 11vw, 5rem); }
.hero-form { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
.hero-input { display: flex; flex-direction: row; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); transition: border-color .15s; }
.hero-input:focus-within { border-color: var(--ink); }
.hero-input input { text-align: left; flex: 1; min-width: 0; width: auto; font-size: 1rem; outline: none; border: 0; background: transparent; border-radius: 999px; padding: 10px 14px; }
.hero-input .btn { flex: none; }
.hero-title { font-size: clamp(2.3rem, 7.5vw, 3.6rem); font-weight: 400; letter-spacing: -.035em; line-height: 1.05; }
.hero-title .hl { background: var(--t4); border-radius: .18em; padding: 0 .14em; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 500; font-size: .9rem; }
.field input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; transition: border-color .15s; }
.field input:focus { outline: none; border-color: var(--ink); }
.hint { font-size: .85rem; color: var(--muted); }
.err { color: var(--bad); font-size: .85rem; min-height: 1.2em; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fact { background: var(--t1); border-radius: 16px; padding: 10px 12px; }
.fact b { display: block; font-family: var(--display); font-weight: 400; letter-spacing: -.02em; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .75rem; color: var(--muted); }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, 1fr); } }

/* Path choice */
.path-screen { min-height: calc(100svh - 140px); display: flex; flex-direction: column; justify-content: center; gap: 28px; padding-block: 12px; }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 600px) { .paths { grid-template-columns: 1fr; } }
.path { text-align: left; cursor: pointer; border: 1.5px solid transparent; background: var(--surface); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; transition: transform .2s, border-color .2s, box-shadow .2s; box-shadow: var(--shadow); }
.path:hover { transform: translateY(-3px); border-color: var(--ink); }
.path-head { display: flex; align-items: center; gap: 10px; }
.path h2 { font-size: 1.2rem; }
.path p { color: var(--body-ink); font-size: .88rem; margin: 0; line-height: 1.35; }
.path ul { margin: 0; padding-left: 16px; color: var(--body-ink); font-size: .8rem; display: flex; flex-direction: column; gap: 1px; line-height: 1.35; }
.path-icon { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; }
.path-icon svg { width: 20px; height: 20px; }
.path.learn { background: var(--t1); }
.path.learn .path-icon { background: var(--surface); color: var(--ink); }
.path.prac { background: var(--t4); }
.path.prac .path-icon { background: var(--surface); color: var(--ink); }
.path .go { margin-top: 2px; font-weight: 500; font-size: .9rem; color: var(--ink); }
.path .last { font-size: .8rem; color: var(--muted); }
.fresh { justify-content: center; gap: 20px; margin-top: -10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
/* Learner levels */
.level { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.level.locked { opacity: .6; }
.level-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.level-head h2 { font-size: 1.25rem; }
.lessons { display: flex; flex-direction: column; gap: 6px; }
.lesson { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: .92rem; }
.lesson .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lesson .ln { flex: 1; }
.lesson .lc { color: var(--muted); font-size: .8rem; }
.lesson.done .lc { color: var(--good); }
.lesson.next { border-color: var(--ink); }
.lesson[disabled] { cursor: not-allowed; }
.insight.unlock { background: var(--t4); }

/* Intro walkthrough */
.intro { min-height: 440px; display: flex; flex-direction: column; gap: 20px; }
.intro-stage { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.intro-stage h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .3s, background .3s; }
.dots i.on { width: 24px; background: var(--ink); }
.pop { animation: pop .5s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(10px); } to { opacity: 1; transform: none; } }
.big-num { font-family: var(--display); font-weight: 300; letter-spacing: -.04em; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bignums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.bignums > div { background: var(--tile); border-radius: 18px; padding: 16px; }
.bignums small { color: var(--muted); }
.dombar { display: flex; height: 44px; border-radius: 14px; overflow: hidden; gap: 3px; }
.dombar > div { height: 100%; transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; display: grid; place-items: center; color: var(--ink); font-weight: 500; font-size: .85rem; font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.domlist { display: flex; flex-direction: column; gap: 8px; }
.domlist div { display: flex; align-items: baseline; gap: 10px; font-size: .95rem; }
.domlist .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; transform: translateY(1px); }
.domlist em { font-style: normal; color: var(--muted); font-size: .85rem; }
.domlist b { font-variant-numeric: tabular-nums; min-width: 2.6em; font-weight: 500; }
.scen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .scen-grid { grid-template-columns: repeat(2, 1fr); } }
.scen { border: 1.5px dashed var(--line); border-radius: 18px; padding: 14px; font-size: .9rem; font-weight: 500; transition: all .4s; min-height: 76px; }
.scen small { display: block; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.scen.lit { border-style: solid; border-color: var(--t3); background: var(--t3); transform: translateY(-2px); }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { display: flex; gap: 14px; align-items: flex-start; background: var(--tile); border-radius: 16px; padding: 14px 16px; }
.rule .n { font-family: var(--display); font-weight: 400; font-size: 1.2rem; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; }
.rule b { display: block; }
.rule span { color: var(--muted); font-size: .92rem; }
.traps { display: flex; flex-wrap: wrap; gap: 8px; }
.trapchip { border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 500; background: var(--bad-soft); color: var(--ink); }

/* Quiz card */
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--ink); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--tile); color: var(--ink); }
.tag .sw { width: 8px; height: 8px; border-radius: 50%; }
.qprompt { font-size: clamp(1.1rem, 3.4vw, 1.3rem); font-weight: 400; letter-spacing: -.01em; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt[disabled] { cursor: default; }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 500; font-size: .85rem; background: var(--tile); color: var(--muted); transition: all .15s; }
.opt .txt { flex: 1; min-width: 0; padding-top: 3px; }
.opt.sel { border-color: var(--ink); background: var(--t4); }
.opt.sel .key { background: var(--ink); color: var(--surface); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt.dim .key { opacity: .5; }
.opt.dim .txt { color: var(--muted); }
[hidden] { display: none !important; }
.opt .rat { display: block; margin-top: 8px; font-size: .9rem; color: var(--muted); }
.opt .rat .trapchip { padding: 2px 8px; font-size: .72rem; margin-right: 6px; }
.opt .rat .okchip { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: .72rem; font-weight: 500; background: var(--good); color: var(--surface); margin-right: 6px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.feedback { border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--t2); }
.feedback h3 { font-size: 1.2rem; font-weight: 500; }
.feedback .rulebox { border-left: 3px solid var(--ink); padding-left: 12px; font-weight: 600; }
.scenario-box { background: var(--tile); border-radius: 16px; padding: 14px 16px; font-size: .95rem; color: var(--muted); }
.scenario-box b { color: var(--ink); }
.conf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; font-weight: 500; }
.pill.on { border-color: var(--ink); background: var(--t4); }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .85rem; }
.timer.over { color: var(--bad); }
.kbd-hint { font-size: .78rem; color: var(--muted); }
@media (hover: none) { .kbd-hint { display: none; } }

/* Setup + results */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; }
.choice span { font-size: .85rem; color: var(--muted); }
.choice.on { border-color: var(--ink); background: var(--t4); }
.score { font-family: var(--display); font-weight: 300; letter-spacing: -.05em; font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; font-size: .9rem; }
.bar-row .lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
.bar-row .lbl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.bar > div { height: 100%; border-radius: 99px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.insight { background: var(--t3); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.insight b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; }
.revisit { display: flex; flex-direction: column; gap: 10px; }
.revisit div { background: var(--tile); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.revisit b { display: block; }
.section-title { font-size: 1.15rem; font-weight: 500; }

/* Confetti */
.burst { position: fixed; pointer-events: none; z-index: 50; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: fly .8s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .burst { display: none; }
}
</style>

<script>
const DATA = /*__DATA__*/null;

const DOMAINS = {
  1: { name: "Agentic Architecture & Orchestration", short: "Agentic architecture", weight: 27 },
  2: { name: "Tool Design & MCP Integration", short: "Tools & MCP", weight: 18 },
  3: { name: "Claude Code Configuration & Workflows", short: "Claude Code config", weight: 20 },
  4: { name: "Prompt Engineering & Structured Output", short: "Prompts & output", weight: 20 },
  5: { name: "Context Management & Reliability", short: "Context & reliability", weight: 15 },
};
const TRAPS = {
  "system-prompt-enforcement": ["Prompt-only enforcement", "Asking nicely in the system prompt when the rule must hold every time. Use hooks, gates, schemas or tool_choice instead."],
  "few-shot-overload": ["Few-shot overload", "Piling on more examples when the real gap is unclear criteria or a missing structure."],
  "over-engineering": ["Over-engineering", "Reaching for classifiers, new infrastructure or extra agents when a small targeted change fixes it."],

  "tool-bloat": ["Tool bloat", "Giving an agent more tools than its job needs, which makes selection worse."],
  "batch-for-blocking": ["Batch API for blocking work", "Using the Batches API for work someone is waiting on. Batches can take up to 24 hours."],
  "self-review": ["Self-review", "Asking the same session to check its own work, where it shares the same blind spots."],
  "text-signal-loops": ["Text-signal loops", "Ending an agent loop by parsing the model's words instead of checking stop_reason."],
  "symptom-fix": ["Fixing the symptom", "Patching what you can see instead of the thing that is actually broken."],
  "wrong-scope": ["Wrong scope", "Putting config, rules or context at the wrong level, so it reaches too many places or too few."],
};
const SCENARIO_NAMES = ["Customer Support Resolution Agent", "Code Generation with Claude Code", "Multi-Agent Research System", "Developer Productivity with Claude", "Claude Code for Continuous Integration", "Structured Data Extraction"];

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CODEY = /(\b[a-z]+(?:_[a-z]+)+\b|\bCLAUDE\.md\b|\.mcp\.json\b|(?:~\/)?\.claude\/[\w\/.-]*|(?<![\w-])--?[a-z][\w-]*(?=[\s.,)]|$)|(?<![\w.])\/[a-z][\w-]+(?=[\s.,)]|$))/g;
const fmt = s => { const t = esc(s); return /`/.test(s) ? t.replace(/`([^`]+)`/g, "<code>$1</code>") : t.replace(CODEY, "<code>$1</code>"); };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("ap:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("ap:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("ap:" + k); } catch {} },
};
const KEYS = "ABCDE";
/* Saved progress is keyed by the email entered on the welcome screen. It lives in this browser
   and syncs to the Worker (/api/progress), so the same email picks it up on any device. Newest save wins. */
const SYNC_KEYS = ["runL", "runP", "lastL", "lastP", "seenP", "missP", "learnP"];
const saved = {
  key: k => k + ":" + (store.get("email") || "").toLowerCase(),
  get: k => store.get(saved.key(k)),
  set: (k, v) => { store.set(saved.key(k), v); sync.touch(); },
  del: k => { store.del(saved.key(k)); sync.touch(); },
};
const sync = {
  timer: null,
  url: () => "/api/progress?email=" + encodeURIComponent((store.get("email") || "").toLowerCase()),
  snapshot() { const o = { updatedAt: store.get(saved.key("updatedAt")) || 0 }; SYNC_KEYS.forEach(k => o[k] = saved.get(k)); return o; },
  touch() { store.set(saved.key("updatedAt"), Date.now()); clearTimeout(sync.timer); sync.timer = setTimeout(sync.push, 800); },
  push(keepalive) {
    clearTimeout(sync.timer); sync.timer = null;
    if (!store.get("email") || location.protocol === "file:") return;
    fetch(sync.url(), { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(sync.snapshot()), keepalive: !!keepalive }).catch(() => {});
  },
  // Fetch the server copy. Returns true when it was newer and replaced what this browser had.
  async pull() {
    if (!store.get("email") || location.protocol === "file:") return false;
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(sync.url(), { signal: ctl.signal, cache: "no-store" }); clearTimeout(t);
      if (!r.ok) return false;
      const remote = await r.json(), local = store.get(saved.key("updatedAt")) || 0;
      if ((remote.updatedAt || 0) > local) {
        SYNC_KEYS.forEach(k => remote[k] == null ? store.del(saved.key(k)) : store.set(saved.key(k), remote[k]));
        store.set(saved.key("updatedAt"), remote.updatedAt);
        return true;
      }
      if (local > (remote.updatedAt || 0)) sync.push();
    } catch {}
    return false;
  },
};
// Pull, then redraw the path screen if it is showing and the server had newer progress.
const pullAndRefresh = () => sync.pull().then(changed => { if (changed && $(".path-screen")) choosePath(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.timer) sync.push(true); else if (document.visibilityState === "visible" && $(".path-screen")) pullAndRefresh(); });
function saveL(next) { saved.set("runL", { level: L.level, lesson: L.lesson, review: L.review, ids: L.concepts.map(c => c.id), i: next.i, phase: next.phase, results: L.results }); }
function saveP(i) { saved.set("runP", { opts: P.opts, deck: P.deck.map(x => [x.s.id, x.q.id]), i, log: P.log, elapsed: (Date.now() - P.t0) / 1000, budget: P.budget }); }
function resumeL(r) {
  const byId = Object.fromEntries(DATA.learner.concepts.map(c => [c.id, c]));
  const level = r.level || 1;
  const concepts = r.ids.map(id => byId[id]).filter(c => c && (level === 1 || c.applied));
  if (!concepts.length) { saved.del("runL"); return learnMap(); }
  L = { level, lesson: r.lesson ?? null, review: r.review || [], concepts, i: r.i, phase: r.phase, results: r.results || {} };
  L.i >= L.concepts.length ? learnResults() : learnCard();
}
function resumeP(r) {
  const sc = Object.fromEntries(DATA.practitioner.scenarios.map(x => [x.id, x]));
  const deck = r.deck.map(([sid, qid]) => { const sx = sc[sid]; const q = sx && sx.questions.find(q => q.id === qid); return q && { s: sx, q }; }).filter(Boolean);
  if (!deck.length) { saved.del("runP"); return pracSetup(); }
  P = { opts: r.opts, deck, i: r.i, log: r.log || [], t0: Date.now() - (r.elapsed || 0) * 1000, budget: r.budget || deck.length * 120, timerId: null };
  P.i >= P.deck.length ? pracResults() : pracCard();
}

/* ---------- Practitioner progress: which questions you have seen and which to review ---------- */
const allP = () => DATA.practitioner.scenarios.flatMap(s => s.questions.map(q => ({ s, q })));
const seenSet = () => new Set(saved.get("seenP") || []);
const missSet = () => new Set(saved.get("missP") || []);
function markP(id, ok) {
  const seen = seenSet(); seen.add(id); saved.set("seenP", [...seen]);
  const miss = missSet(); ok ? miss.delete(id) : miss.add(id); saved.set("missP", [...miss]);
}
// Unseen questions first, then ones you have seen; random order within each group.
function pickFresh(pool, n) {
  const seen = seenSet();
  return [...shuffle(pool.filter(x => !seen.has(x.q.id))), ...shuffle(pool.filter(x => seen.has(x.q.id)))].slice(0, n);
}
// Keep each scenario's questions together, like the real exam.
function groupByScenario(items) {
  const order = [], by = {};
  items.forEach(x => { if (!by[x.s.id]) { by[x.s.id] = []; order.push(x.s.id); } by[x.s.id].push(x); });
  return order.flatMap(id => by[id]);
}
const PMODES = {
  quick: { label: "Quick set", start: "Start quick set", n: 12 },
  exam: { label: "Exam simulation", start: "Start the exam", n: 60 },
  focus: { label: "Focus", start: "Start focus set", n: 12 },
  missed: { label: "Review missed", start: "Start review", n: 30 },
};
function buildDeck(opts) {
  const pool = allP();
  if (opts.mode === "exam") return shuffle(DATA.practitioner.scenarios).slice(0, 4).flatMap(s => pickFresh(s.questions.map(q => ({ s, q })), 15));
  if (opts.mode === "missed") { const m = missSet(); return groupByScenario(shuffle(pool.filter(x => m.has(x.q.id))).slice(0, PMODES.missed.n)); }
  if (opts.mode === "focus") { const f = opts.focus || "d1"; return groupByScenario(pickFresh(pool.filter(x => f[0] === "d" ? x.q.domain === +f.slice(1) : x.s.id === f), PMODES.focus.n)); }
  return groupByScenario(pickFresh(pool, PMODES.quick.n));
}

/* ---------- Learner progress: levels made of short lessons, one lesson per domain ---------- */
const LEVELS = {
  1: { name: "Foundations", desc: "Plain explanations and friendly questions." },

  3: { name: "Exam bridge", desc: "Exam-style questions with traps, from the Practitioner bank." },

const UNLOCK = 0.7;
const levelConcepts = lvl => DATA.learner.concepts.filter(c => lvl === 1 || (c.applied && c.applied.length === 2));
const lessonsOf = lvl => [1, 2, 3, 4, 5].map(d => ({ domain: d, concepts: levelConcepts(lvl).filter(c => c.domain === d) })).filter(x => x.concepts.length);
const learnRec = lvl => (saved.get("learnP") || {})[lvl] || {};
function levelStats(lvl) {
  const cs = levelConcepts(lvl), rec = learnRec(lvl);
  const tried = cs.filter(c => rec[c.id]).length, first = cs.filter(c => rec[c.id] === "first").length;
  return { total: cs.length, tried, first, done: cs.length > 0 && tried === cs.length, rate: tried ? first / tried : 0 };
}
const unlocked = lvl => lvl === 1 || (levelStats(lvl - 1).done && levelStats(lvl - 1).rate >= UNLOCK);
const lessonDone = (lvl, lesson) => { const rec = learnRec(lvl); return lesson.concepts.every(c => rec[c.id]); };
// The next thing to study: the first unfinished lesson in the highest unlocked level.
function nextLesson() {
  for (const lvl of [2, 1]) {
    if (!unlocked(lvl)) continue;
    const ls = lessonsOf(lvl), k = ls.findIndex(l => !lessonDone(lvl, l));
    if (k >= 0) return { level: lvl, lesson: k };
  }
  return null;
}
const hasLearnProgress = () => Object.keys(learnRec(1)).length > 0;

  $("#tour").onclick = () => intro(0);
  const n = $("#nextL"); if (n) n.onclick = () => startLesson(nx.level, nx.lesson);
  app.querySelectorAll(".lesson[data-k]").forEach(b => b.onclick = () => startLesson(+b.dataset.lvl, +b.dataset.k));
  app.querySelectorAll("[data-review]").forEach(b => b.onclick = () => { const lvl = +b.dataset.review; startConcepts(lvl, null, levelConcepts(lvl).filter(c => ["miss", "second"].includes(learnRec(lvl)[c.id])).slice(0, 10)); });
  const br = $("#bridge"); if (br) br.onclick = () => pracStart({ mode: "quick", timed: false });
}
function startNext() { const nx = nextLesson(); nx ? startLesson(nx.level, nx.lesson) : learnMap(); }
// A lesson is one domain's concepts, plus up to two earlier ideas from this level that you missed.
function startLesson(level, k) {
  const lesson = lessonsOf(level)[k], rec = learnRec(level), here = new Set(lesson.concepts.map(c => c.id));
  const carry = levelConcepts(level).filter(c => !here.has(c.id) && ["miss", "second"].includes(rec[c.id])).slice(0, 2);
  startConcepts(level, k, [...lesson.concepts, ...carry], carry.map(c => c.id));
}
function startConcepts(level, lesson, concepts, review = []) {
  L = { level, lesson, review, concepts, i: 0, phase: 0, results: {} };
  saveL({ i: 0, phase: 0 });
  learnCard();
}
// Kept for the results screen's "practice the ones I missed" button.
function learnStart(onlyIds) { startConcepts(L ? L.level : 1, null, levelConcepts(L ? L.level : 1).filter(c => onlyIds.includes(c.id))); }
function learnCard() {
  const c = L.concepts[L.i], q = (L.level === 2 ? c.applied : c.questions)[L.phase];
  const where = L.lesson != null ? `Level ${L.level} · lesson ${L.lesson + 1}` : `Level ${L.level} · review`;
  const order = shuffle([0, 1, 2, 3]);
  const total = L.concepts.length, pct = (L.i / total) * 100;
  show(`<div class="stack">
    <div class="progress" aria-hidden="true"><div style="width:${pct}%"></div></div>
    <div class="card stack" style="gap:20px">
      <div class="qmeta"><span>${where} · ${L.i + 1} of ${total}${L.phase ? " · second try" : ""}${L.review.includes(c.id) ? " · review" : ""}</span>${domTag(c.domain)}</div>
      <p class="qprompt">${fmt(q.prompt)}</p>
      <div class="opts">${order.map((o, k) => `<button class="opt" type="button" data-o="${o}"><span class="key">${KEYS[k]}</span><span class="txt">${fmt(q.options[o])}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <span class="kbd-hint">Tip: press A to D to answer.</span>
    </div></div>`);
  const btns = [...app.querySelectorAll(".opt")];
  const answer = btn => {
    if (btns[0].disabled) return;
    const o = +btn.dataset.o, ok = o === q.answer;
    btns.forEach(b => { b.disabled = true; const bo = +b.dataset.o; if (bo === q.answer) b.classList.add("right"); else if (b === btn) b.classList.add("wrong"); else b.classList.add("dim"); });
    const r = L.results[c.id] || (L.results[c.id] = { domain: c.domain, first: null, second: null });
    if (L.phase === 0) r.first = ok; else r.second = ok;
    saveL(ok || L.phase === 1 ? { i: L.i + 1, phase: 0 } : { i: L.i, phase: 1 });
    const fb = $("#fb");
    if (ok) {
      burst(btn);
      fb.innerHTML = `<div class="feedback good"><h3>${L.phase ? "Now you have it." : "Nice, that's right."}</h3><p>${fmt(q.why)}</p><div class="rulebox">${fmt(c.rule)}</div><div class="row"><span class="spacer"></span><button class="btn" id="nx" type="button">${L.i + 1 < total ? "Next concept" : "See my results"}</button></div></div>`;
      $("#nx").onclick = nextConcept; $("#nx").focus();
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); nextConcept(); } };
    } else if (L.phase === 0) {
      btn.classList.add("shake");
      fb.innerHTML = `<div class="feedback bad"><span class="eyebrow">Here's the idea</span><h3>${esc(c.title)}</h3><p>${fmt(c.explain)}</p><div class="rulebox">${fmt(c.rule)}</div><p class="hint">${fmt(q.why)}</p><div class="row"><span class="spacer"></span><button class="btn" id="nx" type="button">Try a similar one</button></div></div>`;
      const sib = () => { L.phase = 1; learnCard(); };
      $("#nx").onclick = sib; $("#nx").focus();
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); sib(); } };
    } else {
      btn.classList.add("shake");
      fb.innerHTML = `<div class="feedback bad"><h3>Not quite. We'll come back to this one.</h3><p>${fmt(q.why)}</p><div class="rulebox">${fmt(c.rule)}</div><div class="row"><span class="spacer"></span><button class="btn" id="nx" type="button">${L.i + 1 < total ? "Next concept" : "See my results"}</button></div></div>`;
      $("#nx").onclick = nextConcept; $("#nx").focus();
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); nextConcept(); } };
    }
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  btns.forEach(b => b.onclick = () => answer(b));
  keyHandler = e => { const k = "abcd".indexOf(e.key.toLowerCase()); const n = "1234".indexOf(e.key); const idx = k >= 0 ? k : n; if (idx >= 0 && btns[idx]) answer(btns[idx]); };
}
function nextConcept() { L.phase = 0; L.i++; if (L.i >= L.concepts.length) learnResults(); else learnCard(); }
function learnResults() {
  keyHandler = null;
  const res = L.concepts.map(c => ({ c, r: L.results[c.id] || {} }));
  const first = res.filter(x => x.r.first).length;
  const second = res.filter(x => !x.r.first && x.r.second).length;
  const missed = res.filter(x => !x.r.first && !x.r.second);
  const byDom = {};
  res.forEach(({ c, r }) => { const d = byDom[c.domain] || (byDom[c.domain] = { ok: 0, n: 0 }); d.n++; if (r.first) d.ok++; else if (r.second) d.ok += .5; });
  const doms = Object.keys(byDom).map(Number).sort();
  const weakest = doms.slice().sort((a, b) => byDom[a].ok / byDom[a].n - byDom[b].ok / byDom[b].n)[0];

  const all = saved.get("learnP") || {}, rec = all[L.level] || (all[L.level] = {});

  saved.del("runL"); saved.set("lastL", `Level ${L.level}: ${first} of ${L.concepts.length} on the first try`);
  const justUnlocked = !before2 && unlocked(2) ? 2 : !before3 && unlocked(3) ? 3 : 0;
  const nx = nextLesson();
  show(`<div class="card stack" style="gap:24px">
    <span class="eyebrow">Learner results</span>
    <div class="row" style="align-items:flex-end;gap:20px"><div class="score">${first}<span style="font-size:.4em;color:var(--muted)">/${L.concepts.length}</span></div><p class="lede">concepts right on the first try. ${second ? `You fixed ${second} more on the second try.` : ""}</p></div>
    <div class="bars">${doms.map(d => { const p = Math.round(byDom[d].ok / byDom[d].n * 100); return `<div class="bar-row"><div class="lbl"><span>${esc(DOMAINS[d].name)}</span><span>${p}%</span></div><div class="bar"><div style="width:${p}%;background:var(--d${d})"></div></div></div>`; }).join("")}</div>
    ${missed.length ? `<div class="stack" style="gap:10px"><h3 class="section-title">Ideas to revisit</h3><div class="revisit">${missed.map(({ c }) => `<div><b>${esc(c.title)}</b>${fmt(c.rule)}</div>`).join("")}</div></div>`
      : `<div class="insight"><b>Every concept landed.</b><span>You are ready for exam-style questions. The Practitioner path uses harder scenarios where every wrong answer is a believable trap.</span></div>`}
    ${missed.length && weakest ? `<div class="insight"><b>Focus next on ${esc(DOMAINS[weakest].short)}.</b><span>It was your lowest domain this round.</span></div>` : ""}
    ${justUnlocked ? `<div class="insight unlock"><b>Level ${justUnlocked} unlocked: ${LEVELS[justUnlocked].name}.</b><span>${LEVELS[justUnlocked].desc}</span></div>` : ""}
    <div class="row">${nx ? `<button class="btn" id="nextL" type="button">Next lesson</button>` : justUnlocked === 3 || unlocked(3) ? `<button class="btn" id="toPrac" type="button">Try exam-style questions</button>` : ""}${missed.length ? `<button class="btn ghost" id="again" type="button">Practice the ${missed.length} I missed</button>` : ""}<button class="btn ghost" id="map" type="button">All levels</button></div>
  </div>`);
  const a = $("#again"); if (a) a.onclick = () => learnStart(missed.map(x => x.c.id));
  const n = $("#nextL"); if (n) n.onclick = () => startLesson(nx.level, nx.lesson);
  const tp = $("#toPrac"); if (tp) tp.onclick = pracSetup;
  $("#map").onclick = learnMap;
  if (first === L.concepts.length || justUnlocked) burst($(".score"));
}

/* ---------- 5. Practitioner ---------- */
let P = null;
function pracSetup() {
  keyHandler = null; topbar();
  const nP = allP().length, seenN = seenSet().size, missN = missSet().size;
  const opts = { mode: store.get("pmode") || "quick", focus: store.get("pfocus") || "d1", timed: store.get("timed") ?? false };
  if (opts.mode === "missed" && !missN) opts.mode = "quick";
  const focusChips = [...[1, 2, 3, 4, 5].map(d => [`d${d}`, DOMAINS[d].short]), ...DATA.practitioner.scenarios.map(x => [x.id, x.title])];
  const render = () => {
    const exam = opts.mode === "exam";
    show(`<div class="card stack" style="gap:20px">
      <span class="eyebrow">Practitioner reps</span>
      <h1 style="font-size:clamp(1.7rem,5.5vw,2.2rem)">Pick a session.</h1>
      <p class="lede">${seenN ? `You have seen ${seenN} of ${nP} questions${missN ? ` and have ${missN} to review` : ""}. New questions come first.` : `${nP} questions in six scenarios. New questions come first, and option order is shuffled every time.`}</p>
      <div class="options-grid">
        <button class="choice ${opts.mode === "quick" ? "on" : ""}" data-mode="quick" type="button"><b>Quick set</b><span>12 questions, about 15 minutes</span></button>
        <button class="choice ${exam ? "on" : ""}" data-mode="exam" type="button"><b>Exam simulation</b><span>60 questions from 4 scenarios, 120 minutes</span></button>
        <button class="choice ${opts.mode === "focus" ? "on" : ""}" data-mode="focus" type="button"><b>Focus</b><span>12 questions on one domain or scenario</span></button>
        <button class="choice ${opts.mode === "missed" ? "on" : ""}" data-mode="missed" type="button" ${missN ? "" : "disabled"}><b>Review missed</b><span>${missN ? `${missN} question${missN > 1 ? "s" : ""} you got wrong` : "Nothing to review yet"}</span></button>
      </div>
      ${opts.mode === "focus" ? `<div class="stack" style="gap:8px"><b>Focus on</b><div class="chips">${focusChips.map(([k, l]) => `<button class="pill ${opts.focus === k ? "on" : ""}" data-focus="${k}" type="button">${esc(l)}</button>`).join("")}</div></div>` : ""}
      ${exam ? `<p class="hint">Timed like the real exam: 2 minutes per question. Each scenario's questions come together.</p>` : `<div class="stack" style="gap:8px"><b>Pace</b><div class="options-grid">
        <button class="choice ${!opts.timed ? "on" : ""}" data-timed="0" type="button"><b>Untimed</b><span>Take as long as you need</span></button>
        <button class="choice ${opts.timed ? "on" : ""}" data-timed="1" type="button"><b>Exam pace</b><span>A clock with 2 minutes per question</span></button>
      </div></div>`}
      <div class="row"><button class="btn" id="startP" type="button">${PMODES[opts.mode].start}</button></div>

    app.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => { opts.focus = b.dataset.focus; store.set("pfocus", opts.focus); render(); });
    app.querySelectorAll("[data-timed]").forEach(b => b.onclick = () => { opts.timed = b.dataset.timed === "1"; store.set("timed", opts.timed); render(); });

}
function pracStart(opts, onlyIds) {
  const deck = onlyIds ? groupByScenario(shuffle(allP().filter(x => onlyIds.includes(x.q.id)))) : buildDeck(opts);
  if (!deck.length) return pracSetup();
  P = { opts, deck, i: 0, log: [], t0: Date.now(), budget: deck.length * 120, timerId: null };
  saveP(0);
  pracCard();
}
function fmtTime(sec) { const s = Math.abs(sec); return (sec < 0 ? "-" : "") + Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
function pracCard() {
  const { s, q } = P.deck[P.i];
  const prev = P.deck[P.i - 1];
  const newScenario = !prev || prev.s.id !== s.id;
  const order = shuffle(q.options.map((_, i) => i));
  const multi = q.type === "multi", need = multi ? 2 : 1;
  const sel = new Set(); let conf = null, done = false;
  const pct = (P.i / P.deck.length) * 100;
  show(`<div class="stack">
    <div class="progress" aria-hidden="true"><div style="width:${pct}%"></div></div>
    <div class="card stack" style="gap:18px">
      <div class="qmeta"><span>Question ${P.i + 1} of ${P.deck.length}</span><span class="row" style="gap:8px">${P.opts.timed ? `<span class="timer" id="timer"></span>` : ""}${domTag(q.domain)}</span></div>
      ${newScenario
        ? `<div class="scenario-box"><b>Scenario: ${esc(s.title)}</b><br>${fmt(s.setup)}</div>`
        : `<details class="scenario-box"><summary><b>Scenario: ${esc(s.title)}</b></summary><p style="margin-top:6px">${fmt(s.setup)}</p></details>`}
      <p class="qprompt">${fmt(q.prompt)}</p>
      <div class="opts">${order.map((o, k) => `<button class="opt" type="button" data-o="${o}" aria-pressed="false"><span class="key">${KEYS[k]}</span><span class="txt">${fmt(q.options[o].text)}</span></button>`).join("")}</div>
      <div class="row">
        <div class="conf"><span>How sure are you?</span><button class="pill" data-c="sure" type="button">Sure</button><button class="pill" data-c="unsure" type="button">Guessing</button></div>
        <span class="spacer"></span>
        <button class="btn" id="submit" type="button" disabled>Check answer</button>
      </div>
      <div id="fb"></div>
      <span class="kbd-hint">Tip: press A to ${KEYS[order.length - 1]} to pick, Enter to check.</span>
    </div></div>`);
  const btns = [...app.querySelectorAll(".opt")], submit = $("#submit");
  if (P.opts.timed) {
    clearInterval(P.timerId);
    const tick = () => { const el = $("#timer"); if (!el) return clearInterval(P.timerId); const left = P.budget - (Date.now() - P.t0) / 1000; el.textContent = fmtTime(left) + " left"; el.classList.toggle("over", left < 0); };

    submit.disabled = sel.size !== need;
  };
  btns.forEach(b => b.onclick = () => toggle(b));

    markP(q.id, ok);

      b.disabled = true; const o = +b.dataset.o, opt = q.options[o];
      b.classList.remove("sel");

      const chip = opt.correct ? `<span class="okchip">Correct</span>` : `<span class="trapchip">${esc((TRAPS[opt.trap] || ["Trap"])[0])}</span>`;
      b.querySelector(".txt").insertAdjacentHTML("beforeend", `<span class="rat">${chip}${fmt(opt.rationale)}</span>`);

    submit.hidden = true;
    const last = P.i + 1 >= P.deck.length;
    $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}"><h3>${ok ? "Correct." : multi ? "Not both right." : "Not this time."}</h3><div class="rulebox">${fmt(q.takeaway)}</div><div class="row"><span class="spacer"></span><button class="btn" id="nx" type="button">${last ? "See my results" : "Next question"}</button></div></div>`;
    if (ok) burst(app.querySelector(".opt.right"));
    const nx = () => { P.i++; if (P.i >= P.deck.length) pracResults(); else pracCard(); };
    $("#nx").onclick = nx; $("#nx").focus({ preventScroll: true });
    $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" });
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); nx(); } };
  };
  submit.onclick = check;
  keyHandler = e => {
    const k = "abcde".indexOf(e.key.toLowerCase()), n = "12345".indexOf(e.key), idx = k >= 0 ? k : n;
    if (idx >= 0 && btns[idx]) toggle(btns[idx]);

}
function pracResults() {
  keyHandler = null; clearInterval(P.timerId);
  const n = P.log.length, ok = P.log.filter(x => x.ok).length, pct = Math.round(ok / n * 100);
  const byDom = {};
  P.log.forEach(x => { const d = byDom[x.domain] || (byDom[x.domain] = { ok: 0, n: 0 }); d.n++; if (x.ok) d.ok++; });
  const doms = Object.keys(byDom).map(Number).sort();
  const trapCount = {};
  P.log.forEach(x => x.traps.forEach(t => trapCount[t] = (trapCount[t] || 0) + 1));
  const topTraps = Object.entries(trapCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const sure = P.log.filter(x => x.conf === "sure"), guess = P.log.filter(x => x.conf === "unsure");
  const sureAcc = sure.length ? Math.round(sure.filter(x => x.ok).length / sure.length * 100) : null;
  const guessAcc = guess.length ? Math.round(guess.filter(x => x.ok).length / guess.length * 100) : null;
  const elapsed = (Date.now() - P.t0) / 1000;
  const missed = P.log.filter(x => !x.ok).map(x => x.id);
  saved.del("runP"); saved.set("lastP", `${pct}%, ${ok} of ${n} correct${P.opts.mode ? ` (${PMODES[P.opts.mode].label.toLowerCase()})` : ""}`);
  const verdict = pct >= 80 ? "Exam-ready pace. Keep the reps going." : pct >= 70 ? "Close to the line. Tighten your weakest domain." : "Building up. Review the traps below, then go again.";
  show(`<div class="card stack" style="gap:24px">
    <span class="eyebrow">Practitioner results</span>
    <div class="row" style="align-items:flex-end;gap:20px"><div class="score">${pct}%</div><p class="lede">${ok} of ${n} correct${P.opts.timed ? ` in ${fmtTime(elapsed)} (budget ${fmtTime(P.budget)})` : ""}. ${verdict}</p></div>
    <div class="stack" style="gap:12px"><h3 class="section-title">By domain</h3><div class="bars">${doms.map(d => { const p = Math.round(byDom[d].ok / byDom[d].n * 100); return `<div class="bar-row"><div class="lbl"><span>${esc(DOMAINS[d].name)}</span><span>${byDom[d].ok}/${byDom[d].n}</span></div><div class="bar"><div style="width:${p}%;background:var(--d${d})"></div></div></div>`; }).join("")}</div></div>
    ${topTraps.length ? `<div class="stack" style="gap:10px"><h3 class="section-title">The traps that caught you</h3>${topTraps.map(([t, c], i) => `<div class="insight" ${i ? 'style="background:var(--tile)"' : ""}><b>${esc(TRAPS[t][0])} · ${c}×</b><span>${esc(TRAPS[t][1])}</span></div>`).join("")}</div>`
      : `<div class="insight"><b>No traps caught you.</b><span>Every wrong option was a named trap, and you avoided all of them.</span></div>`}
    ${sureAcc !== null || guessAcc !== null ? `<div class="stack" style="gap:6px"><h3 class="section-title">Confidence check</h3><p class="lede" style="font-size:.95rem">${sureAcc !== null ? `When you felt sure, you were right ${sureAcc}% of the time (${sure.length} questions). ` : ""}${guessAcc !== null ? `When you were guessing, you were right ${guessAcc}% of the time (${guess.length} questions).` : ""}${sureAcc !== null && sureAcc < 75 ? " Some confident answers were wrong, so slow down on questions that feel easy." : ""}</p></div>` : ""}
    <div class="row">${missed.length ? `<button class="btn" id="retry" type="button">Retry the ${missed.length} I missed</button>` : ""}<button class="btn ${missed.length ? "ghost" : ""}" id="newDraw" type="button">New session</button><button class="btn ghost" id="toLearn" type="button">Learner path</button></div>
  </div>`);
  const r = $("#retry"); if (r) r.onclick = () => pracStart(P.opts, missed);
  $("#newDraw").onclick = pracSetup; $("#toLearn").onclick = () => intro(0);
  if (pct >= 80) burst($(".score"));
}

/* ---------- boot ---------- */
if (store.get("email")) { choosePath(); pullAndRefresh(); } else welcome();
</script>
